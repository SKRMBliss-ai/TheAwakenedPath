<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — SKRM Bliss AI</title>
    <meta name="description" content="This page could not be found. Head back to the home page or open Mind Gym." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Theme bootstrap. Mirrors the one in index.html and /twinsouls so a
         visitor who chose a mode elsewhere on skrmblissai.in lands here already
         in that mode. Key is duplicated in src/lib/siteTheme.ts — keep equal. -->
    <script>
      (function () {
        var m = 'light';
        try {
          var v = localStorage.getItem('si-theme') || localStorage.getItem('awakened-theme');
          if (v === 'dark' || v === 'light') m = v;
        } catch (e) {}
        var d = document.documentElement;
        d.dataset.siTheme = m;
        if (m === 'dark') { d.classList.add('dark'); }
      })();
    </script>

    <!-- Deliberately self-contained: no external CSS, fonts or images. This page
         is what a visitor sees when an asset request fails, so it must never
         depend on the very assets that may be missing. -->
    <style>
      :root {
        --bg: #F4F1EA; --surface: #FFFFFF; --text: #241C33; --muted: #5C5468;
        --accent: #4A3260; --accent-2: #7A5F44; --border: rgba(36, 28, 51, 0.14);
      }
      html.dark {
        --bg: #15120F; --surface: #1E1A24; --text: #EFEAF6; --muted: #A79FB4;
        --accent: #D4CDE8; --accent-2: #C4913A; --border: rgba(239, 234, 246, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
        background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6; -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 34rem; text-align: center; }
      .eyebrow {
        font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.28em;
        text-transform: uppercase; color: var(--muted); margin: 0 0 1.25rem;
      }
      h1 {
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-weight: 400; font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.2; margin: 0 0 0.875rem; color: var(--text);
      }
      p.lede { font-size: 1rem; color: var(--muted); margin: 0 auto 2rem; max-width: 26rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a.btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0.75rem 1.5rem; border-radius: 999px;
        font-size: 0.9375rem; font-weight: 600; text-decoration: none;
        border: 1.5px solid transparent; transition: opacity .2s ease, transform .2s ease;
      }
      a.btn-primary { background: var(--accent); color: var(--bg); }
      a.btn-secondary { border-color: var(--border); color: var(--text); }
      a.btn:hover { opacity: 0.88; }
      a.btn:active { transform: scale(0.97); }
      a.btn:focus-visible, a.link:focus-visible {
        outline: 3px solid var(--accent-2); outline-offset: 3px;
      }
      nav.more { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
      nav.more p { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.75rem; }
      .links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; justify-content: center; }
      a.link { color: var(--muted); text-decoration: none; font-size: 0.875rem; border-bottom: 1px solid transparent; }
      a.link:hover { color: var(--text); border-bottom-color: var(--border); }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>This page has wandered off.</h1>
      <p class="lede">
        The link may be out of date, or the address slightly different.
        Nothing is broken on your side — let's get you back.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-secondary" href="/mindgym">Open Mind Gym</a>
      </div>

      <nav class="more" aria-label="Other pages">
        <p>Or try one of these</p>
        <div class="links">
          <a class="link" href="/aboutmindgym">About Mind Gym</a>
          <a class="link" href="/guides">Articles</a>
          <a class="link" href="/feelingsandemotioncourse">Course</a>
          <a class="link" href="/knowyouremotionalhealth">Emotional health check</a>
        </div>
      </nav>
    </main>
  </body>
</html>
