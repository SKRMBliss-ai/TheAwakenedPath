<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 2 Learning Quest</title>
<meta name="description" content="A complete Year 2 learning adventure: lessons, illustrations, ten games per concept, mastery tracking and SATs-style practice.">
<style>
/* ============================================================
   YEAR 2 LEARNING QUEST — storybook island design system
   Palette: sea/sky/grass/sun/berry/plum on ink outlines
   ============================================================ */
:root{
  --ink:#16283C; --ink-soft:#43617E; --line:#16283C;
  --sky:#DCEEF9; --sky-2:#F2FAFE; --paper:#FFFFFF;
  --sea:#1E6FA8; --sea-d:#14507A;
  --grass:#3D9A4E; --grass-d:#2C7239;
  --sun:#FFC22E; --sun-d:#E09A00;
  --berry:#E4572E; --berry-d:#B93B18;
  --plum:#7A4EAB; --plum-d:#5C3684;
  --rose:#E86A9A;
  --ok:#2C7239; --no:#B93B18;
  --r:18px; --r-lg:28px;
  --shadow:0 4px 0 var(--line);
  --shadow-soft:0 6px 18px rgba(22,40,60,.14);
  --display:"Century Gothic","URW Gothic","Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif;
  --body:Verdana,Tahoma,"DejaVu Sans",system-ui,sans-serif;
  --tap:52px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body); color:var(--ink); font-size:17px; line-height:1.6;
  background:var(--sky);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.9) 0 22%, transparent 23%),
    radial-gradient(circle at 88% 4%, rgba(255,255,255,.7) 0 16%, transparent 17%),
    linear-gradient(180deg,#EAF6FD 0%, #DCEEF9 40%, #CDE7F6 100%);
  background-attachment:fixed;
  min-height:100vh;
}
h1,h2,h3,h4,.dsp{font-family:var(--display); letter-spacing:.01em; line-height:1.15; margin:0 0 .4em}
h1{font-size:clamp(28px,5vw,44px); font-weight:700}
h2{font-size:clamp(22px,3.4vw,32px); font-weight:700}
h3{font-size:clamp(19px,2.6vw,24px); font-weight:700}
p{margin:0 0 .85em}
a{color:var(--sea-d)}
img,svg{max-width:100%}
:focus-visible{outline:4px solid var(--plum); outline-offset:3px; border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;z-index:99}
.skip:focus{left:8px;top:8px;background:var(--sun);padding:10px 16px;border:3px solid var(--line);border-radius:12px;font-family:var(--display);font-weight:700}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#FFFFFF 0%,#F4FBFF 100%);
  border-bottom:4px solid var(--line); box-shadow:0 4px 0 rgba(22,40,60,.12)}
.topbar-in{max-width:1180px;margin:0 auto;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;
  background:none;border:0;cursor:pointer;color:var(--ink);padding:6px;border-radius:12px}
.brand .badge-logo{width:40px;height:40px;flex:0 0 40px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.searchbox{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.searchbox input{border:0;font-family:var(--body);font-size:15px;padding:8px 0;width:min(46vw,220px);background:transparent;color:var(--ink)}
.searchbox input:focus{outline:none}
.searchbox button{min-height:38px}

/* ---------- buttons ---------- */
.btn{font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;
  border:3px solid var(--line); border-radius:999px; background:#fff; color:var(--ink);
  padding:10px 18px; min-height:var(--tap); box-shadow:var(--shadow); transition:transform .08s, box-shadow .08s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn[aria-pressed="true"],.btn.on{background:var(--sun)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow)}
.btn-sm{font-size:14px;padding:6px 14px;min-height:42px;box-shadow:0 3px 0 var(--line)}
.btn-lg{font-size:20px;padding:14px 28px;min-height:62px}
.btn-sea{background:var(--sea);color:#fff}
.btn-grass{background:var(--grass);color:#fff}
.btn-sun{background:var(--sun)}
.btn-berry{background:var(--berry);color:#fff}
.btn-plum{background:var(--plum);color:#fff}
.btn-ghost{background:#fff}

/* ---------- cards / panels ---------- */
.card{background:var(--paper);border:4px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:0 6px 0 var(--line)}
.panel{background:var(--paper);border:4px solid var(--line);border-radius:var(--r-lg);padding:18px;margin:0 0 20px;box-shadow:0 6px 0 var(--line)}
.tint-sea{background:#EAF4FB} .tint-sun{background:#FFF6DF} .tint-grass{background:#EBF7ED}
.tint-plum{background:#F3EDFA} .tint-berry{background:#FDEDE8}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;padding:3px 12px;
  font-family:var(--display);font-weight:700;font-size:13px;background:#fff}
.pill.t1{background:#FFE7B8}.pill.t2{background:#D9EEDD}.pill.t3{background:#F0E2FB}.pill.ty{background:#DBEDF9}

/* ---------- home: island map ---------- */
.hero{position:relative;margin:18px 0 24px}
.hero-card{background:linear-gradient(180deg,#FFFDF6,#FFF3D6);border:4px solid var(--line);border-radius:var(--r-lg);
  padding:22px;box-shadow:0 8px 0 var(--line);position:relative;overflow:hidden}
.hero h1{margin-bottom:6px}
.hero .lede{font-size:clamp(16px,2.2vw,19px);max-width:56ch}
.mapwrap{margin-top:14px;border:4px solid var(--line);border-radius:22px;overflow:hidden;background:#BFE3F5}
.world-btn{cursor:pointer}
.world-btn:hover .wbubble{transform:translateY(-3px)}
.wbubble{transition:transform .12s}

/* ---------- concept cards ---------- */
.ccard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;
  background:#fff;border:4px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:0 6px 0 var(--line);
  font-family:var(--body);color:var(--ink);transition:transform .1s}
.ccard:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--line)}
.ccard .ic{font-size:34px;line-height:1}
.ccard .ct{font-family:var(--display);font-weight:700;font-size:19px}
.ccard .cb{font-size:14px;color:var(--ink-soft);min-height:2.6em}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-family:var(--display);font-weight:700;margin-top:4px}
.bar{height:14px;border:3px solid var(--line);border-radius:999px;background:#F0F4F7;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grass);width:0;transition:width .5s}
.bar.b-sun i{background:var(--sun)} .bar.b-plum i{background:var(--plum)} .bar.b-berry i{background:var(--berry)}

/* ---------- concept page ---------- */
.stepstrip{display:flex;gap:6px;overflow-x:auto;padding:10px 4px;margin:0 -4px 16px;scrollbar-width:thin}
.step{flex:0 0 auto;border:3px solid var(--line);border-radius:999px;background:#fff;padding:8px 14px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:14px;min-height:46px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.step[aria-current="true"]{background:var(--sun)}
.step.done::after{content:"✓";color:var(--ok);font-weight:700}
.lesson p{font-size:17px}
.keyword{border-bottom:3px dotted var(--berry);font-weight:700;cursor:help}
.callout{border:3px dashed var(--line);border-radius:var(--r);padding:12px 16px;margin:14px 0;background:#FFF9E8}
.stepnum{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px}
.stepnum b{flex:0 0 34px;height:34px;border-radius:50%;background:var(--sea);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display)}
.mistake{background:#FDEDE8;border:3px solid var(--berry-d);border-radius:var(--r);padding:12px 16px;margin:12px 0}
.fixit{background:#EBF7ED;border:3px solid var(--grass-d);border-radius:var(--r);padding:12px 16px;margin:12px 0}

/* ---------- games ---------- */
.gamegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.gtile{position:relative;text-align:left;cursor:pointer;background:#fff;border:4px solid var(--line);border-radius:var(--r);
  padding:12px;box-shadow:0 5px 0 var(--line);font-family:var(--body);color:var(--ink);min-height:112px;display:flex;flex-direction:column;gap:4px}
.gtile:hover{transform:translateY(-2px)}
.gtile .gn{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--ink-soft)}
.gtile .gt{font-family:var(--display);font-weight:700;font-size:17px}
.gtile .gd{font-size:12.5px;color:var(--ink-soft)}
.gtile .lvl{font-size:12px;font-family:var(--display);font-weight:700}
.gtile.done{background:#EBF7ED}
.gtile .tick{position:absolute;top:8px;right:10px;font-size:19px}
.stage{border:4px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:18px;box-shadow:0 6px 0 var(--line)}
.stagehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(19px,3vw,26px);margin:6px 0 14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{font-family:var(--display);font-weight:700;font-size:19px;background:#fff;border:4px solid var(--line);border-radius:var(--r);
  padding:16px 12px;cursor:pointer;min-height:64px;box-shadow:0 4px 0 var(--line);color:var(--ink);transition:transform .08s}
.opt:hover{transform:translateY(-2px)}
.opt.right{background:#CFEBD5;border-color:var(--grass-d)}
.opt.wrong{background:#F8D8CD;border-color:var(--berry-d)}
.opt.picked{background:var(--sun)}
.fb{margin-top:14px;border:3px solid var(--line);border-radius:var(--r);padding:12px 16px;font-family:var(--display);font-weight:700}
.fb.ok{background:#DDF2E1;border-color:var(--grass-d)}
.fb.no{background:#FBE3DA;border-color:var(--berry-d)}
.fb .sub{font-family:var(--body);font-weight:400;font-size:15px;margin-top:6px}
.prog{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dot{width:15px;height:15px;border-radius:50%;border:3px solid var(--line);background:#fff}
.dot.ok{background:var(--grass)} .dot.no{background:var(--berry)}
.timer{font-family:var(--display);font-weight:700;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px}
.answerbox{font-family:var(--display);font-weight:700;font-size:26px;width:160px;text-align:center;padding:10px;
  border:4px solid var(--line);border-radius:var(--r);background:#FFFDF3}
.tokrow{display:flex;gap:8px;flex-wrap:wrap;min-height:70px;align-items:center;border:3px dashed var(--line);
  border-radius:var(--r);padding:10px;background:#F7FBFE;margin:8px 0}
.tok{font-family:var(--display);font-weight:700;font-size:18px;background:#FFF0C9;border:3px solid var(--line);
  border-radius:12px;padding:10px 14px;cursor:grab;min-height:46px;display:inline-flex;align-items:center;box-shadow:0 3px 0 var(--line)}
.tok.sel{background:var(--sun);transform:translateY(-3px)}
.tok:active{cursor:grabbing}
.bins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:10px}
.bin{border:4px dashed var(--line);border-radius:var(--r);padding:10px;min-height:130px;background:#F7FBFE}
.bin.over{background:#FFF0C9}
.bin h4{margin:0 0 8px;font-size:16px;text-align:center}
.bin .items{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mcol{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.mitem{font-family:var(--display);font-weight:700;font-size:16px;background:#fff;border:4px solid var(--line);border-radius:14px;
  padding:12px 8px;cursor:pointer;min-height:56px;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.mitem.sel{background:var(--sun)}
.mitem.matched{background:#CFEBD5;border-color:var(--grass-d);opacity:.75;cursor:default}
.mitem.miss{background:#F8D8CD}
.revealgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.reveal{border:4px solid var(--line);border-radius:var(--r);background:#FFF6DF;padding:14px;cursor:pointer;text-align:left;
  font-family:var(--body);color:var(--ink);min-height:96px}
.reveal b{font-family:var(--display);font-size:17px;display:block;margin-bottom:4px}
.reveal.open{background:#DDF2E1;border-color:var(--grass-d)}
.seqrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.slot{min-width:66px;min-height:56px;border:4px dashed var(--line);border-radius:12px;background:#F7FBFE;
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;cursor:pointer}
.slot.filled{background:#FFF0C9;border-style:solid}
.slot.right{background:#CFEBD5;border-color:var(--grass-d);border-style:solid}
.slot.wrong{background:#F8D8CD;border-color:var(--berry-d);border-style:solid}
.fixed-item{font-family:var(--display);font-weight:700;font-size:19px;background:#FDEDE8;border:4px solid var(--berry-d);
  border-radius:var(--r);padding:14px;text-align:center;margin:10px 0}

/* ---------- widgets ---------- */
.widget{border:4px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:16px;margin:12px 0;box-shadow:0 5px 0 var(--line)}
.widget h4{margin:0 0 8px}
.wcontrols{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.blk{width:30px;height:30px;border:3px solid var(--line);border-radius:6px;background:var(--sun);cursor:pointer}
.blk.ten{width:26px;height:74px;background:var(--sea);border-radius:6px}
.blk.on{outline:4px solid var(--plum)}
.stack{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;min-height:80px}
.pvhouse{display:grid;grid-template-columns:1fr 1fr;gap:0;border:4px solid var(--line);border-radius:16px;overflow:hidden;max-width:340px}
.pvhouse div{padding:8px;text-align:center;font-family:var(--display);font-weight:700}
.pvhouse .hd{background:var(--sea);color:#fff;border-bottom:4px solid var(--line)}
.pvhouse .hd+.hd{border-left:4px solid var(--line)}
.pvhouse .val{font-size:38px;background:#FFFDF3}
.pvhouse .val+.val{border-left:4px solid var(--line)}
.tenframe{display:grid;grid-template-columns:repeat(5,40px);gap:0;border:4px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.tenframe span{width:40px;height:40px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;background:#fff}
.tenframe span.f{background:#FFE7B8}
.arraydots{display:grid;gap:8px;justify-content:start;margin:10px 0}
.arraydots i{width:30px;height:30px;border-radius:50%;background:var(--berry);border:3px solid var(--line);display:block}
.coin{border-radius:50%;border:3px solid var(--line);display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(22,40,60,.3);user-select:none}
.coin.copper{background:#D08A5A;color:#3A2109}
.coin.silver{background:#CFD8DE;color:#243544}
.coin.gold{background:#F0C24B;color:#3A2A00}
.coin.note{border-radius:8px;background:#BFD9C0;color:#1D3B22;width:86px;height:48px}
.purse{border:4px dashed var(--line);border-radius:var(--r);background:#F7FBFE;min-height:110px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}
.clockface{touch-action:none;cursor:pointer}
.gridboard{display:grid;border:4px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;background:#fff}
.gridboard div{width:52px;height:52px;border:1px solid #9BB3C6;display:flex;align-items:center;justify-content:center;font-size:24px}
.dgm-hot{cursor:pointer}
.dgm-hot:hover circle,.dgm-hot:focus circle{fill:var(--sun)}
.passage{background:#FFFDF3;border:3px solid var(--line);border-radius:var(--r);padding:16px;font-size:17px;line-height:1.75}
.passage p:last-child{margin-bottom:0}
.hl{background:var(--sun);border-radius:4px;padding:0 3px}
.word-tap{cursor:pointer;border-radius:5px;padding:0 2px}
.word-tap:hover{background:#FFE7B8}
.word-tap.picked{background:var(--sun);outline:2px solid var(--line)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;background:#fff;border:4px solid var(--line);
  border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:700;box-shadow:var(--shadow-soft);max-width:92vw;text-align:center}
.modal{position:fixed;inset:0;z-index:90;background:rgba(22,40,60,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border:4px solid var(--line);border-radius:var(--r-lg);padding:22px;max-width:560px;width:100%;
  box-shadow:0 8px 0 var(--line);max-height:88vh;overflow:auto}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;border:4px solid var(--line);border-radius:var(--r);
  padding:12px 8px;background:#F4F8FB;text-align:center;font-size:12px}
.badge.got{background:#FFF3D6}
.badge .bi{font-size:32px;filter:grayscale(1);opacity:.35}
.badge.got .bi{filter:none;opacity:1}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th,table.tbl td{border:2px solid var(--line);padding:8px;text-align:left}
table.tbl th{background:#EAF4FB;font-family:var(--display)}
.footer{text-align:center;font-size:13px;color:var(--ink-soft);padding:22px 10px 60px;max-width:70ch;margin:0 auto}
.notice{font-size:13px;color:var(--ink-soft)}
.hidden{display:none !important}
.roadmap{position:relative;padding-left:34px}
.roadmap::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:6px;background:var(--line);border-radius:3px}
.rmstop{position:relative;margin:0 0 18px}
.rmstop::before{content:"";position:absolute;left:-30px;top:14px;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--line)}
.rmstop.done::before{background:var(--grass)}
/* ---------- star jar, flying stars and reward pops ---------- */
.jar{position:fixed;z-index:70;width:110px;padding:6px 6px 4px;cursor:grab;touch-action:none;
  background:linear-gradient(180deg,#FFFDF6,#FFF3D6);border:4px solid var(--line);border-radius:20px;
  box-shadow:0 6px 0 var(--line),0 10px 22px rgba(22,40,60,.22);text-align:center;user-select:none}
.jar:active{cursor:grabbing}
.jar.over{background:#FFE7B8;transform:scale(1.06)}
.jar.bounce{animation:jarBounce .45s ease}
@keyframes jarBounce{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-4deg)}70%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
.jarCount{font-family:var(--display);font-weight:700;font-size:13px;margin-top:2px}
.jarBtn{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;border:3px solid var(--line);
  background:#fff;font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer;line-height:1;padding:0}
.flystar{position:fixed;z-index:75;font-size:44px;background:none;border:0;cursor:grab;padding:0;line-height:1;
  filter:drop-shadow(0 3px 4px rgba(22,40,60,.4));animation:starPop .4s ease, starWob 1.6s ease-in-out .4s infinite;touch-action:none}
.flystar:active{cursor:grabbing}
@keyframes starPop{0%{transform:scale(0) rotate(-90deg);opacity:0}70%{transform:scale(1.35) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starWob{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-9px) rotate(7deg)}}
.ptspop{position:fixed;z-index:78;font-family:var(--display);font-weight:700;font-size:26px;color:var(--plum-d);
  background:#fff;border:4px solid var(--line);border-radius:999px;padding:6px 18px;pointer-events:none;
  box-shadow:0 4px 0 var(--line);animation:ptsUp 1.4s ease-out forwards}
@keyframes ptsUp{0%{transform:translateY(10px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}
  60%{transform:translateY(-26px) scale(1);opacity:1}100%{transform:translateY(-70px) scale(.9);opacity:0}}

<!-- ══════════════════════════════════════════════════════════════════════════
     THE ADVENTURE SKIN
     The Quest keeps every lesson, game, badge and SATs question exactly as the
     studio wrote it. What changes is the clothing: its design tokens are
     remapped to the adventure's own, so the heavy dark outlines become soft
     tan edges, the blue sky becomes cold-press paper, and the type becomes
     Baloo and Patrick Hand — the same hand that draws Art World, Piano World
     and Study Island.
     ═══════════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="/kids-adventure/kit/adventure.css">
<style>
:root{
  /* ink and outlines: navy on tan, never black on black */
  --ink:#14265E; --ink-soft:#4A5680; --line:#E0C48E;
  --paper:#FEF8EA; --sky:#FCF4E5; --sky-2:#FFFDF6;
  /* the seven painted tape colours do all the work */
  --sea:#3880C0;  --sea-d:#2A5F92;
  --grass:#509858; --grass-d:#38703F;
  --sun:#F0B828;  --sun-d:#D79E12;
  --berry:#E06098; --berry-d:#B94577;
  --plum:#A070C0; --plum-d:#7F52A0;
  --rose:#E9528F; --ok:#2E7A38; --no:#B3262B;
  --r:16px; --r-lg:22px;
  --shadow:0 5px 0 #E3D3B0;
  --shadow-soft:0 8px 18px rgba(138,106,50,.18);
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;
}
/* paper, not sky */
body{
  background:#FCF4E5 url('/kids-adventure/kit/paper.webp') repeat !important;
  background-size:256px 256px !important;
  font-family:var(--body); font-size:18px; color:var(--ink);
}
h1,h2,h3,h4,.dsp{font-family:var(--display);font-weight:800;color:#002058}
.eyebrow{color:var(--ink-soft);letter-spacing:.14em}
a{color:var(--sea-d)}
:focus-visible{outline:3px dashed var(--sea) !important;outline-offset:3px}

/* ── the bar along the top becomes a paper shelf ────────────────────────── */
.topbar{background:linear-gradient(180deg,#FFFDF6,#FDF6E7) !important;border-bottom:3px solid var(--line) !important;
  box-shadow:0 4px 14px rgba(138,106,50,.16) !important}
.topbar-in{gap:8px}
.brand{font-family:var(--display);font-weight:800;color:#002058}
.searchbox{border:2.5px solid var(--line) !important;background:#FFFDF6 !important;box-shadow:0 3px 0 #E9DCC0}
.searchbox input{font-family:var(--body);color:var(--ink)}

/* ── buttons: cream with a warm drop, or a painted colour ───────────────── */
.btn{border:2.5px solid var(--line) !important;background:#FFFDF6;color:var(--ink);
  box-shadow:0 4px 0 #E3D3B0 !important;font-family:var(--display);font-weight:800}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #E3D3B0 !important}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E3D3B0 !important}
.btn[aria-pressed="true"],.btn.on{background:var(--sun);color:#3A2A00}
.btn-sea{background:var(--sea);color:#fff;border-color:#2A5F92 !important;box-shadow:0 4px 0 #2A5F92 !important}
.btn-grass{background:var(--grass);color:#fff;border-color:#38703F !important;box-shadow:0 4px 0 #38703F !important}
.btn-sun{background:var(--sun);color:#3A2A00;border-color:#D79E12 !important;box-shadow:0 4px 0 #D79E12 !important}
.btn-berry{background:var(--berry);color:#fff;border-color:#B94577 !important;box-shadow:0 4px 0 #B94577 !important}
.btn-plum{background:var(--plum);color:#fff;border-color:#7F52A0 !important;box-shadow:0 4px 0 #7F52A0 !important}
.btn-ghost{background:#FFFDF6}

/* ── cards and panels: cream paper with a gold edge ─────────────────────── */
.card,.panel,.ccard{background:var(--paper) !important;border:3px solid var(--line) !important;
  border-radius:var(--r-lg) !important;box-shadow:0 7px 16px rgba(138,106,50,.18) !important}
.ccard:hover{transform:translateY(-3px);box-shadow:0 11px 20px rgba(138,106,50,.22) !important}
.ccard .ct{font-family:var(--display);color:#002058}
.ccard .cb{color:var(--ink-soft);font-family:var(--body);font-size:16px}
.hero-card{background:linear-gradient(180deg,#FFFDF6,#FDF3DD) !important;border:3px solid var(--line) !important;
  box-shadow:0 8px 20px rgba(138,106,50,.2) !important}
.tint-sea{background:#EDF4FB !important}.tint-sun{background:#FFF6E2 !important}
.tint-grass{background:#EFF7EE !important}.tint-plum{background:#F5EFFA !important}
.tint-berry{background:#FDF0F4 !important}

/* ── the little pills, the way the tapes look ──────────────────────────── */
.pill{border:2.5px solid var(--line) !important;background:#FFFDF6;font-family:var(--display);font-weight:800;
  color:#002058;padding:4px 13px}
.pill.t1{background:#FFF1D0 !important}.pill.t2{background:#EAF5EA !important}
.pill.t3{background:#F4ECFA !important}.pill.ty{background:#EAF3FB !important}

/* ── the adventure's own furniture, dropped in on top ───────────────────── */
.y2deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.y2deco i{position:absolute;display:block;background-repeat:no-repeat;background-size:100% 100%;opacity:.85}
@media (max-width:820px){.y2deco i.sm{display:none}}

.y2home{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--display);font-weight:800;
  font-size:15px;color:#002058;background:#FFFDF6;border:2.5px solid var(--line);border-radius:40px;padding:7px 14px;
  box-shadow:0 3px 0 #E3D3B0}
#kjabar{margin-left:auto}

/* ── the top bar, tidied ────────────────────────────────────────────────────
   Nine nav buttons, a search box and a toolbar were wrapping into three rows
   of chrome above the actual lesson. Now there is one calm row — the way
   back, the crest, one Places button holding all nine, and the four
   sound toggles — and the lesson starts straight underneath it. */
.topbar-in{display:grid !important;grid-template-columns:auto 1fr auto auto;align-items:center;
  row-gap:6px;column-gap:10px;padding:8px 12px 10px}
.topbar-in > .y2home{grid-row:1;grid-column:1}

.topbar-in > #kjabar{grid-row:1;grid-column:4;margin-left:0 !important}
.nav > .searchbox{flex:none}
@media (max-width:760px){
  /* on a phone the crest gives up its words and the toggles take their own
     row, so nothing wraps and every target stays finger-sized */
  .topbar-in{grid-template-columns:auto 1fr auto;padding:6px 10px 8px;column-gap:6px}
  .topbar-in > .brand{font-size:0;gap:0;padding:2px}

  .topbar-in > .y2places{grid-row:1;grid-column:3}

}
/* ── the nav, folded away ───────────────────────────────────────────────────
   Nine places, a search box and a player picker were a permanent strip of
   chrome across the top of every lesson. They now live behind one button:
   it opens on hover for anyone with a mouse and on tap for anyone without,
   which gives the lesson itself the whole screen and gives a child one thing
   to aim at instead of eleven. */
.y2places{position:relative;grid-row:1;grid-column:3;justify-self:end}
.y2trig{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;
  font-size:15px;color:#002058;background:#FFFDF6;border:2.5px solid var(--line);
  border-radius:40px;padding:8px 15px;box-shadow:0 3px 0 #E3D3B0;cursor:pointer;min-height:42px}
.y2trig .chev{font-size:12px;transition:transform .2s ease}
.y2places[data-open] .y2trig{background:#FFF2CE;border-color:var(--gold,#F8C858)}
.y2places[data-open] .y2trig .chev{transform:rotate(180deg)}
.y2panel{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:min(88vw,330px);
  background:#FEF8EA;border:3px solid var(--line);border-radius:20px;padding:10px;
  box-shadow:0 16px 34px #16283c2e;display:none}
.y2places[data-open] .y2panel{display:block}
/* a hover bridge, so the pointer can cross the gap without the menu closing */
.y2places::after{content:'';position:absolute;right:0;top:100%;width:100%;height:10px}
.y2panel .nav{display:flex !important;flex-wrap:wrap !important;gap:8px;margin:0 !important;
  overflow:visible !important;mask-image:none !important;padding:0 !important}
.y2panel .nav .btn{flex:1 1 46%;justify-content:center;font-size:14px;min-height:44px}

/* ── the heading, once ──────────────────────────────────────────────────────
   The concept header — eyebrow, title, blurb, objective, mastery bar — was
   re-drawn in full above all nine steps of the same concept, so a child
   scrolled past the same bold paragraph nine times to reach the thing they
   came for. It now folds itself down to a single line a few seconds after the
   page settles, and a tap opens it again. Nothing is removed; it just stops
   taking the screen after it has been read. */
.y2head{position:relative;transition:padding .3s ease}
.y2head .y2fold{position:absolute;top:8px;right:10px;z-index:2;border:2px solid var(--line);
  background:#FFFDF6;border-radius:30px;font-family:var(--display);font-weight:700;font-size:13px;
  color:#4A5680;padding:4px 11px;cursor:pointer;box-shadow:0 2px 0 #E3D3B0}

.y2head.slim > .row > div > h1{display:block;font-size:clamp(19px,3.4vw,24px);margin:0}
.y2head.slim > .notice,.y2head.slim > .bar,.y2head.slim > .meta{display:none}
.y2head.slim .y2fold{top:50%;transform:translateY(-50%)}

/* ── the question, made impossible to miss ─────────────────────────────────
   A child who cannot find the question cannot answer it. It is now the
   biggest thing on the screen by a clear margin, on its own panel under a
   gold rule. */
.qtext{font-family:var(--display) !important;font-weight:800 !important;
  font-size:clamp(23px,4.8vw,32px) !important;line-height:1.22 !important;color:#002058 !important;
  background:#FFFEF9;border:3px solid var(--line);border-top-width:6px;border-top-color:#F8C858;
  border-radius:18px;padding:16px 16px 14px !important;margin:10px 0 14px !important;text-wrap:balance}
/* an option taken off the board, and the one to tap once narrowing runs out */
.opt.gone{opacity:.3;filter:grayscale(1)}
.opt.showme{border-color:#3D9A4E !important;background:#F2FBF1 !important;
  animation:y2show 1.2s ease-in-out infinite}
@keyframes y2show{0%,100%{box-shadow:0 0 0 3px #3d9a4e33}50%{box-shadow:0 0 0 9px #3d9a4e4d}}
/* the auto-advance, drawn so the pause reads as deliberate */
.btn.waitbtn{position:relative;overflow:hidden}
.btn.waitbtn .tick{position:absolute;left:0;bottom:0;height:5px;width:0;background:#ffffffa8;
  animation:y2tick var(--d,1600ms) linear forwards}

/* the shared star jar sits above the Quest's own draggable one, and the page

/* their screens scroll themselves into place, so every landing point needs to

/* ── reading and answering ──────────────────────────────────────────────────

<script>
"use strict";
/* ================= CORE: state, storage, helpers ================= */
var KEY = "y2quest.v1";
function storeKey(){ return (typeof ACTIVE!=="undefined" && ACTIVE) ? (KEY+"."+ACTIVE) : KEY; }
var S = {
  name: "", concepts: {}, badges: {}, boost: {}, sats: {}, streak: 0, lastDay: "",
  visited: {}, totalGames: 0, log: [],
  pack: "dino", stars: 0, stickers: {}, starPoints: 0, jarOn: true, jarPos: null
};
function load(){
  try{ var raw = localStorage.getItem(storeKey()); if(raw){ var o = JSON.parse(raw); for(var k in o) S[k]=o[k]; } }
  catch(e){ /* storage unavailable — the quest still works, progress just won't be saved */ }
}
function save(){
  try{ localStorage.setItem(storeKey(), JSON.stringify(S)); }catch(e){}
}
function cstate(id){
  if(!S.concepts[id]) S.concepts[id] = { games:{}, steps:{}, scores:[], seen:false, revised:0 };
  return S.concepts[id];
}
/* Mastery: average of best game scores, weighted so that later (harder) games
   count a little more. Accuracy only — never speed. */
function mastery(id){
  var c = cstate(id), tot = 0, w = 0;
  for(var i=0;i<10;i++){
    var g = c.games[i];
    var wt = 1 + i*0.06;
    if(g!=null){ tot += g*wt; }
    w += wt;
  }
  return Math.round(tot/w);
}
function gamesDone(id){ var c=cstate(id),n=0; for(var i=0;i<10;i++){ if(c.games[i]!=null) n++; } return n; }
function masteryBand(p){
  if(p>=90) return {l:"Mastered", e:"🏆", c:"b-sun"};
  if(p>=70) return {l:"Confident", e:"⭐", c:"b-plum"};
  if(p>=40) return {l:"Practising", e:"🌿", c:""};
  return {l:"Learning", e:"🌱", c:"b-berry"};
}
function overall(){
  var t=0; for(var i=0;i<CONCEPTS.length;i++) t+=mastery(CONCEPTS[i].id);
  return Math.round(t/CONCEPTS.length);
}
function byId(id){ for(var i=0;i<CONCEPTS.length;i++) if(CONCEPTS[i].id===id) return CONCEPTS[i]; return null; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* ---------- tiny DOM helpers ---------- */
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a,n){ return shuffle(a).slice(0,n); }
function toast(msg, ms){
  var t = el("div","toast",msg); t.setAttribute("role","status"); document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, ms||2600);
}
function announce(msg){
  var live = $("#live");
  if(!live){ live = el("div"); live.id="live"; live.className="sr"; live.setAttribute("aria-live","polite"); document.body.appendChild(live); }
  live.textContent = msg;
}
var PRAISE = ["Fantastic!","Great thinking!","You spotted it!","Brilliant!","Superstar!","Nice work!","You've got this!","Excellent!"];
var NUDGE  = ["Not quite.","Have another look.","Close — try again.","Nearly there.","Let's think again."];
/* Whoever the child picked as their buddy on the map speaks here too, in
   their own words, rather than the Quest's stock praise — the same swap
   Study Island's quick-practice rounds make. */
function praise(){
  var jy = window.KJA && window.KJA.journey;
  if(jy && jy.buddy.chosen()) return jy.buddy.cheer();
  return PRAISE[Math.floor(Math.random()*PRAISE.length)];
}
function nudge(){ return NUDGE[Math.floor(Math.random()*NUDGE.length)]; }

/* ---------- badges ---------- */
var BADGES = [
  {id:"first",   e:"🌱", n:"First Steps",      d:"Finish your very first game"},
  {id:"ten",     e:"🎮", n:"Ten in the Bag",   d:"Finish 10 games"},
  {id:"fifty",   e:"🎯", n:"Fifty Club",       d:"Finish 50 games"},
  {id:"hundred", e:"💯", n:"Century",          d:"Finish 100 games"},
  {id:"allten",  e:"🏅", n:"Full House",       d:"Finish all 10 games in one concept"},
  {id:"master1", e:"🏆", n:"Master Explorer",  d:"Master a concept (90%+)"},
  {id:"master5", e:"👑", n:"Five-Star Mind",   d:"Master five concepts"},
  {id:"maths",   e:"🔢", n:"Number Islander",  d:"Reach Confident in 5 Maths concepts"},
  {id:"english", e:"📚", n:"Story Ranger",     d:"Reach Confident in 4 English concepts"},
  {id:"boost3",  e:"🔥", n:"Boost Streak",     d:"Do the Brain Boost 3 days running"},
  {id:"sats",    e:"🕵️", n:"Secret Agent",     d:"Finish a SATs-style challenge"},
  {id:"revise",  e:"🔄", n:"Revision Hero",    d:"Complete 5 revision sessions"}
];
function grant(id){
  if(S.badges[id]) return;
  S.badges[id] = today(); save();
  var b=null; for(var i=0;i<BADGES.length;i++) if(BADGES[i].id===id) b=BADGES[i];
  if(b){ play("badge"); toast("New badge unlocked: "+b.e+" "+b.n, 3600); announce("New badge: "+b.n); }
}
function checkBadges(){
  var done = S.totalGames;
  if(done>=1) grant("first");
  if(done>=10) grant("ten");
  if(done>=50) grant("fifty");
  if(done>=100) grant("hundred");
  var mastered=0, full=0, mConf=0, eConf=0, revs=0;
  for(var i=0;i<CONCEPTS.length;i++){
    var c=CONCEPTS[i], m=mastery(c.id);
    if(m>=90) mastered++;
    if(gamesDone(c.id)===10) full++;
    if(m>=70 && c.s==="Maths") mConf++;
    if(m>=70 && c.s==="English") eConf++;
    revs += (cstate(c.id).revised||0);
  }
  if(full>=1) grant("allten");
  if(mastered>=1) grant("master1");
  if(mastered>=5) grant("master5");
  if(mConf>=5) grant("maths");
  if(eConf>=4) grant("english");
  if(revs>=5) grant("revise");
  if(S.streak>=3) grant("boost3");
}

/* ---------- recording results ---------- */
function recordGame(conceptId, gameIndex, pct){
  var c = cstate(conceptId);
  var prev = c.games[gameIndex];
  if(prev==null || pct>prev) c.games[gameIndex] = pct;
  if(prev==null) S.totalGames++;
  c.scores.push({g:gameIndex, p:pct, d:today()});
  if(c.scores.length>60) c.scores = c.scores.slice(-60);
  S.log.push({c:conceptId, g:gameIndex, p:pct, d:today()});
  if(S.log.length>250) S.log = S.log.slice(-250);
  save(); checkBadges();
}
function markStep(conceptId, step){ var c=cstate(conceptId); c.steps[step]=1; c.seen=true; save(); }

/* ---------- next-step recommendation ---------- */
function recommend(){
  var weakest=null, next=null;
  for(var i=0;i<CONCEPTS.length;i++){
    var c=CONCEPTS[i], m=mastery(c.id), g=gamesDone(c.id);
    if(g>0 && m<55 && (!weakest || m<mastery(weakest.id))) weakest=c;
    if(!next && g<10) next=c;
  }
  if(weakest) return {c:weakest, why:"Let's practise "+weakest.t.toLowerCase()+" again — a bit more practice will make it click."};
  if(next){
    var done=[]; for(var j=0;j<CONCEPTS.length;j++){ if(mastery(CONCEPTS[j].id)>=70) done.push(CONCEPTS[j]); }
    var why = done.length ? "You've done well on "+done[done.length-1].t.toLowerCase()+". Next, let's learn "+next.t.toLowerCase()+"!"
                          : "Start your quest here — this is the first stop on Year 2.";
    return {c:next, why:why};
  }
  return {c:CONCEPTS[0], why:"You've played every game! Time to revisit and push those scores higher."};
}

<script>
"use strict";
/* ================= DRAG HELPER (mouse + touch + keyboard fallback) ================= */
function makeDrag(node, opt){
  opt = opt||{};
  var dragging=false, sx=0, sy=0, ghost=null, lastTarget=null;
  node.style.touchAction = "none";
  node.addEventListener("pointerdown", function(ev){
    if(ev.button && ev.button!==0) return;
    dragging=true; sx=ev.clientX; sy=ev.clientY;
    node.setPointerCapture(ev.pointerId);
    node.style.transition="none";
  });
  node.addEventListener("pointermove", function(ev){
    if(!dragging) return;
    var dx=ev.clientX-sx, dy=ev.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy) > 4){
      node.style.transform="translate("+dx+"px,"+dy+"px) scale(1.06)";
      node.style.zIndex="50"; node.style.position="relative";
      node.style.pointerEvents="none";
      var t=document.elementFromPoint(ev.clientX, ev.clientY);
      node.style.pointerEvents="";
      var drop = t && t.closest ? t.closest("[data-drop]") : null;
      if(drop!==lastTarget){
        if(lastTarget) lastTarget.classList.remove("over");
        if(drop) drop.classList.add("over");
        lastTarget = drop;
      }
    }
  });
  function end(ev){
    if(!dragging) return;
    dragging=false;
    node.style.transform=""; node.style.zIndex=""; node.style.position="";
    if(lastTarget){ lastTarget.classList.remove("over"); if(opt.onDrop) opt.onDrop(lastTarget, node); }
    lastTarget=null;
  }
  node.addEventListener("pointerup", end);
  node.addEventListener("pointercancel", end);
}

/* ================= WIDGETS =================
   Every widget: WIDGETS[name](host, opts, report)
   `report(value)` lets TRY IT tasks check the child's answer.       */
var WIDGETS = {};

/* ---- 1. PLACE VALUE HOUSE + BASE-10 BLOCKS ---- */
WIDGETS.placevalue = function(host, o, report){
  o=o||{}; var tens = o.start!=null ? Math.floor(o.start/10) : 3, ones = o.start!=null ? o.start%10 : 4;
  var wrap = el("div","widget");
  wrap.innerHTML = '<h4>Place-value house</h4>'+
    '<div class="pvhouse" role="img"><div class="hd">TENS</div><div class="hd">ONES</div>'+
    '<div class="val" id="pvT">0</div><div class="val" id="pvO">0</div></div>'+
    '<p class="notice" style="margin-top:8px">Each tall blue rod is <b>1 ten</b>. Each small yellow cube is <b>1 one</b>. Tap a block to take it away.</p>'+
    '<div class="stack" id="pvStack" aria-label="Base ten blocks"></div>'+
    '<p class="dsp" style="font-size:24px" id="pvSay"></p>'+
    '<div class="wcontrols">'+
      '<button class="btn btn-sm btn-sea" data-a="t1">+1 ten</button>'+
      '<button class="btn btn-sm btn-ghost" data-a="t-1">−1 ten</button>'+
      '<button class="btn btn-sm btn-sun" data-a="o1">+1 one</button>'+
      '<button class="btn btn-sm btn-ghost" data-a="o-1">−1 one</button>'+
      '<button class="btn btn-sm btn-ghost" data-a="clr">Clear</button>'+
    '</div>';
  host.appendChild(wrap);
  function draw(){
    var n = tens*10+ones;
    $("#pvT",wrap).textContent=tens; $("#pvO",wrap).textContent=ones;
    var st=$("#pvStack",wrap); st.innerHTML="";
    for(var i=0;i<tens;i++){ var b=el("button","blk ten"); b.setAttribute("aria-label","a ten rod"); b.onclick=function(){ tens--; draw(); }; st.appendChild(b); }
    for(var j=0;j<ones;j++){ var c=el("button","blk"); c.setAttribute("aria-label","a one cube"); c.onclick=function(){ ones--; draw(); }; st.appendChild(c); }
    $("#pvSay",wrap).textContent = tens+" tens and "+ones+" ones = "+n+"  ("+(tens*10)+" + "+ones+" = "+n+")";
    if(report) report(n);
  }
  wrap.addEventListener("click", function(ev){
    var a = ev.target.getAttribute && ev.target.getAttribute("data-a"); if(!a) return;
    if(a==="t1"&&tens<9) tens++; if(a==="t-1"&&tens>0) tens--;
    if(a==="o1"&&ones<9) ones++; if(a==="o-1"&&ones>0) ones--;
    if(a==="clr"){ tens=0; ones=0; }
    draw();
  });
  draw();
};

/* ---- 2. NUMBER LINE with a marker that really moves ---- */
WIDGETS.numberline = function(host, o, report){
  o=o||{}; var min=o.min||0, max=o.max||100, step=o.step||10, val=o.start!=null?o.start:0;
  var wrap = el("div","widget");
  wrap.innerHTML='<h4>Number line</h4><div id="nlSvg"></div>'+
   '<p class="dsp" style="font-size:26px" id="nlSay"></p>'+
   '<div class="wcontrols">'+
   '<button class="btn btn-sm btn-ghost" data-j="-10">−10</button>'+
   '<button class="btn btn-sm btn-ghost" data-j="-1">−1</button>'+
   '<button class="btn btn-sm btn-sun" data-j="1">+1</button>'+
   '<button class="btn btn-sm btn-sea" data-j="10">+10</button>'+
   '<span class="notice">Tap the line, use the buttons, or use ← → on the keyboard.</span></div>';
  host.appendChild(wrap);
  var W=680,H=110;
  function draw(){
    if(val<min) val=min; if(val>max) val=max;
    var ticks="", n;
    for(n=min;n<=max;n+=step){
      var x = 40 + (n-min)/(max-min)*(W-80);
      ticks += '<line x1="'+x+'" y1="46" x2="'+x+'" y2="66" stroke="#16283C" stroke-width="4"/>'+
               '<text x="'+x+'" y="88" text-anchor="middle" font-size="15" font-family="Verdana" fill="#16283C">'+n+'</text>';
    }
    var mx = 40 + (val-min)/(max-min)*(W-80);
    $("#nlSvg",wrap).innerHTML =
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Number line from '+min+' to '+max+', marker on '+val+'" id="nlLine" style="cursor:pointer">'+
      '<line x1="40" y1="56" x2="'+(W-40)+'" y2="56" stroke="#16283C" stroke-width="6" stroke-linecap="round"/>'+ticks+
      '<g transform="translate('+mx+',0)"><polygon points="0,44 -14,20 14,20" fill="#E4572E" stroke="#16283C" stroke-width="3"/>'+
      '<rect x="-24" y="-4" width="48" height="26" rx="8" fill="#FFC22E" stroke="#16283C" stroke-width="3"/>'+
      '<text x="0" y="15" text-anchor="middle" font-size="16" font-weight="bold" font-family="Verdana">'+val+'</text></g></svg>';
    $("#nlSay",wrap).textContent = "The marker is on "+val+".";
    var svg=$("#nlLine",wrap);
    svg.onclick=function(ev){
      var r=svg.getBoundingClientRect();
      var px=(ev.clientX-r.left)/r.width*W;
      var v=Math.round(((px-40)/(W-80))*(max-min)+min);
      val=Math.max(min,Math.min(max,v)); draw();
    };
    if(report) report(val);
  }
  wrap.addEventListener("click",function(ev){
    var j=ev.target.getAttribute && ev.target.getAttribute("data-j"); if(!j) return;
    val+=parseInt(j,10); draw();
  });
  wrap.tabIndex=0;
  wrap.addEventListener("keydown",function(ev){
    if(ev.key==="ArrowRight"){ val++; draw(); ev.preventDefault(); }
    if(ev.key==="ArrowLeft"){ val--; draw(); ev.preventDefault(); }
  });
  draw();
};

/* ---- 3. TEN FRAMES (making 10) ---- */
WIDGETS.tenframe = function(host, o, report){
  o=o||{}; var a=o.a!=null?o.a:7, b=o.b!=null?o.b:5;
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Make 10 with counters</h4><p class="notice">Fill the first frame to make 10, then see what is left over.</p>'+
   '<div class="row" style="align-items:flex-start;gap:18px"><div><div class="eyebrow">Frame 1</div><div class="tenframe" id="tf1"></div></div>'+
   '<div><div class="eyebrow">Frame 2</div><div class="tenframe" id="tf2"></div></div></div>'+
   '<p class="dsp" style="font-size:22px" id="tfSay"></p>'+
   '<div class="wcontrols"><button class="btn btn-sm btn-sun" data-t="add">Add a counter</button>'+
   '<button class="btn btn-sm btn-ghost" data-t="rem">Take one away</button>'+
   '<button class="btn btn-sm btn-grass" data-t="fill">Fill frame 1 to 10</button></div>';
  host.appendChild(wrap);
  function draw(){
    var total=a+b, f1=Math.min(10,total), f2=Math.max(0,total-10);
    function grid(id,n){
      var g=$("#"+id,wrap); g.innerHTML="";
      for(var i=0;i<10;i++){ var s=el("span",i<n?"f":"",i<n?"🔵":""); g.appendChild(s); }
    }
    grid("tf1",f1); grid("tf2",f2);
    $("#tfSay",wrap).textContent = total<=10 ? (total+" counters. "+(10-total)+" more would make 10.")
      : ("10 + "+f2+" = "+total+"  →  a full ten and "+f2+" more.");
    if(report) report(total);
  }
  wrap.addEventListener("click",function(ev){
    var t=ev.target.getAttribute && ev.target.getAttribute("data-t"); if(!t) return;
    if(t==="add"&&a+b<20) b++; if(t==="rem"&&a+b>0){ if(b>0) b--; else a--; }
    if(t==="fill"){ var need=10-(a+b); if(need>0) b+=need; }
    draw();
  });
  draw();
};

/* ---- 4. ARRAY BUILDER (multiplication) ---- */
WIDGETS.array = function(host, o, report){
  o=o||{}; var r=o.rows||3, c=o.cols||4;
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Build an array</h4><div class="arraydots" id="arDots" role="img"></div>'+
   '<p class="dsp" style="font-size:24px" id="arSay"></p>'+
   '<div class="wcontrols"><span class="pill">Rows</span>'+
   '<button class="btn btn-sm btn-ghost" data-r="-1">−</button><button class="btn btn-sm btn-sea" data-r="1">+</button>'+
   '<span class="pill">In each row</span>'+
   '<button class="btn btn-sm btn-ghost" data-c="-1">−</button><button class="btn btn-sm btn-sun" data-c="1">+</button></div>';
  host.appendChild(wrap);
  function draw(){
    var d=$("#arDots",wrap); d.style.gridTemplateColumns="repeat("+c+",30px)"; d.innerHTML="";
    for(var i=0;i<r*c;i++) d.appendChild(el("i"));
    d.setAttribute("aria-label", r+" rows of "+c+" makes "+(r*c));
    $("#arSay",wrap).innerHTML = r+" rows of "+c+" &nbsp;=&nbsp; "+r+" × "+c+" &nbsp;=&nbsp; <b>"+(r*c)+"</b><br>"+
      '<span style="font-size:16px;font-family:var(--body)">Repeated addition: '+Array(r+1).join(c+" + ").slice(0,-3)+" = "+(r*c)+"</span>";
    if(report) report(r*c);
  }
  wrap.addEventListener("click",function(ev){
    var rr=ev.target.getAttribute&&ev.target.getAttribute("data-r"), cc=ev.target.getAttribute&&ev.target.getAttribute("data-c");
    if(rr){ r=Math.max(1,Math.min(10,r+parseInt(rr,10))); draw(); }
    if(cc){ c=Math.max(1,Math.min(10,c+parseInt(cc,10))); draw(); }
  });
  draw();
};

/* ---- 5. SHARING (division) ---- */
WIDGETS.sharing = function(host, o, report){
  o=o||{}; var total=o.total||12, groups=o.groups||3;
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Share them out fairly</h4><p class="notice">Deal the apples one at a time into the baskets, just like dealing cards.</p>'+
   '<div id="shGroups" class="row" style="align-items:flex-start"></div>'+
   '<p class="dsp" style="font-size:22px" id="shSay"></p>'+
   '<div class="wcontrols"><span class="pill">Apples</span>'+
   '<button class="btn btn-sm btn-ghost" data-t="-1">−</button><button class="btn btn-sm btn-berry" data-t="1">+</button>'+
   '<span class="pill">Baskets</span>'+
   '<button class="btn btn-sm btn-ghost" data-g="-1">−</button><button class="btn btn-sm btn-grass" data-g="1">+</button></div>';
  host.appendChild(wrap);
  function draw(){
    var each=Math.floor(total/groups), left=total%groups;
    var box=$("#shGroups",wrap); box.innerHTML="";
    for(var g=0;g<groups;g++){
      var b=el("div","bin"); b.style.minHeight="90px"; b.style.borderStyle="solid";
      b.innerHTML='<h4>🧺</h4><div class="items">'+Array(each+1).join("🍎 ")+'</div>';
      box.appendChild(b);
    }
    if(left>0){ var lb=el("div","bin"); lb.style.minHeight="90px"; lb.innerHTML='<h4>Left over</h4><div class="items">'+Array(left+1).join("🍎 ")+'</div>'; box.appendChild(lb); }
    $("#shSay",wrap).innerHTML = total+" shared between "+groups+" = <b>"+each+" each</b>"+(left?(" with "+left+" left over"):"")+
      '<br><span style="font-size:16px;font-family:var(--body)">'+total+" ÷ "+groups+" = "+each+(left?" r "+left:"")+"</span>";
    if(report) report(each);
  }
  wrap.addEventListener("click",function(ev){
    var t=ev.target.getAttribute&&ev.target.getAttribute("data-t"), g=ev.target.getAttribute&&ev.target.getAttribute("data-g");
    if(t){ total=Math.max(1,Math.min(30,total+parseInt(t,10))); draw(); }
    if(g){ groups=Math.max(2,Math.min(6,groups+parseInt(g,10))); draw(); }
  });
  draw();
};

/* ---- 6. FRACTION PIZZA ---- */
WIDGETS.fraction = function(host, o, report){
  o=o||{}; var parts=o.parts||4, on=[];
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Fraction pizza</h4><p class="notice">Tap a slice to add tomato. The parts must all be <b>equal</b>.</p>'+
    '<div id="frSvg" style="max-width:320px"></div><p class="dsp" style="font-size:26px" id="frSay"></p>'+
    '<div class="wcontrols" id="frBtns">'+
      '<button class="btn btn-sm" data-p="2">Halves (2)</button>'+
      '<button class="btn btn-sm" data-p="3">Thirds (3)</button>'+
      '<button class="btn btn-sm" data-p="4">Quarters (4)</button>'+
      '<button class="btn btn-sm btn-ghost" data-p="clear">Clear toppings</button></div>';
  host.appendChild(wrap);
  function draw(){
    var s="", cx=110, cy=110, rr=95;
    for(var i=0;i<parts;i++){
      var a0=(i/parts)*Math.PI*2 - Math.PI/2, a1=((i+1)/parts)*Math.PI*2 - Math.PI/2;
      var x0=cx+rr*Math.cos(a0), y0=cy+rr*Math.sin(a0), x1=cx+rr*Math.cos(a1), y1=cy+rr*Math.sin(a1);
      var big = (a1-a0) > Math.PI ? 1 : 0;
      s+='<path class="fslice" data-i="'+i+'" tabindex="0" role="button" aria-label="Slice '+(i+1)+(on[i]?", topped":", empty")+'" '+
         'd="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+rr+' '+rr+' 0 '+big+' 1 '+x1+' '+y1+' Z" fill="'+(on[i]?"#E4572E":"#FFE0A3")+'" stroke="#16283C" stroke-width="4" style="cursor:pointer"/>';
    }
    $("#frSvg",wrap).innerHTML='<svg viewBox="0 0 220 220" role="img" aria-label="Pizza cut into '+parts+' equal parts">'+
      '<circle cx="110" cy="110" r="100" fill="#E8B76B" stroke="#16283C" stroke-width="5"/>'+s+'</svg>';
    var c=0; for(var k=0;k<parts;k++) if(on[k]) c++;
    var names={2:["one half","two halves"],3:["one third","two thirds","three thirds"],4:["one quarter","two quarters","three quarters","four quarters"]};
    var nm = c===0 ? "no slices" : (names[parts] && names[parts][c-1]) || (c+" parts");
    $("#frSay",wrap).innerHTML = c+"/"+parts+" of the pizza has tomato — that is <b>"+nm+"</b>."+
      (parts===4&&c===2?" &nbsp;<span style='font-size:16px'>2/4 is the same as 1/2!</span>":"");
    $$(".fslice",wrap).forEach(function(p){
      p.onclick=function(){ var i=+p.getAttribute("data-i"); on[i]=!on[i]; draw(); };
      p.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); p.onclick(); } };
    });
    if(report) report(c+"/"+parts);
  }
  wrap.addEventListener("click",function(ev){
    var p=ev.target.getAttribute&&ev.target.getAttribute("data-p"); if(!p) return;
    if(p==="clear"){ on=[]; } else { parts=+p; on=[]; }
    draw();
  });
  draw();
};

/* ---- 7. ANALOGUE CLOCK with draggable hands ---- */
WIDGETS.clock = function(host, o, report){
  o=o||{}; var h=o.h!=null?o.h:3, m=o.m!=null?o.m:0, drag=null;
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Interactive clock</h4><p class="notice">Drag the hands, or use the buttons. The <b>short</b> hand shows hours, the <b>long</b> hand shows minutes.</p>'+
    '<div id="clSvg" style="max-width:300px"></div><p class="dsp" style="font-size:24px" id="clSay"></p>'+
    '<div class="wcontrols"><button class="btn btn-sm btn-ghost" data-m="-5">−5 min</button>'+
    '<button class="btn btn-sm btn-sun" data-m="5">+5 min</button>'+
    '<button class="btn btn-sm btn-ghost" data-m="-60">−1 hour</button>'+
    '<button class="btn btn-sm btn-sea" data-m="60">+1 hour</button></div>';
  host.appendChild(wrap);
  function words(){
    var mm=m, hh=h%12; if(hh===0) hh=12;
    var nxt=(hh%12)+1;
    if(mm===0) return hh+" o'clock";
    if(mm===15) return "quarter past "+hh;
    if(mm===30) return "half past "+hh;
    if(mm===45) return "quarter to "+nxt;
    if(mm<30) return mm+" minutes past "+hh;
    return (60-mm)+" minutes to "+nxt;
  }
  function draw(){
    var marks="";
    for(var i=0;i<60;i++){
      var a=i/60*Math.PI*2-Math.PI/2, big=(i%5===0);
      var r1=big?78:83, r2=88;
      marks+='<line x1="'+(100+r1*Math.cos(a))+'" y1="'+(100+r1*Math.sin(a))+'" x2="'+(100+r2*Math.cos(a))+'" y2="'+(100+r2*Math.sin(a))+'" stroke="#16283C" stroke-width="'+(big?4:2)+'"/>';
    }
    for(var n=1;n<=12;n++){
      var an=n/12*Math.PI*2-Math.PI/2;
      marks+='<text x="'+(100+64*Math.cos(an))+'" y="'+(100+64*Math.sin(an)+7)+'" text-anchor="middle" font-size="20" font-weight="bold" font-family="Verdana" fill="#16283C">'+n+'</text>';
    }
    var ha=((h%12)+m/60)/12*Math.PI*2-Math.PI/2, ma=(m/60)*Math.PI*2-Math.PI/2;
    $("#clSvg",wrap).innerHTML='<svg viewBox="0 0 200 200" class="clockface" id="clFace" role="img" aria-label="Clock showing '+words()+'">'+
      '<circle cx="100" cy="100" r="95" fill="#FFFDF3" stroke="#16283C" stroke-width="6"/>'+marks+
      '<line id="hH" x1="100" y1="100" x2="'+(100+45*Math.cos(ha))+'" y2="'+(100+45*Math.sin(ha))+'" stroke="#1E6FA8" stroke-width="11" stroke-linecap="round"/>'+
      '<line id="hM" x1="100" y1="100" x2="'+(100+72*Math.cos(ma))+'" y2="'+(100+72*Math.sin(ma))+'" stroke="#E4572E" stroke-width="7" stroke-linecap="round"/>'+
      '<circle cx="100" cy="100" r="8" fill="#16283C"/></svg>';
    $("#clSay",wrap).innerHTML="It is <b>"+words()+"</b>";
    var f=$("#clFace",wrap);
    function ang(ev){ var r=f.getBoundingClientRect();
      var x=(ev.clientX-r.left)/r.width*200-100, y=(ev.clientY-r.top)/r.height*200-100;
      var a=Math.atan2(y,x)+Math.PI/2; if(a<0) a+=Math.PI*2; return a; }
    f.addEventListener("pointerdown",function(ev){
      var r=f.getBoundingClientRect();
      var x=(ev.clientX-r.left)/r.width*200-100, y=(ev.clientY-r.top)/r.height*200-100;
      drag = Math.sqrt(x*x+y*y)>52 ? "m":"h"; f.setPointerCapture(ev.pointerId); move(ev);
    });
    f.addEventListener("pointermove",function(ev){ if(drag) move(ev); });
    f.addEventListener("pointerup",function(){ drag=null; });
    function move(ev){
      var a=ang(ev);
      if(drag==="m"){ m=Math.round(a/(Math.PI*2)*60)%60; }
      else { h=Math.round(a/(Math.PI*2)*12)%12; if(h===0) h=12; }
      draw();
    }
    if(report) report(words());
  }
  wrap.addEventListener("click",function(ev){
    var d=ev.target.getAttribute&&ev.target.getAttribute("data-m"); if(!d) return;
    var t=h*60+m+parseInt(d,10); t=((t%720)+720)%720; h=Math.floor(t/60); if(h===0) h=12; m=t%60; draw();
  });
  draw();
};

  var N=5, x=0, y=4, dir=0, dirs=["up","right","down","left"], arrows=["⬆️","➡️","⬇️","⬅️"], trail=[];

    '<div class="wcontrols"><button class="btn btn-sm btn-grass" data-g="fwd">Forward</button>'+
    '<button class="btn btn-sm btn-sea" data-g="left">↺ Quarter turn left (anticlockwise)</button>'+

    $("#grSay",wrap).textContent="The robot is facing "+dirs[dir]+", "+(4-y)+" up and "+x+" across. Reach the flag 🏁!";

    if(g==="reset"){ x=0;y=4;dir=0;trail=[]; }
    draw();
    if(x===4&&y===0) toast("You reached the flag! 🏁");
  });
  draw();
};

/* ---- 14. TALLY / PICTOGRAM BUILDER ---- */
WIDGETS.pictogram = function(host, o, report){
  o=o||{};
  var rows = o.rows || [{l:"Cats",e:"🐱",n:4},{l:"Dogs",e:"🐶",n:7},{l:"Fish",e:"🐟",n:3},{l:"Rabbits",e:"🐰",n:5}];
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Tally chart and pictogram</h4><p class="notice">Tap a row to add one to it. Every 5th tally is a <b>gate</b> — four lines with one across.</p>'+
   '<div id="pgBody"></div>';
  host.appendChild(wrap);
  function tally(n){ var g=Math.floor(n/5), r=n%5, s=""; for(var i=0;i<g;i++) s+="卌 "; s+=Array(r+1).join("|"); return s||"—"; }
  function draw(){
    var h='<table class="tbl"><tr><th>Pet</th><th>Tally</th><th>Total</th><th>Pictogram (1 picture = 1 pet)</th></tr>';
    rows.forEach(function(r,i){
      h+='<tr><th>'+r.l+'</th><td style="font-size:19px;letter-spacing:2px">'+tally(r.n)+'</td><td class="dsp" style="font-size:20px">'+r.n+'</td>'+
         '<td style="font-size:22px">'+Array(r.n+1).join(r.e)+' <button class="btn btn-sm btn-sun" data-add="'+i+'" aria-label="Add one '+r.l+'">+1</button></td></tr>';
    });
    var most=rows.slice().sort(function(a,b){return b.n-a.n;})[0], least=rows.slice().sort(function(a,b){return a.n-b.n;})[0];
    var tot=0; rows.forEach(function(r){tot+=r.n;});
    h+='</table><p class="dsp" style="font-size:18px;margin-top:10px">Most popular: '+most.l+' ('+most.n+'). Least popular: '+least.l+' ('+least.n+
       '). Altogether: '+tot+'. Difference between most and least: '+(most.n-least.n)+'.</p>';
    $("#pgBody",wrap).innerHTML=h;
    if(report) report(tot);
  }
  wrap.addEventListener("click",function(ev){
    var a=ev.target.getAttribute&&ev.target.getAttribute("data-add"); if(a==null) return;
    rows[+a].n=Math.min(10,rows[+a].n+1); draw();
  });
  draw();
};

/* ---- 15. LABELLED DIAGRAM (data driven: plants, castles, oceans, materials...) ---- */
WIDGETS.diagram = function(host, o, report){
  o=o||{};
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>'+esc(o.title||"Labelled diagram")+'</h4><p class="notice">Tap each label to find out what that part does.</p>'+
    '<div id="dgSvg">'+o.svg+'</div><div id="dgInfo" class="callout">Tap a numbered spot on the picture.</div>'+
    '<div class="row" id="dgBtns" style="margin-top:8px"></div>';
  host.appendChild(wrap);
  var btns=$("#dgBtns",wrap);
  (o.parts||[]).forEach(function(p,i){
    var b=el("button","btn btn-sm btn-ghost",(i+1)+". "+p.n);
    b.onclick=function(){
      $("#dgInfo",wrap).innerHTML='<b class="dsp" style="font-size:19px">'+esc(p.n)+'</b><br>'+esc(p.d);
      $$("#dgBtns .btn",wrap).forEach(function(x){x.classList.remove("on");}); b.classList.add("on");
      var hot=$("#hot"+i,wrap); if(hot){ $$("[id^=hot]",wrap).forEach(function(h){h.setAttribute("fill","#FFC22E");}); hot.setAttribute("fill","#E4572E"); }
      if(report) report(p.n);
    };
    btns.appendChild(b);
  });
  $$("#dgSvg [id^=hot]",wrap).forEach(function(h,i){

/* ---- 16. TIMELINE ORDERING ---- */
WIDGETS.timeline = function(host, o, report){
  o=o||{}; var evs=o.events||[];
  var order=shuffle(evs.map(function(e,i){return i;}));
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>'+esc(o.title||"Timeline")+'</h4><p class="notice">Tap two cards to swap them until the story runs from <b>earliest</b> (left) to <b>latest</b> (right).</p>'+
    '<div class="row" id="tlRow"></div><p class="dsp" id="tlSay"></p>';
  host.appendChild(wrap);
  var sel=-1;
  function draw(){
    var row=$("#tlRow",wrap); row.innerHTML="";
    order.forEach(function(idx,pos){
      var e=evs[idx];
      var b=el("button","gtile"); b.style.minHeight="0"; b.style.flex="1 1 150px";
      b.innerHTML='<span class="gn">'+esc(e.when)+'</span><span class="gt" style="font-size:15px">'+esc(e.what)+'</span>';
      if(pos===sel) b.style.background="#FFF0C9";
      b.onclick=function(){
        if(sel<0){ sel=pos; } else { var t=order[sel]; order[sel]=order[pos]; order[pos]=t; sel=-1; }
        draw();
      };
      row.appendChild(b);
    });
    var right=order.every(function(v,i){return v===i;});
    $("#tlSay",wrap).textContent = right ? "✅ That is the correct order — well done!" : "Keep going: earliest first.";
    if(report) report(right);
  }
  draw();
};

/* ---- 17. ALGORITHM BLOCKS (computing) ---- */
WIDGETS.flowchart = function(host, o, report){
  o=o||{};
  var steps=o.steps||["Wake up","Get dressed","Eat breakfast","Brush teeth","Go to school"];
  var seq=[];
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Build the algorithm</h4><p class="notice">An <b>algorithm</b> is a list of steps in the right order. Tap steps to add them, then run the program.</p>'+
    '<div class="row" id="fcBank"></div><div class="tokrow" id="fcSeq" data-drop="1" aria-label="Your program"></div>'+
    '<div class="wcontrols"><button class="btn btn-sm btn-grass" id="fcRun">▶ Run program</button>'+
    '<button class="btn btn-sm btn-ghost" id="fcClr">Clear</button></div><div id="fcOut"></div>';
  host.appendChild(wrap);
  function draw(){
    var bank=$("#fcBank",wrap); bank.innerHTML="";
    shuffle(steps.map(function(s,i){return i;})).forEach(function(i){
      var b=el("button","tok",steps[i]);
      b.onclick=function(){ seq.push(i); draw(); };
      bank.appendChild(b);
    });
    var sq=$("#fcSeq",wrap); sq.innerHTML="";
    seq.forEach(function(i,pos){
      var b=el("button","tok",(pos+1)+". "+steps[i]); b.style.background="#DCEEF9";
      b.onclick=function(){ seq.splice(pos,1); draw(); };
      sq.appendChild(b);
    });
  }
  $("#fcRun",wrap).onclick=function(){
    var right = seq.length===steps.length && seq.every(function(v,i){return v===i;});
    $("#fcOut",wrap).innerHTML='<div class="fb '+(right?"ok":"no")+'">'+(right?"🤖 Program ran perfectly!":"🤖 The robot got muddled — this step is out of order: "+
      (steps[seq.find(function(v,i){return v!==i;})]||"one of them"))+'</div>';
    if(report) report(right);
  };
  $("#fcClr",wrap).onclick=function(){ seq=[]; $("#fcOut",wrap).innerHTML=""; draw(); };
  draw();
};

/* ---- 18. SENTENCE / WORD-CLASS TAPPER ---- */
WIDGETS.wordtap = function(host, o, report){
  o=o||{};
  var sent=o.sentence||"The hungry fox quickly ran into the dark wood.";
  var target=o.target||"adjective";
  var answers=(o.answers||["hungry","dark"]).map(function(w){return w.toLowerCase();});
  var found={};
  var wrap=el("div","widget");
  wrap.innerHTML='<h4>Word hunt</h4><p class="notice">Tap every <b>'+esc(target)+'</b> you can find in the sentence.</p>'+
    '<p class="passage" id="wtP"></p><p class="dsp" id="wtSay" style="font-size:19px"></p>';
  host.appendChild(wrap);
  function draw(){
    var p=$("#wtP",wrap); p.innerHTML="";
    sent.split(" ").forEach(function(w){
      var clean=w.replace(/[.,!?;]/g,"").toLowerCase();
      var s=el("span","word-tap"+(found[clean]?" picked":""),w+" ");
      s.tabIndex=0; s.setAttribute("role","button");
      function go(){
        if(answers.indexOf(clean)>=0){ found[clean]=1; announce(w+" is correct"); }
        else { s.style.background="#F8D8CD"; setTimeout(function(){s.style.background="";},700); announce(w+" is not a "+target); }
        draw();
      }
      s.onclick=go; s.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault(); go();} };
      p.appendChild(s);
    });
    var n=Object.keys(found).length;
    $("#wtSay",wrap).textContent = n===answers.length ? "🎉 You found all "+answers.length+"!" : "Found "+n+" of "+answers.length+".";
    if(report) report(n===answers.length);
  }
  draw();
};

/* ---- 19. READING PASSAGE with clue-hunting ---- */
WIDGETS.passage = function(host, o, report){
  o=o||{};
  var wrap=el("div","widget");
  var qs=o.questions||[];
  var idx=0, sc=0;
  wrap.innerHTML='<h4>🔎 Reading Detective: '+esc(o.title||"")+'</h4>'+
    '<div class="passage" id="psP">'+o.text+'</div><div id="psQ" style="margin-top:14px"></div>';
  host.appendChild(wrap);
  function draw(){
    var b=$("#psQ",wrap);
    if(idx>=qs.length){ b.innerHTML='<div class="fb ok">Detective work complete — you answered '+sc+' of '+qs.length+' correctly. 🕵️</div>';
      if(report) report(Math.round(sc/qs.length*100)); return; }
    var q1=qs[idx], sq1=shuffleQ(q1.o,q1.a), q={q:q1.q,o:sq1.o,a:sq1.a,why:q1.why,kind:q1.kind};
    b.innerHTML='<div class="eyebrow">'+esc(q.kind||"Find it")+' — question '+(idx+1)+' of '+qs.length+'</div>'+
      '<p class="qtext">'+esc(q.q)+'</p><div class="opts" id="psOpts"></div><div id="psFb"></div>';
    q.o.forEach(function(t,i){
      var btn=el("button","opt",esc(t));
      btn.onclick=function(){
        $$("#psOpts .opt",wrap).forEach(function(x,j){ x.disabled=true; if(j===q.a) x.classList.add("right"); });
        if(i===q.a){ sc++; btn.classList.add("right"); $("#psFb",wrap).innerHTML='<div class="fb ok">'+praise()+'<div class="sub">'+esc(q.why||"")+'</div></div>'; }
        else { btn.classList.add("wrong"); $("#psFb",wrap).innerHTML='<div class="fb no">'+nudge()+'<div class="sub">'+esc(q.why||"")+'</div></div>'; }
        var nx=el("button","btn btn-sm btn-sea","Next →"); nx.style.marginTop="10px";
        nx.onclick=function(){ idx++; draw(); };
        $("#psFb",wrap).appendChild(nx);
      };
      $("#psOpts",wrap).appendChild(btn);
    });
  }
  draw();
};
</script>
<script>
"use strict";
/* ================= GAME FRAMEWORK ================= */
var GAME_META = [
  {k:"discover", n:"DISCOVER",        d:"Tap and find out what it means", lvl:"Level 1 · Recognition"},
  {k:"match",    n:"MATCH",           d:"Pair them up correctly",         lvl:"Level 1 · Recognition"},
  {k:"sort",     n:"SORT",            d:"Drag each one into the right box",lvl:"Level 2 · Simple use"},
  {k:"build",    n:"BUILD",           d:"Make the answer yourself",       lvl:"Level 2 · Simple use"},
  {k:"find",     n:"FIND IT",         d:"Spot the right one",             lvl:"Level 3 · Practice"},
  {k:"speed",    n:"SPEED ROUND",     d:"Quick recall — timer optional",  lvl:"Level 3 · Practice"},
  {k:"fix",      n:"FIX IT",          d:"Something is wrong. Put it right",lvl:"Level 4 · Mixed"},
  {k:"puzzle",   n:"PUZZLE",          d:"Fill the gaps to solve it",      lvl:"Level 4 · Mixed"},
  {k:"reason",   n:"REASONING",       d:"Explain how you know",           lvl:"Level 5 · Reasoning"},
  {k:"master",   n:"MASTER CHALLENGE",d:"The toughest one. You can do it!",lvl:"Level 6 · Multi-step"}
];
var GAMES = {};
var GX = null;      /* current game runtime */
var GTOKEN = 0;     /* invalidates callbacks from a game the child has left */
function clearGameTimers(){ if(GX && GX.timer){ clearInterval(GX.timer); GX.timer=null; } }

function openGame(concept, i){
  var g = concept.games[i];
  var meta = GAME_META[i];
  clearGameTimers();
  GX = {c:concept, i:i, hint:0, right:0, total:0, token:++GTOKEN, timer:null};
  var myToken = GX.token;
  var main = $("#main"); main.innerHTML="";
  var back = el("button","btn btn-sm btn-ghost","← Back to "+concept.t);
  back.onclick=function(){ showConcept(concept.id, "games"); };
  main.appendChild(el("div","row",""));
  $(".row",main).appendChild(back);
  var head = el("div","panel tint-sun");
  head.innerHTML='<div class="eyebrow">Game '+(i+1)+' of 10 · '+meta.lvl+'</div>'+
    '<h2 style="margin-bottom:4px">'+meta.n+': '+esc(g.i||meta.d)+'</h2>'+
    '<p style="margin:0">'+esc(concept.t)+' · '+esc(concept.s)+'</p>';
  main.appendChild(head);
  var stage = el("div","stage"); stage.id="stage"; main.appendChild(stage);
  var tools = el("div","row"); tools.style.marginTop="14px";
  var stuck = el("button","btn btn-berry","💡 I'm Stuck");
  stuck.onclick=function(){ showHint(concept, g); };
  tools.appendChild(stuck);
  var quit = el("button","btn btn-ghost btn-sm","Choose a different game");
  quit.onclick=function(){ showConcept(concept.id,"games"); };
  tools.appendChild(quit);
  main.appendChild(tools);
  main.appendChild(el("div","","<div id='hintBox'></div>"));
  GAMES[g.t](stage, g, function(pct){
    if(!GX || GX.token !== myToken) return;   /* child has already moved on */
    finishGame(concept, i, pct);
  });
  main.focus();
  window.scrollTo(0,0);
}
function showHint(concept, g){
  var hints = g.h || concept.hints || [];
  var box = $("#hintBox");
  GX.hint = Math.min(GX.hint+1, hints.length+1);
  var h;
  if(GX.hint<=hints.length){ h = "<b>Hint "+GX.hint+":</b> "+esc(hints[GX.hint-1]); }
  else { h = "<b>Worked example:</b> "+esc(concept.worked.steps.join("  →  "))+"<br><b>So:</b> "+esc(concept.worked.answer||""); }
  box.innerHTML = '<div class="callout">💡 '+h+'</div>';
  announce("Hint shown");
}
function finishGame(concept, i, pct){
  clearGameTimers();
  var beforePts = questPoints(), beforeLvl = rankFor(beforePts).lvl;
  recordGame(concept.id, i, pct);
  var afterPts = questPoints(), afterRank = rankFor(afterPts);
  var levelledUp = afterRank.lvl > beforeLvl;
  play(levelledUp ? "levelup" : pct>=80 ? "great" : "finish");
  var stage=$("#stage");
  if(!stage) return;
  var nm = firstName();
  var msg = pct>=90 ? "🏆 Outstanding! You really understand this."
          : pct>=70 ? "⭐ Great work — you're getting confident."
          : pct>=40 ? "🌿 Good effort. A little more practice will do it."
          : "🌱 Well tried. Let's look at the lesson again and come back.";
  var box = el("div","panel "+(pct>=70?"tint-grass":"tint-sun"));
  box.innerHTML='<h3>'+(nm?esc(nm)+", you scored ":"You scored ")+pct+'%</h3><p>'+msg+'</p>'+
    '<div class="callout" style="font-size:18px">✨ '+inspire(pct)+'</div>'+
    (afterPts>beforePts ? '<p class="dsp" style="font-size:20px">+'+(afterPts-beforePts)+' quest points earned!</p>' : '')+
    (levelledUp ? '<div class="fb ok" style="font-size:20px">🎉 LEVEL UP! '+afterRank.e+' You are now Level '+afterRank.lvl+' — '+afterRank.n+'</div>' : '')+
    '<p class="notice">Mastery for '+esc(concept.t)+' is now '+mastery(concept.id)+'% · '+gamesDone(concept.id)+'/10 games played.</p>';
  var row=el("div","row");
  var again=el("button","btn btn-sun","🔁 Play again"); again.onclick=function(){ openGame(concept,i); };
  row.appendChild(again);
  if(i<9){ var nx=el("button","btn btn-grass","Next game →"); nx.onclick=function(){ openGame(concept,i+1); }; row.appendChild(nx); }
  var lesson=el("button","btn btn-ghost","📖 Back to the lesson"); lesson.onclick=function(){ showConcept(concept.id,"learn"); };
  row.appendChild(lesson);
  var all=el("button","btn btn-ghost","All 10 games"); all.onclick=function(){ showConcept(concept.id,"games"); };
  row.appendChild(all);
  box.appendChild(row);
  stage.innerHTML=""; stage.appendChild(box);
  announce("Game finished. Score "+pct+" percent.");
  stage.scrollIntoView({block:"start"});
}
/* shared: progress dots */
function dots(n){
  var d=el("div","prog");
  for(var i=0;i<n;i++) d.appendChild(el("span","dot"));
  return d;
}
function setDot(d,i,ok){ var s=d.children[i]; if(s) s.className="dot "+(ok?"ok":"no"); }
function pctOf(right,total){ return Math.round(right/Math.max(1,total)*100); }
function fb(host, ok, why){
  play(ok?"right":"wrong");
  var f=el("div","fb "+(ok?"ok":"no"), (ok?praise():nudge())+(why?'<div class="sub">'+esc(why)+'</div>':""));
  host.appendChild(f); announce(ok?"Correct":"Not quite");
  if(ok) spawnStar(f);
  return f;
}

/* ---------- GAME 1: DISCOVER ---------- */
GAMES.discover = function(stage, g, done){
  var opened={}, need=g.it.length;
  stage.innerHTML='<p class="qtext">'+esc(g.i)+'</p><div class="revealgrid" id="dvGrid"></div><div id="dvAfter"></div>';
  g.it.forEach(function(it,i){
    var b=el("button","reveal","<b>"+esc(it[0])+"</b><span>Tap to find out</span>");
    b.onclick=function(){
      opened[i]=1; b.className="reveal open"; b.innerHTML="<b>"+esc(it[0])+"</b><span>"+esc(it[1])+"</span>";
      announce(it[0]+": "+it[1]);
      if(Object.keys(opened).length===need) check();
    };
    $("#dvGrid",stage).appendChild(b);
  });
  function check(){
    var q0=g.ck, sq=shuffleQ(q0.o,q0.a), q={q:q0.q,o:sq.o,a:sq.a,why:q0.why};
    var a=$("#dvAfter",stage);
    a.innerHTML='<div class="callout">You have explored them all! One quick question:</div><p class="qtext">'+esc(q.q)+'</p><div class="opts" id="dvOpts"></div><div id="dvFb"></div>';
    q.o.forEach(function(t,i){
      var btn=el("button","opt",esc(t));
      btn.onclick=function(){
        $$("#dvOpts .opt",stage).forEach(function(x,j){ x.disabled=true; if(j===q.a) x.classList.add("right"); });
        var ok=i===q.a; if(!ok) btn.classList.add("wrong");
        fb($("#dvFb",stage), ok, q.why);
        setTimeout(function(){ done(ok?100:70); }, 1300);
      };
      $("#dvOpts",stage).appendChild(btn);
    });
    a.scrollIntoView({block:"nearest"});
  }
};

/* ---------- GAME 2: MATCH ---------- */
GAMES.match = function(stage, g, done){
  var left=g.p.map(function(p,i){return {t:p[0],i:i};});
  var right=shuffle(g.p.map(function(p,i){return {t:p[1],i:i};}));
  var sel=null, matched=0, tries=0;
  stage.innerHTML='<p class="qtext">'+esc(g.i)+'</p><div class="mcol"><div id="mL"></div><div id="mR"></div></div><div id="mFb"></div>';
  function col(host, arr, side){
    arr.forEach(function(o){
      var b=el("button","mitem",esc(o.t)); b.dataset.i=o.i; b.dataset.side=side;
      b.onclick=function(){
        if(b.classList.contains("matched")) return;
        if(!sel){ sel=b; b.classList.add("sel"); return; }
        if(sel===b){ b.classList.remove("sel"); sel=null; return; }
        if(sel.dataset.side===side){ sel.classList.remove("sel"); sel=b; b.classList.add("sel"); return; }
        tries++;
        if(sel.dataset.i===b.dataset.i){
          sel.className="mitem matched"; b.className="mitem matched"; matched++;
          play("right"); spawnStar(b); sel=null;
          announce("Matched");
          if(matched===g.p.length){
            var acc=Math.max(30, Math.round(g.p.length/tries*100));
            $("#mFb",stage).innerHTML='<div class="fb ok">All matched! You made '+tries+' attempts for '+g.p.length+' pairs.</div>';
            setTimeout(function(){ done(acc); },1200);
          }
        } else {
          var a=sel; a.classList.add("miss"); b.classList.add("miss"); sel=null;
          play("wrong"); announce("Not a pair");
          setTimeout(function(){ a.className="mitem"; b.className="mitem"; },650);
        }
      };
      host.appendChild(b);
    });
  }
  col($("#mL",stage), left, "L"); col($("#mR",stage), right, "R");
};

/* ---------- GAME 3: SORT (drag and drop, with tap fallback) ---------- */
GAMES.sort = function(stage, g, done){
  var items=shuffle(g.it.slice()), placed=0, right=0, sel=null;
  stage.innerHTML='<p class="qtext">'+esc(g.i)+'</p><p class="notice">Drag each card into a box — or tap a card, then tap a box.</p>'+
    '<div class="tokrow" id="soBank"></div><div class="bins" id="soBins"></div><div id="soFb"></div>';
  var d=dots(items.length); d.style.marginTop="10px"; stage.appendChild(d);
  g.b.forEach(function(name,bi){
    var bin=el("div","bin"); bin.setAttribute("data-drop","1"); bin.dataset.bin=bi;
    bin.innerHTML='<h4>'+esc(name)+'</h4><div class="items"></div>';
    bin.onclick=function(){ if(sel) place(sel, bin); };
    $("#soBins",stage).appendChild(bin);
  });
  function place(tok, bin){
    var ok = +tok.dataset.bin === +bin.dataset.bin;
    tok.classList.remove("sel"); sel=null;
    tok.style.background = ok? "#CFEBD5":"#F8D8CD";
    tok.style.borderColor = ok? "var(--grass-d)":"var(--berry-d)";
    tok.onclick=null; tok.disabled=true;
    $(".items",bin).appendChild(tok);
    if(ok){ right++; spawnStar(tok); }
    play(ok?"right":"wrong");
    setDot(d, placed, ok);
    placed++;
    announce(ok?"Correct box":"That belongs somewhere else");
    if(placed===items.length){
      $("#soFb",stage).innerHTML='<div class="fb '+(right===items.length?"ok":"no")+'">You sorted '+right+' of '+items.length+' correctly.</div>';
      setTimeout(function(){ done(pctOf(right,items.length)); }, 1300);
    }
  }
  items.forEach(function(it){
    var tok=el("button","tok",esc(it[0])); tok.dataset.bin=it[1];
    tok.onclick=function(){ if(sel===tok){ tok.classList.remove("sel"); sel=null; return; }
      if(sel) sel.classList.remove("sel"); sel=tok; tok.classList.add("sel"); };
    makeDrag(tok,{onDrop:function(bin){ place(tok,bin); }});
    $("#soBank",stage).appendChild(tok);
  });
};

/* ---------- GAME 4: BUILD ---------- */
GAMES.build = function(stage, g, done){
  var i=0, right=0;
  var d=dots(g.r.length);
  stage.innerHTML='<p class="qtext">'+esc(g.i)+'</p><div id="buBody"></div>';
  stage.appendChild(d);
  function draw(){
    if(i>=g.r.length){ done(pctOf(right,g.r.length)); return; }

GAMES.puzzle = function(stage, g, done){

      '<p class="notice">Tap a piece below, then tap an empty gap.</p><div class="row" id="pzBank"></div>'+

GAMES.master = function(stage, g, done){

      var inp=$("#msIn",b); inp.focus();
