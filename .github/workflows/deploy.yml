name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Lets the deploy be re-run on demand without pushing a commit — needed
  # whenever a run failed on something fixed outside the repo (an IAM role, a
  # secret, a DNS record) and the code itself is unchanged.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWAKENED_PATH_2026 }}
          projectId: awakened-path-2026
          channelId: live

      # `npm ci` above installs the FRONTEND's dependencies only. functions/ is a
      # separate npm package with its own lockfile, and the firebase CLI loads
      # functions/index.js in-process to discover which functions to deploy — so
      # without functions/node_modules it fails on the require() of
      # firebase-functions ("Couldn't find firebase-functions package in your
      # source code"), before deploying anything.
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # The hosting action above deploys hosting ONLY, so changes to
      # functions/index.js (Razorpay order creation and payment verification
      # among them) never shipped from CI and had to be pushed by hand. This
      # deploys them too. The service account JSON is written to a file rather
      # than passed inline because the firebase CLI reads credentials via
      # GOOGLE_APPLICATION_CREDENTIALS, which takes a path.
      - name: Deploy Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWAKENED_PATH_2026 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only functions \
            --project awakened-path-2026 --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
