<script>
/* The app persists through `window.storage`, an async key/value API it was
   authored against and which does not exist on plain web hosting: without it
   every save threw, the app fell back to an in-memory object, and a child's
   drawings vanished on reload. Back it with localStorage — same shape
   (get → a record with .value, or null; set/delete), same async contract, and
   per-device just as the hub page promises. A quota failure must REJECT so the
   app's own "couldn't save" toast still fires. */
(function () {
  if (window.storage) return;
  var ok = false;
  try { localStorage.setItem('aj2:probe', '1'); localStorage.removeItem('aj2:probe'); ok = true; } catch (e) { ok = false; }
  window.storage = {
    get: function (k) {
      return new Promise(function (resolve, reject) {
        if (!ok) return reject(new Error('storage unavailable'));
        var v = localStorage.getItem(k);
        resolve(v === null ? null : { key: k, value: v });
      });
    },
    set: function (k, v) {
      return new Promise(function (resolve, reject) {
        if (!ok) return reject(new Error('storage unavailable'));
        try { localStorage.setItem(k, v); resolve({ key: k, value: v }); } catch (e) { reject(e); }
      });
    },
    delete: function (k) {
      return new Promise(function (resolve, reject) {
        if (!ok) return reject(new Error('storage unavailable'));
        localStorage.removeItem(k);
        resolve(true);
      });
    },
  };
})();
</script>

const D=iso=>new Date(iso+'T12:00:00');
const fmt=iso=>{const d=D(iso);return d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'})+(d.getFullYear()!==new Date().getFullYear()?' ’'+String(d.getFullYear()).slice(2):'');};
const addDays=(iso,n)=>{const d=D(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const nextOn=(iso,day)=>{ if(day<0) return addDays(iso,7); let d=addDays(iso,1); while(D(d).getDay()!==day) d=addDays(d,1); return d; };
const tilt=n=>((n*37)%5-2)*0.8+'deg';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kid=()=>kids.find(k=>k.id===cur);
const sorted=()=>classes.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
const miles=t=>{const m={};[[.25,'🥚','Hatchling'],[.5,'🦕','Halfway hero'],[.75,'🎨','Colour champ'],[1,'🏆','Master artist']].forEach(([f,e,l])=>{const n=Math.max(1,Math.round(t*f)); if(!m[n]) m[n]=[e,l];}); return m;};

async function sget(k){try{const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null;}catch(e){return mem[k]??null;}}
async function sset(k,v){mem[k]=v;try{await window.storage.set(k,JSON.stringify(v),false);}catch(e){console.error(e);toast('Couldn’t save — try a smaller photo');}}
async function sdel(k){delete mem[k];try{await window.storage.delete(k,false);}catch(e){}}
const saveKids=()=>sset('aj2:kids',{kids,cur});
const saveClasses=()=>sset('aj2:cls:'+cur,classes);
const savePh=id=>sset('aj2:ph:'+cur+':'+id,photos[id]||[]);
const saveIdeas=()=>sset('aj2:ideas:'+cur,ideasDone);

async function boot(){
  const k=await sget('aj2:kids');
  if(k&&k.kids.length){kids=k.kids;cur=k.cur&&kids.some(x=>x.id===k.cur)?k.cur:kids[0].id;}
  else{ // first run: start with the existing journey so nothing is lost
    const id=uid(); kids=[{id,name:SEED.name,total:SEED.total,day:SEED.day,color:PALETTE[0]}]; cur=id;
    classes=SEED.dates.map((d,i)=>({id:uid(),date:d,caption:SEED.captions[i]||'',fav:i===0}));
    await saveClasses(); for(const i in SEED.photos){photos[classes[i].id]=SEED.photos[i]; await savePh(classes[i].id);} await saveKids();
  }
  await loadKid(cur);
}
async function loadKid(id){
  cur=id; classes=(await sget('aj2:cls:'+id))||[]; photos={}; ideasDone=(await sget('aj2:ideas:'+id))||[];
  await Promise.all(classes.map(async c=>{photos[c.id]=(await sget('aj2:ph:'+id+':'+c.id))||[];}));
  saveKids(); render();
}

/* ── the bead trail: cream beads for the classes still ahead, a coloured
      star disc for every one already made, and the summit at the end. ───── */
function trailSVG(done,total){
  const beads=18, lit=total?Math.min(beads,Math.round(done/total*beads)):0, W=600, y=23;
  const x0=18, x1=W-18, gap=(x1-x0)/(beads-1);
  let s=`<svg viewBox="0 0 ${W} 46" preserveAspectRatio="none" role="img" aria-label="${done} of ${total} classes done">
    <path d="M${x0} ${y}H${x1}" stroke="#E7D2AC" stroke-width="9" stroke-linecap="round"/>`;
  for(let i=0;i<beads;i++){
    const cx=x0+gap*i, on=i<lit, c=TAPES[i%TAPES.length];
    s+=on
      ? `<circle cx="${cx}" cy="${y}" r="15" fill="${c}" stroke="#fff" stroke-width="3"/>
         <path transform="translate(${cx} ${y}) scale(.62)" d="M0-11 3.4-3.5 11.6-3.3 5 2 7.1 10 0 5.3-7.1 10-5 2-11.6-3.3-3.4-3.5Z" fill="#FFE9A8"/>`
      : `<circle cx="${cx}" cy="${y}" r="11" fill="#FFFCF2" stroke="#E0CFAB" stroke-width="2.5"/>`;
  }
  return s+'</svg>';
}

/* How many cards fit a row — the sand path is drawn per row, so the rows are
   real elements and get rebuilt when the window changes width. */
function perRow(){ const w=innerWidth; return w>=1000?4:w>=720?3:2; }
function cardHTML(c,n,now){
  return `<article class="card ${now?'now':''}" style="--tilt:${tilt(n)}">
    ${now?'<span class="crown">👑</span><span class="here">You are here!</span>':''}

  </article>`;
}
/* Measures the rendered rows and paints one snaking sand path through them. */
function drawPath(){
  const wrap=$('.journey'); if(!wrap) return;
  const rows=[...wrap.querySelectorAll('.row')]; if(!rows.length) return;
  const W=wrap.clientWidth, H=wrap.clientHeight, pad=26, turn=46;
  const ys=rows.map(r=>r.offsetTop+r.offsetHeight/2);
  let d='';
  const wob=(y,i)=>y+Math.sin(i*1.7)*7;
  ys.forEach((y,i)=>{
    const ltr=i%2===0, x0=ltr?pad:W-pad, x1=ltr?W-pad:pad;
    const seg=(from,to)=>{                    /* four gentle waves per row */
      let out='';
      for(let k=1;k<=4;k++){
        const px=from+(to-from)*k/4, cx=from+(to-from)*(k-.5)/4;
        out+=` Q${cx.toFixed(0)} ${wob(y,i*4+k).toFixed(0)} ${px.toFixed(0)} ${y.toFixed(0)}`;
      }
      return out;
    };
    if(!i) d+=`M${x0.toFixed(0)} ${y.toFixed(0)}`;
    d+=seg(x0,x1);                            /* every row waves, not just the first */
    if(i<ys.length-1){                        /* U-turn into the next row */
      const ny=ys[i+1], edge=ltr?W-pad+turn:pad-turn;
      d+=` C${edge} ${y} ${edge} ${ny} ${x1.toFixed(0)} ${ny.toFixed(0)}`;
    }
  });
  wrap.querySelector('.sandpath').innerHTML=
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" fill="none" aria-hidden="true">
       <path d="${d}" stroke="#DFC091" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
       <path d="${d}" stroke="#EDD9B0" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
       <path d="${d}" stroke="#F6E9CE" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
       <path d="${d}" stroke="#DCC49A" stroke-width="6" stroke-dasharray="5 30" stroke-linecap="round" opacity=".85"/>
       <path d="${d}" stroke="#FDF6E6" stroke-width="26" stroke-dasharray="34 52" stroke-linecap="round" opacity=".5"/>
     </svg>`;
}
/* The gaps between cards are the only place a prop can stand without
   covering a child's artwork, so they are measured, not guessed. */
function placeProps(){
  $$('.row').forEach(row=>{
    const cards=[...row.querySelectorAll('.card')], props=[...row.querySelectorAll('.rowdeco')];
    if(cards.length<2){ props.forEach(p=>p.style.opacity='0'); return; }
    const rb=row.getBoundingClientRect();
    props.forEach((prop,i)=>{
      const gap=1+((+prop.dataset.gap)*(cards.length>2?2:1));
      const left=cards[Math.min(gap,cards.length)-1], right=cards[Math.min(gap,cards.length-1)];
      if(!left||!right||left===right){ prop.style.opacity='0'; return; }
      const a=left.getBoundingClientRect(), b=right.getBoundingClientRect();
      const mid=(a.right+b.left)/2-rb.left, sit=+(prop.style.getPropertyValue('--sit')||-12);
      prop.style.left=(mid-prop.offsetWidth/2)+'px';
      prop.style.top=(a.bottom-rb.top+sit-prop.offsetHeight)+'px';
      prop.style.opacity='.97';
    });
  });
}
function renderJourney(){
  const k=kid(),s=sorted(),per=perRow(); let h='<div class="journey"><div class="sandpath"></div>';
  if(!s.length) h+=`<p class="empty">The trail starts here. Add the first class and a photo of what ${esc(k.name)} made.</p>`;
  /* name, w, h, (unused), how far the prop's feet sit below the card's bottom */
  const PROPS=[['brush',58,108,0,-58],['palette',78,86,0,-26],['dino-purple',74,124,0,-4],
               ['leaf-a',60,74,0,-10],['egg',78,72,0,-6],['brush2',72,128,0,-52],
               ['pencil',50,96,0,-44],['leaf-b',60,82,0,-12],['tube',44,70,0,-6]];
  for(let i=0,row=0;i<s.length;i+=per,row++){
    const chunk=s.slice(i,i+per);
    let props='';
    for(let d=0;d<2;d++){
      const [name,w,ht,,sit]=PROPS[(row*2+d)%PROPS.length];
      props+=`<i class="rowdeco" data-gap="${d}" style="width:${w}px;height:${ht}px;--sit:${sit}` +
             `;background-image:url('/kids-adventure/kit/${name}.webp')"></i>`;
    }
    for(let t=0;t<3;t++) props+=`<span class="rowstar" style="left:${(9+t*34+(row%2?7:0))}%;top:${t%2?4:92}%">★</span>`;
    h+=`<div class="row">${props}<div class="cards" style="--per:${per}">`+
       chunk.map((c,j)=>cardHTML(c,i+j+1,i+j===s.length-1)).join('')+`</div></div>`;
  }
  h+='</div>';
  if(s.length<k.total){
    h+=`<div class="center"><button class="big" data-act="addclass">＋ Add Class ${s.length+1}</button></div>`;
    const M=miles(k.total); let d=s.length?s[s.length-1].date:null, peb='';
    for(let n=s.length+1;n<=k.total;n++){ d=d?nextOn(d,k.day):(k.start||today()); const m=M[n];
      peb+=`<div class="pebble ${m?'mile':''}">${m?`<i>${m[0]}</i>`:''}<b>${n}</b>${fmt(d)}${m?`<br><small>${m[1]}</small>`:''}</div>`; }
    h+=`<h2>The trail ahead</h2><p class="sub">${k.day>=0?'Every '+DAYS[k.day]:'Weekly'} until the summit</p><div class="upcoming">${peb}</div>`;
  } else h+=`<div class="center"><button class="big" data-act="editkid">＋ Top up lessons</button></div>`;
  $('#view').innerHTML=h;
  drawPath(); placeProps();
  /* fonts and photos change row heights, so re-measure once they land */
  requestAnimationFrame(()=>{ drawPath(); placeProps(); });
  setTimeout(()=>{ drawPath(); placeProps(); },400);
}
function renderGallery(favOnly){
  const s=sorted(),items=[]; s.forEach((c,i)=>{ if(favOnly&&!c.fav) return; (photos[c.id]||[]).forEach(p=>items.push({c,n:i+1,p})); });
  lbList=items;
  const hint=`<div class="irow"><button class="ghost" data-act="ideas">💡 Need an idea for today?</button></div>`;
  $('#view').innerHTML=hint+(items.length?'<div class="gallery">'+items.map((it,i)=>`<button class="gitem" style="--tilt:${tilt(i+3)}" data-g="${i}"><img src="${it.p}" alt="Class ${it.n} artwork"><span>Class ${it.n} · ${fmt(it.c.date)}${it.c.caption?' – '+esc(it.c.caption):''}</span></button>`).join('')+'</div>'
    :`<p class="empty">${favOnly?'Tap the ♥ on any class to keep favourite creations here.':'Artwork you add will hang here.'}</p>`);
}

function ideaSheet(i){
  const done=ideasDone.includes(i.id);
  const m=sheet(`<h3>${i.e} ${esc(i.t)}</h3>
    <p class="ineed"><b>You need:</b> ${esc(i.need)}</p>
    <ol class="isteps">${i.s.map(st=>`<li>${esc(st)}</li>`).join('')}</ol>
    <div class="acts"><div class="grow"><button class="ghost" data-a="x">Close</button>
      <button class="big" data-a="done">${done?'✓ Made it — undo':'✓ I made it!'}</button></div></div>`);
  m.addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.a==='x') m.remove();
    if(b.dataset.a==='done'){
      m.remove();
      if(done) ideasDone=ideasDone.filter(x=>x!==i.id);
      else {
        ideasDone=ideasDone.concat(i.id);
        if(SND) SND.sfx.levelUp();
        confetti(40);
        if(JUICE && ideasDone.length%3===0) JUICE.stickers.earn('ideas-'+ideasDone.length, ideasDone.length+' ideas made');
        toast(`${i.e} ${i.t} — nice work!`);
      }
      await saveIdeas(); render();
    }
  });
}

/* ---------- sheets ---------- */
function sheet(html){const m=document.createElement('div');m.className='md';m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('click',e=>{if(e.target===m)m.remove();}); document.body.appendChild(m); m.querySelector('input,select,button')?.focus(); return m;}
function ask(msg,ok){return new Promise(res=>{const m=sheet(`<h3>${msg}</h3><div class="acts"><div class="grow"><button class="ghost" data-a="n">Keep it</button><button class="big" style="background:#c93a3f;box-shadow:0 4px 0 #8e2226" data-a="y">${ok}</button></div></div>`);
  m.addEventListener('click',e=>{const a=e.target.dataset.a;if(a){m.remove();res(a==='y');}});});}

        kids.push({id,name,total,day,color,start}); cur=id; classes=[]; photos={};
        if(back){ let d=start; if(day>=0&&D(d).getDay()!==day) d=nextOn(addDays(d,-1),day);
          while(d<=today()&&classes.length<total){classes.push({id:uid(),date:d,caption:'',fav:false}); d=nextOn(d,day);} }
        await saveClasses(); m.remove(); view='journey'; await loadKid(id); toast(`${name}’s journey has begun! 🎨`);
      } else {
        if(total<classes.length){$('#ke').textContent=`${name} has already done ${classes.length} classes`;return;}
        Object.assign(k,{name,total,day,color}); await saveKids(); m.remove(); render(); toast('Saved');
      }
    }
  });
}

async function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const sc=Math.min(1,1100/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.78));};img.src=fr.result;};fr.readAsDataURL(file);});}
function pick(){return new Promise(res=>{const f=$('#file');f.value='';f.onchange=()=>res([...f.files]);f.click();});}

function classSheet(c,autoPick){
  const isNew=!c, s=sorted(); c=c||{id:uid(),date:nextDate(),caption:'',fav:false};
  let ph=(photos[c.id]||[]).slice(); const n=isNew?s.length+1:s.findIndex(x=>x.id===c.id)+1;
  const m=sheet(`<h3>${isNew?'Add Class '+n:'Class '+n}</h3>
    <label class="fld">Class date<input id="cd" type="date" value="${c.date}"></label>
    <label class="fld">What did they make?<input id="cc" value="${esc(c.caption)}" maxlength="60" placeholder="e.g. Sunflowers in a jar" autocomplete="off"></label>
    <div class="fld">Photos <small>Add as many as you like (up to ${MAXPH}).</small><div class="thumbs" id="thumbs"></div></div>
    <p class="err" id="ce"></p>
    <div class="acts">${isNew?'':'<button class="danger" data-a="del">Delete class</button>'}
      <div class="grow"><button class="ghost" data-a="x">Cancel</button><button class="big" data-a="ok">${isNew?'Add class':'Save'}</button></div></div>`);
  const draw=()=>{$('#thumbs').innerHTML=ph.map((p,i)=>`<div class="th"><img src="${p}" alt="Photo ${i+1}"><button data-rm="${i}" aria-label="Remove photo ${i+1}">✕</button></div>`).join('')+(ph.length<MAXPH?'<button class="addph" data-a="add">＋ Add photos</button>':'');};
  const addPhotos=async()=>{const fs=await pick(); for(const f of fs){ if(ph.length>=MAXPH)break; try{ph.push(await compress(f));}catch(e){$('#ce').textContent='One file couldn’t be opened as a photo';} } draw();};
  draw(); if(autoPick) addPhotos();
  m.addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.rm!==undefined){ph.splice(+b.dataset.rm,1);draw();}
    const a=b.dataset.a;
    if(a==='add') addPhotos();
    if(a==='x') m.remove();
    if(a==='del'){ m.remove(); if(await ask(`Delete Class ${n} and its photos?`,'Delete')){ classes=classes.filter(x=>x.id!==c.id); delete photos[c.id];
      await sdel('aj2:ph:'+cur+':'+c.id); await saveClasses(); render(); toast('Class deleted'); } }
    if(a==='ok'){
      const date=$('#cd').value; if(!date){$('#ce').textContent='Choose the class date';return;}
      if(isNew&&classes.length>=kid().total){$('#ce').textContent='All lessons are used — top up lessons first';return;}
      const had=(photos[c.id]||[]).length;
      c.date=date; c.caption=$('#cc').value.trim(); if(isNew) classes.push(c);
      photos[c.id]=ph; await saveClasses(); await savePh(c.id); m.remove(); render();
      if(ph.length>had){confetti(); toast(`Class ${sorted().findIndex(x=>x.id===c.id)+1} artwork added! 🎨`);} else toast(isNew?'Class added':'Saved');
    }
  });
}

/* ---------- misc ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200);}
function confetti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=TAPES[i%TAPES.length];
    c.style.animationDelay=Math.random()*.5+'s';c.style.borderRadius=i%2?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);} }
function openLb(i){ if(!lbList.length) return; lbIdx=(i+lbList.length)%lbList.length; const it=lbList[lbIdx];
  $('#lbimg').src=it.p; $('#lbimg').alt=`Class ${it.n} artwork`; $('#lbcap').textContent=`Class ${it.n} · ${fmt(it.c.date)}${it.c.caption?' – '+it.c.caption:''}`; $('#lb').classList.add('open'); }

document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b||b.closest('.md')) return;
  if(b.dataset.kid){ if(b.dataset.kid!==cur){SFX.pop();view='journey';await loadKid(b.dataset.kid);} }
  else if(b.dataset.act==='newkid') kidSheet();
  else if(b.dataset.act==='editkid') kidSheet(kid());
  else if(b.dataset.act==='addclass') classSheet();
  else if(b.dataset.up){ SFX.splat(360); classSheet(classes.find(c=>c.id===b.dataset.up),true); }
  else if(b.dataset.edit) classSheet(classes.find(c=>c.id===b.dataset.edit));
  else if(b.dataset.fav){ const c=classes.find(x=>x.id===b.dataset.fav); c.fav=!c.fav;
    if(c.fav){ SFX.ding(); if(JUICE) JUICE.burstAt(b, 10); } else SFX.pop();
    await saveClasses(); render(); }
  else if(b.dataset.open){ SFX.splat(300+ (sorted().findIndex(x=>x.id===b.dataset.open)+1)*24);
    const s=sorted(),n=s.findIndex(x=>x.id===b.dataset.open)+1,c=s[n-1]; lbList=photos[c.id].map(p=>({c,n,p})); openLb(0); }
  else if(b.dataset.g!==undefined) openLb(+b.dataset.g);
  else if(b.dataset.idea){ SFX.splat(420); ideaSheet(ideaById(b.dataset.idea)); }
  else if(b.dataset.ic){ ideaCat=b.dataset.ic; render(); }
  else if(b.dataset.act==='surprise') ideaSheet(IDEAS[Math.floor(Math.random()*IDEAS.length)]);
  else if(b.dataset.act==='ideas'){ view='ideas'; render(); }
  else if(b.classList.contains('pill')){ SFX.page(); view=b.dataset.v; render(); }

});
$('#lbprev').onclick=()=>openLb(lbIdx-1); $('#lbnext').onclick=()=>openLb(lbIdx+1); $('#lbclose').onclick=()=>$('#lb').classList.remove('open');
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').classList.remove('open');});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#lb').classList.remove('open'); document.querySelector('.md')?.remove(); }
  if($('#lb').classList.contains('open')){ if(e.key==='ArrowRight')openLb(lbIdx+1); if(e.key==='ArrowLeft')openLb(lbIdx-1);} });
if(window.KJA && window.KJA.ui) window.KJA.ui.toolbar('#mutebar');
/* Art World joins the shared jar and the shared place-keeper: a saved
   drawing is worth stars anywhere else in the adventure, and coming back
   tomorrow offers this sketchbook straight back. */
const JY = (window.KJA && window.KJA.journey) || null;
if (JY) JY.visit.mark('art', 'Art World · my sketchbook');

/* The sand path is drawn per row, so a width change means new rows. */
let rz, lastPer=perRow();
addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(view!=='journey') return;
  if(perRow()!==lastPer){ lastPer=perRow(); render(); } else { drawPath(); placeProps(); }
},180); });

boot();
</script>
