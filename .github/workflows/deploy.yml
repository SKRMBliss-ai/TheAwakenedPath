name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Lets the deploy be re-run on demand without pushing a commit — needed
  # whenever a run failed on something fixed outside the repo (an IAM role, a
  # secret, a DNS record) and the code itself is unchanged.
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Cloud Functions to deploy: "changed" (default — only what this commit
          changed), "all", "none", or a comma-separated list such as
          "witnessPresence,siteChat".
        required: false
        default: changed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The functions diff below compares against the commit before the push.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # VITE_ vars are baked into the bundle at build time, so the App Check
      # site key has to be present HERE — setting it in Firebase or at runtime
      # does nothing. Until the repository variable exists this is empty, which
      # is the current behaviour: src/firebase.ts skips App Check entirely.
      #
      # A repository *variable*, not a secret: the site key ships inside the
      # JavaScript bundle by design and is public. The matching secret key is
      # the private half, and that one lives in the Firebase console.
      - name: Build
        run: npm run build:seo
        env:
          VITE_APPCHECK_SITE_KEY: ${{ vars.APPCHECK_SITE_KEY }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWAKENED_PATH_2026 }}
          projectId: awakened-path-2026
          channelId: live

      # Deploying EVERY function on every push made Cloud Run start a new copy
      # of ~47 services at once, which overran the project's regional CPU quota
      # and left dozens of functions un-updated while the job went red. So work
      # out what actually needs deploying (scripts/changed-functions.mjs):
      #   - nothing under functions/ changed  -> no functions are deployed;
      #   - only some functions' own code changed -> only those are deployed;
      #   - something shared changed (a helper, a price table, dependencies,
      #     another file) -> all of them, because we cannot see which ones use it.
      # Run it by hand with the `functions` input: changed | all | none | a list.
      - name: Work out which Cloud Functions to deploy
        id: fn
        env:
          REQUESTED: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
        run: |
          requested="${REQUESTED:-changed}"
          case "$requested" in
            none)
              names="" ;;
            all)
              names=$(node scripts/changed-functions.mjs --all | jq -r '.names | join(",")') ;;
            changed)
              base="$BEFORE"
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base="HEAD~1"
              fi
              names=$(node scripts/changed-functions.mjs "$base" | jq -r '.names | join(",")') ;;
            *)
              if ! printf '%s' "$requested" | grep -Eq '^[A-Za-z0-9_]+(,[A-Za-z0-9_]+)*$'; then
                echo "::error::Invalid function list: $requested"
                exit 1
              fi
              names="$requested" ;;
          esac
          echo "Functions to deploy: ${names:-none}"
          echo "names=$names" >> "$GITHUB_OUTPUT"

      # `npm ci` above installs the FRONTEND's dependencies only. functions/ is a
      # separate npm package with its own lockfile, and the firebase CLI loads
      # functions/index.js in-process to discover which functions to deploy — so
      # without functions/node_modules it fails on the require() of
      # firebase-functions ("Couldn't find firebase-functions package in your
      # source code"), before deploying anything.
      - name: Install Cloud Functions dependencies
        if: steps.fn.outputs.names != ''
        run: npm ci --prefix functions

      # The hosting action above deploys hosting ONLY, so changes to
      # functions/index.js (Razorpay order creation and payment verification
      # among them) never shipped from CI and had to be pushed by hand. This
      # deploys them too, a few at a time (scripts/deploy-functions.sh retries a
      # batch that hits the quota). The service account JSON is written to a file
      # rather than passed inline because the firebase CLI reads credentials via
      # GOOGLE_APPLICATION_CREDENTIALS, which takes a path.
      #
      # Note: deploying by name never DELETES a function. If one is removed from
      # the code, delete it by hand: firebase functions:delete <name> --project awakened-path-2026
      - name: Deploy Cloud Functions
        if: steps.fn.outputs.names != ''
        timeout-minutes: 120
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWAKENED_PATH_2026 }}
          NAMES: ${{ steps.fn.outputs.names }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          bash scripts/deploy-functions.sh "$NAMES"
