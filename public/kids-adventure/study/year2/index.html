<script>
"use strict";
/* ================= SOUND (generated, no audio files needed) ================= */
var SOUND = { on:true, ctx:null };
function soundInit(){
  if(SOUND.ctx) return SOUND.ctx;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    SOUND.ctx = new AC();
  }catch(e){ return null; }
  return SOUND.ctx;
}
function tone(freq, start, dur, type, vol){
  var ctx = SOUND.ctx; if(!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  var t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.16, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function play(name){
  if(!SOUND.on) return;
  if(name==="star"){ var c0=soundInit(); if(!c0) return; if(c0.state==="suspended"){try{c0.resume();}catch(e){}}
    tone(1047,0,.09,"triangle",.13); tone(1568,.06,.14,"triangle",.11); return; }
  var ctx = soundInit(); if(!ctx) return;
  if(ctx.state === "suspended"){ try{ ctx.resume(); }catch(e){} }
  if(name==="right"){ tone(659,0,.13,"triangle"); tone(880,.09,.18,"triangle"); }
  else if(name==="wrong"){ tone(311,0,.16,"sine",.11); tone(262,.11,.22,"sine",.10); }
  else if(name==="tap"){ tone(700,0,.05,"sine",.06); }
  else if(name==="finish"){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*0.11,.28,"triangle",.15); }); }
  else if(name==="great"){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*0.09,.32,"triangle",.16); }); tone(784,.55,.5,"sine",.10); }
  else if(name==="badge"){ [784,988,1175,1568].forEach(function(f,i){ tone(f,i*0.08,.35,"square",.09); }); }
  else if(name==="levelup"){ [392,523,659,784,1047].forEach(function(f,i){ tone(f,i*0.1,.36,"triangle",.15); }); }
}
function setSound(on){
  SOUND.on = !!on;
  try{ localStorage.setItem("y2quest.sound", on?"1":"0"); }catch(e){}
  var b = $("#soundBtn");
  if(b){ b.textContent = on ? "🔊" : "🔇"; b.setAttribute("aria-label", on ? "Sound is on. Turn sound off" : "Sound is off. Turn sound on"); b.setAttribute("aria-pressed", on?"true":"false"); }
}
function loadSoundPref(){
  var v = null;
  try{ v = localStorage.getItem("y2quest.sound"); }catch(e){}
  setSound(v === null ? true : v === "1");
}

/* ================= ANSWER SHUFFLING =================
   Every multiple-choice question is shuffled at the moment it is drawn.
   Without this the correct answer sat in the first box far too often,
   and a child could score well by tapping the top option every time.   */
function shuffleQ(opts, ans){
  var order = shuffle(opts.map(function(_,i){ return i; }));
  return { o: order.map(function(i){ return opts[i]; }), a: order.indexOf(ans) };
}

/* ================= PLAYER PROFILES (local, no server) ================= */
var PROFKEY = "y2quest.profiles.v1", ACTKEY = "y2quest.active";
var AVATARS = ["🦊","🐢","🦉","🐙","🦕","🐝","🦋","🐼","🦁","🐧","🦄","🐨"];
var PROFILES = [], ACTIVE = null;
function loadProfiles(){
  try{ PROFILES = JSON.parse(localStorage.getItem(PROFKEY) || "[]"); }catch(e){ PROFILES = []; }
  /* one-time migration from the single-player version */
  try{
    if(!PROFILES.length && localStorage.getItem("y2quest.v1")){
      var id = "p"+Date.now();
      PROFILES = [{id:id, name:"Explorer", av:"🦊"}];
      localStorage.setItem("y2quest.v1."+id, localStorage.getItem("y2quest.v1"));
      localStorage.removeItem("y2quest.v1");
      saveProfiles(); localStorage.setItem(ACTKEY, id);
    }
  }catch(e){}
  try{ ACTIVE = localStorage.getItem(ACTKEY); }catch(e){ ACTIVE = null; }
  if(ACTIVE && !PROFILES.some(function(p){ return p.id===ACTIVE; })) ACTIVE = null;
}
function saveProfiles(){ try{ localStorage.setItem(PROFKEY, JSON.stringify(PROFILES)); }catch(e){} }
function activeProfile(){ for(var i=0;i<PROFILES.length;i++) if(PROFILES[i].id===ACTIVE) return PROFILES[i]; return null; }
function addProfile(name, av){
  var p = {id:"p"+Date.now()+Math.floor(Math.random()*999), name:name||"Explorer", av:av||"🦊"};
  PROFILES.push(p); saveProfiles(); switchProfile(p.id); return p;
}
function switchProfile(id){
  ACTIVE = id;
  try{ localStorage.setItem(ACTKEY, id); }catch(e){}
  /* reset in-memory state, then load this child's own save */
  S.concepts={}; S.badges={}; S.boost={}; S.sats={}; S.streak=0; S.lastDay="";
  S.visited={}; S.totalGames=0; S.log=[]; S.name="";
  /* reward state is per child too, or a new player would inherit the last one's collection */
  S.pack="dino"; S.stars=0; S.stickers={}; S.starPoints=0; S.jarOn=true; S.jarPos=null;
  load();
  var p = activeProfile();
  if(p && !S.name){ S.name = p.name; save(); }
  paintProfileBtn();
  if(typeof unmountJar==="function"){ unmountJar(); mountJar(); drawJar(); }
}
function paintProfileBtn(){
  var b = $("#profBtn"), p = activeProfile();
  if(!b) return;
  b.innerHTML = p ? (p.av + " " + esc(p.name)) : "👤 Choose player";
  b.setAttribute("aria-label", p ? ("Playing as "+p.name+". Switch player") : "Choose a player");
}

/* ================= QUEST POINTS AND LEVELS ================= */
var RANKS = [
 {lvl:1,  n:"Cadet Explorer",   e:"🌱", min:0},
 {lvl:2,  n:"Pathfinder",       e:"🧭", min:150},
 {lvl:3,  n:"Map Reader",       e:"🗺", min:350},
 {lvl:4,  n:"Island Hopper",    e:"⛵", min:600},
 {lvl:5,  n:"Trail Blazer",     e:"🔥", min:900},
 {lvl:6,  n:"Quest Knight",     e:"🛡", min:1250},
 {lvl:7,  n:"Star Navigator",   e:"⭐", min:1650},
 {lvl:8,  n:"Master Explorer",  e:"🏅", min:2100},
 {lvl:9,  n:"Grand Champion",   e:"🏆", min:2600},
 {lvl:10, n:"Legend of Year 2", e:"👑", min:3000}
];
function questPoints(){
  var t=0;
  CONCEPTS.forEach(function(c){
    var g=cstate(c.id).games;
    for(var i=0;i<10;i++) if(g[i]!=null) t+=g[i];
  });
  return Math.round(t/10) + (S.starPoints||0);
}
function rankFor(pts){
  var r=RANKS[0];
  for(var i=0;i<RANKS.length;i++) if(pts>=RANKS[i].min) r=RANKS[i];
  return r;
}
function nextRank(pts){
  for(var i=0;i<RANKS.length;i++) if(pts<RANKS[i].min) return RANKS[i];
  return null;
}
function levelBar(){
  var pts=questPoints(), r=rankFor(pts), nx=nextRank(pts);
  var lo=r.min, hi=nx?nx.min:r.min+1;
  var pct=nx?Math.round((pts-lo)/(hi-lo)*100):100;
  var d=el("div","card");
  d.innerHTML='<div class="row" style="justify-content:space-between;align-items:center">'+
    '<div><span style="font-size:30px">'+r.e+'</span> <b class="dsp" style="font-size:21px">Level '+r.lvl+' · '+r.n+'</b></div>'+
    '<span class="pill">'+pts+' quest points</span></div>'+
    '<div class="bar b-plum"><i style="width:'+pct+'%"></i></div>'+
    '<div class="notice">'+(nx?("Just "+(nx.min-pts)+" more points to reach "+nx.e+" "+nx.n+"!"):"Top level reached — you are a Year 2 Legend! 👑")+'</div>';
  return d;
}

/* ================= PERSONALISED ENCOURAGEMENT ================= */
var INSPIRE_HIGH = [
 "Your brain grew today, {n}. That is what practice does.",
 "{n}, you didn't just get it right — you understood it. That is the real prize.",
 "Brilliant, {n}. Hard things become easy when you keep showing up.",
 "That was tricky, and you did it anyway, {n}. That is what learning looks like.",
 "{n}, mistakes make your brain stronger — and you made hardly any!"
];
var INSPIRE_MID = [
 "Good effort, {n}. Every question you got wrong is one you now know.",
 "{n}, getting better is more important than getting it perfect.",
 "You are on your way, {n}. One more go and this will click.",
 "Nice work, {n}. Your brain is busy building something new.",
 "{n}, tricky things feel hard right up until the moment they feel easy."
];
var INSPIRE_LOW = [
 "Well done for finishing, {n}. Brave learners try the hard things.",
 "{n}, this one is tough — and tough is exactly where learning happens.",
 "Let's look at the lesson together, {n}, then come back and show it who's boss.",
 "Not yet, {n} — and 'not yet' is a much better word than 'no'.",

function inspire(pct){
  var p = activeProfile();
  var n = (S.name || (p&&p.name) || "explorer");
  var list = pct>=80 ? INSPIRE_HIGH : pct>=50 ? INSPIRE_MID : INSPIRE_LOW;

<script>
"use strict";
/* =====================================================================
   BUILD IT UP — step-by-step ladders for the hardest concepts.
   Each rung teaches ONE small idea and checks it before unlocking the
   next. A child meeting division for the first time starts at "sharing
   means fair" and only reaches the ÷ symbol on rung 5.
   ===================================================================== */
var BUILDUP = {};

BUILDUP.div = { intro:"You have never divided before? Perfect. Start at rung 1 — we begin with sharing sweets, and the ÷ sign does not appear until rung 5.", rungs:[
 {t:"Fair means the same",
  say:"Before any maths, one idea: <b>fair</b> means everyone gets the <b>same amount</b>. Not nearly the same. Exactly the same.",
  ask:{q:"Two children share 6 sweets. Which is fair?",o:["One gets 4, one gets 2","Both get 3","One gets 5, one gets 1"],a:1,why:"Both get 3. Same amount each — that is fair."}},
 {t:"Deal them out one at a time",
  say:"How do you make it fair without counting first? <b>Deal</b>, like cards. One for you, one for me, one for you, one for me… you can never go wrong.",
  ask:{q:"You deal 8 stickers between 2 friends, one at a time. How many rounds of dealing?",o:["2 rounds","4 rounds","8 rounds"],a:1,why:"Each round gives away 2 stickers. 8 stickers ÷ 2 per round = 4 rounds, and each friend ends up with 4."}},
 {t:"Now try it yourself",
  say:"Use the baskets below. Set it to <b>12 apples</b> and <b>3 baskets</b>, and look at how many end up in each basket.",
  doit:{w:"sharing", o:{total:12,groups:3}, task:"Make it 12 apples in 3 baskets, then read how many are in each.", target:4}},
 {t:"The answer is 'how many EACH'",
  say:"When you share, the answer is not how many you started with, and not how many baskets. The answer is <b>how many each one gets</b>.",
  ask:{q:"15 shared between 5 baskets gives 3 in each. What is the answer to the question '15 shared between 5'?",o:["15","5","3"],a:2,why:"The answer is the amount in ONE basket: 3."}},
 {t:"Meet the ÷ sign",
  say:"Mathematicians got tired of writing 'shared between'. So they invented a symbol: <b>÷</b>. It means exactly the same thing.<br><br>12 shared between 3 &nbsp;→&nbsp; <b>12 ÷ 3 = 4</b>",
  ask:{q:"How do you write '10 shared between 2 is 5'?",o:["10 ÷ 2 = 5","10 × 2 = 5","2 ÷ 10 = 5"],a:0,why:"The big number goes first, then ÷, then how many groups."}},
 {t:"The second kind of question",
  say:"Sharing asks <b>how many each?</b> But there is another question: <b>how many groups?</b><br><br>'I have 12 apples. I put 3 in each bag. How many bags?' That is called <b>grouping</b> — and surprisingly, it uses the same calculation.",
  ask:{q:"12 apples, 3 in each bag. How many bags?",o:["3 bags","4 bags","12 bags"],a:1,why:"Count in 3s to 12: 3, 6, 9, 12. That is 4 bags. And 12 ÷ 3 = 4, the same as before."}},
 {t:"Two questions, one calculation",
  say:"This is the clever bit. <b>12 ÷ 3 = 4</b> answers both:<br>• 12 shared between 3 → <b>4 each</b><br>• 12 in groups of 3 → <b>4 groups</b><br><br>You never have to decide which method — the sum is the same either way.",
  ask:{q:"20 ÷ 5 = 4. Which sentence is TRUE?",o:["Only '20 shared between 5 is 4 each'","Only '20 in groups of 5 is 4 groups'","Both of those are true"],a:2,why:"One calculation, two ways of reading it."}},
 {t:"Use a times table you already know",
  say:"Here is the shortcut. You know 5 × 4 = 20. So you already know <b>20 ÷ 5 = 4</b> without working anything out. Division just runs the times table backwards.",
  ask:{q:"You know 2 × 8 = 16. So what is 16 ÷ 2?",o:["8","16","32"],a:0,why:"Run it backwards. No counting needed."}},
 {t:"When it does not fit exactly",
  say:"Sometimes it will not share evenly. 13 sweets between 4 children gives 3 each, and <b>1 left over</b>. That leftover has a name: the <b>remainder</b>.",
  ask:{q:"11 shared between 5. What happens?",o:["2 each with 1 left over","3 each with none left","1 each with 6 left over"],a:0,why:"5 × 2 = 10, so 2 each and 1 remaining."}},
 {t:"Spot it in a word problem",
  say:"Last rung. Word problems hide the division inside a story. The clue words are <b>shared, split, each, groups of, how many bags/plates/teams</b>.",
  ask:{q:"'24 children go into teams of 6. How many teams?' Which calculation?",o:["24 ÷ 6","24 × 6","24 + 6"],a:0,why:"'Teams of 6' means groups of 6 — that is division. The answer is 4 teams."}}
]};

BUILDUP.mult = { intro:"Start here if times tables are brand new. We begin with counting equal piles and only reach the × sign on rung 4.", rungs:[
 {t:"Equal groups",
  say:"Multiplication is about groups that are all <b>the same size</b>. Three piles of 4 counters is equal groups. Piles of 4, 3 and 5 is not.",
  ask:{q:"Which shows equal groups?",o:["🍎🍎 | 🍎🍎 | 🍎🍎","🍎🍎🍎 | 🍎 | 🍎🍎","🍎 | 🍎🍎🍎🍎"],a:0,why:"Every group has exactly 2."}},
 {t:"Adding the same number again and again",
  say:"To find the total of 3 groups of 4, you could add: <b>4 + 4 + 4 = 12</b>. That works, but it gets slow with 8 groups.",
  ask:{q:"5 groups of 2. What is the repeated addition?",o:["2 + 2 + 2 + 2 + 2","5 + 2","2 + 5 + 2"],a:0,why:"Five lots of two."}},
 {t:"Line them up in rows",
  say:"Now arrange the groups in neat rows. That is called an <b>array</b>. Use the buttons to make <b>3 rows of 4</b>.",
  doit:{w:"array", o:{rows:1,cols:1}, task:"Build 3 rows of 4 and read the total.", target:12}},
 {t:"Meet the × sign",
  say:"'3 rows of 4' is written <b>3 × 4</b>. The × means 'lots of' or 'groups of'.<br><br>3 × 4 = 12, and it means exactly the same as 4 + 4 + 4.",
  ask:{q:"How do you write '5 groups of 2'?",o:["5 × 2","5 + 2","2 − 5"],a:0,why:"Groups first, then the size of each group."}},
 {t:"Turn the array on its side",
  say:"Something surprising: turn a 3 × 4 array sideways and it becomes 4 × 3. Not a single dot was added or removed — so the answer must be the same.",
  ask:{q:"You know 2 × 9 = 18. What is 9 × 2?",o:["18","11","81"],a:0,why:"Order does not change the answer, so you get this one free."}},
 {t:"Count in steps instead",
  say:"You do not have to count every dot. For 5 × 3, just count in 5s three times: <b>5, 10, 15</b>. Faster and safer.",
  ask:{q:"Count in 10s four times. Where do you land?",o:["14","40","104"],a:1,why:"10, 20, 30, 40. So 10 × 4 = 40."}},
 {t:"The three tables you need this year",
  say:"In Year 2 you learn <b>2s, 5s and 10s</b> by heart. Each has a giveaway pattern: the 2s are all even, the 5s all end in 5 or 0, the 10s all end in 0.",
  ask:{q:"Which number is definitely NOT in the 5 times table?",o:["35","40","32"],a:2,why:"It ends in 2, and every answer in the 5s ends in 5 or 0."}},
 {t:"Find it in real life",
  say:"Last rung. Once you spot equal groups in a story, you have found a multiplication.",
  ask:{q:"'4 tables with 5 chairs at each.' Which calculation?",o:["4 × 5","4 + 5","5 − 4"],a:0,why:"Four equal groups of five, so 4 × 5 = 20 chairs."}}
]};

BUILDUP.frac = { intro:"Fractions confuse a lot of children because of one rule they were never told clearly. We start with that rule.", rungs:[
 {t:"The rule nobody tells you",
  say:"Here is the rule that makes fractions make sense: the pieces must be <b>exactly equal</b>. Two pieces is not half. Two <b>equal</b> pieces is half.",
  ask:{q:"A cake is cut into 2 pieces — one huge, one tiny. Is each piece a half?",o:["Yes, there are 2 pieces","No, halves must be the same size","Only the big one"],a:1,why:"Equal pieces, or it is not a fraction at all."}},
 {t:"Cut it yourself",
  say:"Use the pizza. Choose <b>Halves</b>, then tap one slice. Watch what the fraction underneath says.",
  doit:{w:"fraction", o:{parts:2}, task:"Set it to halves and shade exactly one slice.", target:"1/2"}},
 {t:"What the two numbers mean",
  say:"A fraction has a number on top and a number underneath.<br><br>The <b>bottom</b> tells you how many equal pieces the whole was cut into.<br>The <b>top</b> tells you how many of those pieces you have.",
  ask:{q:"In 3/4, what does the 4 tell you?",o:["You have 4 pieces","The whole was cut into 4 equal pieces","You need 4 more"],a:1,why:"Bottom = how many pieces the whole was cut into."}},
 {t:"More pieces means SMALLER pieces",
  say:"This is the bit that catches everyone out. 1/4 looks bigger than 1/2 because 4 is bigger than 2. It is not. Cut a pizza into more pieces and each piece gets <b>smaller</b>.",
  ask:{q:"Which piece is biggest?",o:["1/2","1/4","1/8"],a:0,why:"Cut into only 2, so each piece is huge. 1/8 is the smallest."}},
 {t:"Different names, same amount",
  say:"Set the pizza to <b>Quarters</b> and shade <b>two</b> slices. Look carefully at how much pizza is covered — it is exactly half.",
  doit:{w:"fraction", o:{parts:4}, task:"Shade 2 of the 4 quarters.", target:"2/4"}},
 {t:"Fractions of a number, not just a shape",
  say:"You can take a fraction of an <b>amount</b> too. Half of 10 sweets is 5. And here is the secret: finding a fraction is just <b>dividing</b>.<br><br>Half → share into 2. Quarter → share into 4. Third → share into 3.",
  ask:{q:"How do you find a quarter of 12?",o:["12 ÷ 4","12 × 4","12 − 4"],a:0,why:"A quarter means 4 equal groups. 12 ÷ 4 = 3."}},
 {t:"When the top number is not 1",
  say:"3/4 of 12? Do it in two steps. First find <b>one</b> quarter: 12 ÷ 4 = 3. Then take <b>three</b> of them: 3 + 3 + 3 = 9.",
  ask:{q:"What is 3/4 of 8?",o:["2","6","12"],a:1,why:"One quarter of 8 is 2. Three quarters is 2 + 2 + 2 = 6."}},
 {t:"Spot fractions in real life",
  say:"Last rung. Sharing a pizza, halving a sandwich, splitting sweets with a friend — you have been doing fractions for years without the labels.",
  ask:{q:"You and 3 friends share 20 sweets equally. What fraction do you each get, and how many?",o:["1/4 each, 5 sweets","1/3 each, 7 sweets","1/2 each, 10 sweets"],a:0,why:"Four people altogether, so a quarter each. 20 ÷ 4 = 5."}}
]};

BUILDUP.time = { intro:"Clock faces are genuinely hard — two hands, two jobs, and numbers that mean two different things. One rung at a time.", rungs:[
 {t:"Two hands, two jobs",
  say:"A clock has a <b>short</b> hand and a <b>long</b> hand. The short one shows the <b>hour</b>. The long one shows the <b>minutes</b>. Learn which is which before anything else.",
  ask:{q:"Which hand tells you the hour?",o:["The short one","The long one","Whichever points at a number"],a:0,why:"Short hand = hour. It is the slow one."}},
 {t:"Straight up means o'clock",
  say:"When the <b>long</b> hand points straight up at the 12, we say <b>o'clock</b>. Then just read the short hand to know which hour it is.",
  doit:{w:"clock", o:{h:12,m:0}, task:"Set the clock to 4 o'clock.", target:"4 o'clock"}},
 {t:"The numbers are worth 5 each",
  say:"Here is the trick nobody explains. The numbers on the clock face do <b>not</b> mean minutes. Each step from one number to the next is <b>5 minutes</b>.<br><br>So the long hand on the 3 means 15 minutes, not 3.",
  ask:{q:"The long hand points at the 4. How many minutes past?",o:["4 minutes","20 minutes","40 minutes"],a:1,why:"Count in 5s: 5, 10, 15, 20."}},
 {t:"Halfway round is half past",
  say:"When the long hand reaches the 6, it has gone <b>halfway</b> round the clock. 30 minutes have passed, so we say <b>half past</b>.",
  doit:{w:"clock", o:{h:12,m:0}, task:"Set the clock to half past 7.", target:"half past 7"}},
 {t:"A quarter of the way round",
  say:"The long hand on the 3 has gone a <b>quarter</b> of the way round — 15 minutes. We say <b>quarter past</b>.",
  ask:{q:"Long hand on the 3, short hand just past the 8. What time?",o:["Quarter past 8","Quarter to 8","3 o'clock"],a:0,why:"15 minutes after 8."}},
 {t:"The tricky one: quarter TO",
  say:"Once the long hand passes the 6, we stop counting forwards and start counting <b>towards the next hour</b>.<br><br>On the 9 there are 15 minutes still to go, so we say <b>quarter to</b> — and we name the hour that is <b>coming</b>, not the one just gone.",
  ask:{q:"Long hand on the 9, short hand between 4 and 5. What time?",o:["Quarter past 4","Quarter to 5","Quarter to 4"],a:1,why:"Past the 6, so count to the next hour: 5. This is the mistake almost everyone makes at first."}},
 {t:"Why the short hand drifts",
  say:"At half past 2 the short hand is not on the 2 — it sits <b>between</b> the 2 and the 3. That is correct! It creeps forwards all hour long. Always name the number it has <b>just passed</b>.",
  ask:{q:"The short hand is between 6 and 7 and the long hand is on the 6. What time?",o:["Half past 6","Half past 7","6 o'clock"],a:0,why:"It has passed 6 but not reached 7, so the hour is still 6."}},
 {t:"Put it all together",
  say:"Last rung. Read the long hand first to get the minutes, then the short hand for the hour.",
  doit:{w:"clock", o:{h:12,m:0}, task:"Set the clock to quarter to 3.", target:"quarter to 3"}}
]};

BUILDUP.pv = { intro:"Everything in maths this year rests on this one idea. If place value is shaky, take these six rungs slowly.", rungs:[
 {t:"Ten ones become one ten",
  say:"Count out ten single cubes. Now swap them for one long rod. Same amount, easier to handle. That single swap is the whole idea behind our number system.",
  ask:{q:"How many single cubes make one ten rod?",o:["1","10","100"],a:1,why:"Ten ones become exactly one ten."}},
 {t:"Build a number from rods and cubes",
  say:"Use the blocks. Make <b>3 rods and 4 cubes</b> and read what number appears.",
  doit:{w:"placevalue", o:{start:0}, task:"Build 3 tens and 4 ones.", target:34}},
 {t:"Where a digit sits changes what it is worth",
  say:"In <b>34</b>, the 3 is not worth three. It sits in the tens column, so it is worth <b>thirty</b>. Same digit, different place, completely different value.",
  ask:{q:"What is the 6 worth in 65?",o:["6","60","600"],a:1,why:"It sits in the tens place, so it means 6 tens."}},
 {t:"Splitting a number apart",
  say:"Breaking 34 into 30 and 4 is called <b>partitioning</b>. You will use it for adding, subtracting and comparing all year.",
  ask:{q:"Partition 58.",o:["5 + 8","50 + 8","500 + 8"],a:1,why:"5 tens is 50, plus 8 ones."}},
 {t:"Comparing: always look left first",
  say:"To decide which number is bigger, look at the <b>tens</b> digit first. Only if the tens are equal do you bother with the ones.",
  ask:{q:"Which is bigger: 49 or 52?",o:["49, because 9 is big","52, because 5 tens beats 4 tens","They are the same"],a:1,why:"The tens column decides it. The ones never get a look-in here."}},
 {t:"Ten more and ten less",
  say:"Last rung. Adding ten adds one whole rod, so only the tens digit changes. The ones digit sits perfectly still.",
  ask:{q:"What is 10 more than 46?",o:["47","56","46"],a:1,why:"4 tens becomes 5 tens. The 6 does not move."}}
]};
</script>
<script>
"use strict";
/* ================= WORLDS ================= */
var WORLDS = [
 {id:"number", n:"Number Island",   e:"🔢", s:"Maths",     c:"var(--sun)",   x:120, y:120},
 {id:"story",  n:"Story Forest",    e:"📚", s:"English",   c:"var(--grass)", x:340, y:80},
 {id:"lab",    n:"Science Lab",     e:"🔬", s:"Science",   c:"var(--sea)",   x:560, y:130},
 {id:"castle", n:"History Castle",  e:"🏰", s:"History",   c:"var(--berry)", x:190, y:290},
 {id:"world",  n:"Explorer's World",e:"🌍", s:"Geography", c:"var(--plum)",  x:420, y:300},
 {id:"code",   n:"Coding Zone",     e:"💻", s:"Computing", c:"var(--sea-d)", x:620, y:290},
 {id:"studio", n:"Creative Studio", e:"🎨", s:"Art & DT",  c:"var(--rose)",  x:60,  y:250},
 {id:"grove",  n:"Wellbeing Grove",  e:"💚", s:"PSHE & RE", c:"var(--grass-d)",x:320, y:400}
];
function conceptsIn(worldId){ return CONCEPTS.filter(function(c){ return c.w===worldId; }); }
function worldMastery(id){
  var cs=conceptsIn(id); if(!cs.length) return 0;
  var t=0; cs.forEach(function(c){ t+=mastery(c.id); }); return Math.round(t/cs.length);
}
var TERMS = [
 {k:"Autumn 1", g:"Term 1", cls:"t1"},{k:"Autumn 2", g:"Term 1", cls:"t1"},
 {k:"Spring 1", g:"Term 2", cls:"t2"},{k:"Spring 2", g:"Term 2", cls:"t2"},
 {k:"Summer 1", g:"Term 3", cls:"t3"},{k:"Summer 2", g:"Term 3", cls:"t3"},
 {k:"Throughout the Year", g:"All year", cls:"ty"}
];
function termClass(t){ for(var i=0;i<TERMS.length;i++) if(TERMS[i].k===t) return TERMS[i].cls; return "ty"; }

/* ================= ROUTER ================= */
function go(view, arg, arg2){
  clearGameTimers();
  var m=$("#main"); m.innerHTML=""; window.scrollTo(0,0);
  if(view==="home") showHome();
  else if(view==="library") showLibrary(arg);
  else if(view==="concept") showConcept(arg, arg2);
  else if(view==="roadmap") showRoadmap();
  else if(view==="boost") showBoost();
  else if(view==="revision") showRevision();
  else if(view==="sats") showSats();
  else if(view==="grownups") showGrownups();
  else if(view==="search") showSearch(arg);
  else if(view==="players") showPlayers();
  else if(view==="den") showDen();
  else if(view==="checklist") showChecklist();
  else showHome();
  m.focus();
}

/* ================= SHARED PIECES ================= */
function conceptCard(c){
  var m=mastery(c.id), g=gamesDone(c.id), b=masteryBand(m);
  var card=el("button","ccard");
  card.setAttribute("aria-label",c.t+", "+c.s+", "+b.l+", "+g+" of 10 games played, "+m+" per cent mastery");
  card.innerHTML='<span class="ic" aria-hidden="true">'+c.icon+'</span>'+
    '<span class="ct">'+esc(c.t)+'</span>'+
    '<span class="cb">'+esc(c.blurb)+'</span>'+
    '<span class="meta"><span class="pill '+termClass(c.term)+'">'+esc(c.term)+'</span><span class="pill">'+esc(c.s)+'</span></span>'+
    '<span class="bar '+b.c+'"><i style="width:'+m+'%"></i></span>'+
    '<span class="meta">'+b.e+' '+b.l+' · 🎮 '+g+'/10 games · ⭐ '+m+'%</span>';
  card.onclick=function(){ go("concept", c.id); };
  return card;
}
function statRow(){
  var done=0, mast=0;
  CONCEPTS.forEach(function(c){ if(gamesDone(c.id)>0) done++; if(mastery(c.id)>=90) mast++; });
  var badges=Object.keys(S.badges).length;
  var r=el("div","grid g2");
  [["Concepts started",done+" / "+CONCEPTS.length,"🌱"],
   ["Games played",S.totalGames+" / "+(CONCEPTS.length*10),"🎮"],
   ["Overall mastery",overall()+"%","⭐"],
   ["Badges earned",badges+" / "+BADGES.length,"🏅"]].forEach(function(s){
    var c=el("div","card"); c.style.textAlign="center";
    c.innerHTML='<div style="font-size:30px">'+s[2]+'</div><div class="dsp" style="font-size:26px">'+s[1]+'</div><div class="notice">'+s[0]+'</div>';
    r.appendChild(c);
  });
  return r;
}

/* ================= HOME: THE QUEST MAP ================= */
function showHome(){
  var m=$("#main");
  var rec=recommend();
  var hero=el("section","hero");
  var nm = firstName();
  var hi = nm ? "Welcome back, "+esc(nm)+"!" : "Welcome to your Year 2 Quest!";
  /* the same companion every other island shows, picked once on the map */
  var heroJY = window.KJA && window.KJA.journey, heroBuddy = heroJY && heroJY.buddy.chosen();
  hero.innerHTML='<div class="hero-card"><div class="eyebrow">Year 2 · Key Stage 1 · England</div>'+
    '<h1>'+hi+'</h1>'+
    '<p class="lede">Seven worlds. '+CONCEPTS.length+' concepts. '+(CONCEPTS.length*10)+' games. Learn it, see it, try it, play it — then master it.</p>'+
    (heroBuddy?'<p class="sub buddyline" style="justify-content:flex-start">'+heroJY.buddy.face(heroBuddy,28)+' <b>'+esc(heroBuddy.name)+'</b> is questing with you</p>':'')+
    '<div class="row" style="margin-top:12px">'+
    '<button class="btn btn-lg btn-grass" id="continueBtn">▶ Continue learning</button>'+
    '<button class="btn btn-lg btn-plum" data-go="den">🦕 My Collection</button>'+
    '<button class="btn btn-lg btn-sun" data-go="boost">🧠 Today\'s Brain Boost</button>'+
    '<button class="btn btn-lg" data-go="library">📚 Open the library</button></div>'+
    '<div class="callout" style="margin-top:14px"><b>Next up:</b> '+esc(rec.why)+'</div></div>';
  m.appendChild(hero);
  $("#continueBtn",hero).onclick=function(){ go("concept", rec.c.id); };

  /* the island map */
  var mapPanel=el("section","panel");
  mapPanel.innerHTML='<h2>🗺 The Quest Map</h2><p class="notice">Each world holds a set of concepts. The ring around each island fills up as you master it.</p>';
  var svgns="http://www.w3.org/2000/svg";
  var svg='<svg viewBox="0 0 720 500" role="img" aria-label="Map of the learning worlds" style="display:block;width:100%;height:auto;background:#BFE3F5">';
  svg+='<path d="M0 452 q90 -22 180 0 t180 0 t180 0 t180 0 v70 H0z" fill="#8FD0EE" opacity=".55"/>';
  svg+='<path d="M190 315 C 240 370 280 372 320 346" fill="none" stroke="#16283C" stroke-width="4" stroke-dasharray="10 12" opacity=".45"/>';
  /* dotted trail */
  svg+='<path d="M120 150 C 220 60 260 60 340 110 S 470 190 560 160" fill="none" stroke="#16283C" stroke-width="4" stroke-dasharray="10 12" opacity=".45"/>';
  svg+='<path d="M60 275 C 130 350 230 340 190 315 M190 315 C 280 370 360 350 420 325 M420 325 C 520 360 590 340 620 315" fill="none" stroke="#16283C" stroke-width="4" stroke-dasharray="10 12" opacity=".45"/>';
  WORLDS.forEach(function(w,i){
    var pm=worldMastery(w.id);
    var r=54, circ=2*Math.PI*(r+10);
    svg+='<g class="world-btn" data-world="'+w.id+'" tabindex="0" role="button" aria-label="'+w.n+', '+pm+' per cent mastered">';
    svg+='<ellipse cx="'+w.x+'" cy="'+(w.y+58)+'" rx="'+(r+16)+'" ry="14" fill="#16283C" opacity=".16"/>';
    svg+='<circle cx="'+w.x+'" cy="'+w.y+'" r="'+(r+10)+'" fill="none" stroke="#ffffff" stroke-width="9" opacity=".7"/>';
    svg+='<circle cx="'+w.x+'" cy="'+w.y+'" r="'+(r+10)+'" fill="none" stroke="var(--grass)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(circ*pm/100)+' '+circ+'" transform="rotate(-90 '+w.x+' '+w.y+')"/>';
    svg+='<circle class="wbubble" cx="'+w.x+'" cy="'+w.y+'" r="'+r+'" fill="'+w.c+'" stroke="#16283C" stroke-width="5"/>';
    svg+='<text x="'+w.x+'" y="'+(w.y+2)+'" text-anchor="middle" font-size="34">'+w.e+'</text>';
    svg+='<text x="'+w.x+'" y="'+(w.y+30)+'" text-anchor="middle" font-size="13" font-weight="bold" font-family="Verdana" fill="#16283C">'+pm+'%</text>';
    svg+='<text x="'+w.x+'" y="'+(w.y+r+26)+'" text-anchor="middle" font-size="15" font-weight="bold" font-family="Verdana" fill="#16283C">'+w.n+'</text>';
    svg+='</g>';
  });
  svg+='</svg>';
  var wrapM=el("div","mapwrap",svg);
  mapPanel.appendChild(wrapM);
  $$("[data-world]",wrapM).forEach(function(g){
    function open(){ go("library", g.getAttribute("data-world")); }
    g.addEventListener("click",open);
    g.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
  });
  m.appendChild(mapPanel);

  var lvl=el("section","panel tint-plum");
  lvl.innerHTML='<h2>🎖 Your explorer level</h2>';
  lvl.appendChild(levelBar());
  m.appendChild(lvl);

  var mineS=packStickers(), gotS=mineS.filter(function(s){ return haveSticker(s.id); });
  var col=el("section","panel tint-grass");
  col.innerHTML='<h2>'+(packOf()==="dino"?"🦕 Your Dino Den":"🚀 Your Space Station")+'</h2>'+
    '<p>'+gotS.length+' of '+mineS.length+' collected · jar: '+(S.stars||0)+'/'+STARS_PER_EGG()+' ⭐ · '+
    '<b>'+(STARS_PER_EGG()-(S.stars||0))+' more stars until the next '+(packOf()==="dino"?"egg hatches":"delivery")+'</b></p>';
  var strip=el("div","row"); strip.style.alignItems="center";
  (gotS.length?gotS:mineS).slice(0,6).forEach(function(s){
    var dd=el("div"); dd.style.width="80px";
    dd.innerHTML = haveSticker(s.id) ? stickerSVG(s,80) : '<div class="silh">'+stickerSVG(s,80)+'</div>';
    strip.appendChild(dd);
  });
  var denB=el("button","btn btn-plum","Open my collection →"); denB.onclick=function(){ go("den"); };
  col.appendChild(strip); col.appendChild(denB);
  m.appendChild(col);

  m.appendChild(statRow());

  /* worlds as cards too (accessible + mobile friendly) */
  var ws=el("section","panel");
  ws.innerHTML='<h2>Choose a world</h2>';
  var grid=el("div","grid g3");
  WORLDS.forEach(function(w){
    var cs=conceptsIn(w.id), pm=worldMastery(w.id);
    var b=el("button","ccard");
    b.innerHTML='<span class="ic">'+w.e+'</span><span class="ct">'+w.n+'</span>'+
      '<span class="cb">'+cs.length+' concepts · '+esc(w.s)+'</span>'+
      '<span class="bar"><i style="width:'+pm+'%"></i></span><span class="meta">⭐ '+pm+'% mastered</span>';
    b.onclick=function(){ go("library", w.id); };
    grid.appendChild(b);
  });
  ws.appendChild(grid);
  m.appendChild(ws);

  /* badges */
  var bp=el("section","panel");
  bp.innerHTML='<h2>🏅 Your badges</h2>';
  var bg=el("div","grid"); bg.style.gridTemplateColumns="repeat(auto-fill,minmax(120px,1fr))";
  BADGES.forEach(function(b){
    var got=!!S.badges[b.id];
    var d=el("div","badge"+(got?" got":""));
    d.innerHTML='<span class="bi">'+b.e+'</span><b>'+esc(b.n)+'</b><span>'+esc(b.d)+'</span>';
    bg.appendChild(d);
  });
  bp.appendChild(bg);
  m.appendChild(bp);
}

/* ================= PLAYERS (local profiles) ================= */
function showPlayers(){
  var m=$("#main");
  var head=el("section","panel tint-sun");
  head.innerHTML='<div class="eyebrow">Who is playing?</div><h1>👤 Choose your explorer</h1>'+
    '<p>Each explorer keeps their own progress, badges and level, so brothers, sisters or a whole class can share one device.</p>'+
    '<p class="notice">These are local profiles saved in this browser only. There is no password and no account — nothing is sent anywhere.</p>';
  m.appendChild(head);

  var list=el("section","panel");
  list.innerHTML='<h2>Explorers on this device</h2>';
  if(!PROFILES.length) list.innerHTML+='<p class="notice">No explorers yet. Create the first one below.</p>';
  var grid=el("div","grid g3");
  PROFILES.forEach(function(p){
    var saved={}; try{ saved=JSON.parse(localStorage.getItem(KEY+"."+p.id)||"{}"); }catch(e){}
    var games=saved.totalGames||0;
    var card=el("button","ccard");
    if(p.id===ACTIVE) card.style.background="#FFF6DF";

/* ================= CONCEPT PAGE ================= */
var STEPS_BASE=[["learn","📖 Learn"],["see","👀 See it"],["understand","💡 Understand it"],["try","✋ Try it"],
           ["games","🎮 Play it"],["think","🧠 Think about it"],["master","⭐ Master it"],["revise","🔄 Revise it"]];
function stepsFor(c){
  var s = STEPS_BASE.slice();
  if(BUILDUP[c.id]) s.splice(1,0,["buildup","🪜 Build it up"]);  /* right after Learn */
  return s;
}
function showConcept(id, step){
  clearGameTimers();
  var c=byId(id); if(!c){ go("home"); return; }
  step = step || "learn";
  cstate(id).seen=true; S.visited[id]=today(); save();
  var m=$("#main"); m.innerHTML="";
  var mm=mastery(id), band=masteryBand(mm);

  var head=el("section","panel tint-sun");
  head.innerHTML='<div class="row" style="justify-content:space-between"><div>'+
    '<div class="eyebrow">'+esc(c.s)+' · '+esc(c.term)+'</div>'+
    '<h1 style="margin-bottom:2px">'+c.icon+' '+esc(c.t)+'</h1>'+
    '<p style="max-width:60ch">'+esc(c.blurb)+'</p></div></div>'+
    '<p class="notice"><b>Learning objective:</b> '+esc(c.obj)+'</p>'+
    '<div class="bar '+band.c+'"><i style="width:'+mm+'%"></i></div>'+
    '<div class="meta">'+band.e+' '+band.l+' · 🎮 '+gamesDone(id)+'/10 games · ⭐ '+mm+'% mastery</div>';
  m.appendChild(head);

  var STEPS=stepsFor(c);
  var strip=el("nav","stepstrip"); strip.setAttribute("aria-label","Learning steps");
  STEPS.forEach(function(s){
    var b=el("button","step"+(cstate(id).steps[s[0]]?" done":""), s[1]);
    if(s[0]===step) b.setAttribute("aria-current","true");
    b.onclick=function(){ showConcept(id, s[0]); };
    strip.appendChild(b);
  });
  m.appendChild(strip);

  var body=el("section","panel");
  m.appendChild(body);
  markStep(id, step);

  if(step==="learn") stepLearn(body,c);
  else if(step==="buildup") stepBuildup(body,c);
  else if(step==="see") stepSee(body,c);
  else if(step==="understand") stepUnderstand(body,c);
  else if(step==="try") stepTry(body,c);
  else if(step==="games") stepGames(body,c);
  else if(step==="think") stepThink(body,c);
  else if(step==="master") stepMaster(body,c);
  else stepRevise(body,c);

  /* next / previous step */
  var idx=0; STEPS.forEach(function(s,i){ if(s[0]===step) idx=i; });
  var nav=el("div","row"); nav.style.marginTop="18px";
  if(idx>0){ var p=el("button","btn btn-ghost","← "+STEPS[idx-1][1]); p.onclick=function(){ showConcept(id,STEPS[idx-1][0]); }; nav.appendChild(p); }
  if(idx<STEPS.length-1){ var n=el("button","btn btn-grass",STEPS[idx+1][1]+" →"); n.onclick=function(){ showConcept(id,STEPS[idx+1][0]); }; nav.appendChild(n); }
  var lib=el("button","btn btn-ghost btn-sm","📚 Back to the library"); lib.onclick=function(){ go("library", c.w); };
  nav.appendChild(lib);
  body.appendChild(nav);
}

/* ---------- BUILD IT UP: one small rung at a time ---------- */
function stepBuildup(b,c){
  var B=BUILDUP[c.id];
  if(!B){ b.innerHTML='<h2>🪜 Build it up</h2><p>This concept does not need a build-up ladder.</p>'; return; }
  var st=cstate(c.id); if(st.rung==null) st.rung=0;
  b.innerHTML='<h2>🪜 Build it up</h2><p>'+esc(B.intro)+'</p>'+
    '<p class="notice">Rung <b>'+Math.min(st.rung+1,B.rungs.length)+'</b> of '+B.rungs.length+'</p>'+
    '<div class="bar b-plum"><i style="width:'+Math.round(st.rung/B.rungs.length*100)+'%"></i></div><div id="buArea"></div>';
  var area=$("#buArea",b);

  /* ladder overview — completed rungs stay open to reread */
  function draw(){
    area.innerHTML="";
    B.rungs.forEach(function(r,i){
      if(i>st.rung) return;                       /* locked */
      var open = (i===st.rung);
      var card=el("div","card"); card.style.marginTop="14px";
      if(!open) card.style.opacity=".85";
      card.innerHTML='<div class="row" style="justify-content:space-between">'+
        '<b class="dsp" style="font-size:20px">'+(i+1)+'. '+esc(r.t)+'</b>'+
        (i<st.rung?'<span class="pill" style="background:#CFEBD5">✓ done</span>':'<span class="pill t3">you are here</span>')+'</div>'+
        '<p>'+r.say+'</p><div class="rungBody"></div>';
      var host=$(".rungBody",card);
      if(open) buildRung(r,host,i);
      area.appendChild(card);
    });
    if(st.rung>=B.rungs.length){
      var doneCard=el("div","panel tint-grass"); doneCard.style.marginTop="16px";
      doneCard.innerHTML='<h3>🎉 Ladder complete'+(firstName()?", "+esc(firstName()):"")+'!</h3>'+
        '<p>You built this up from the very beginning. Now the games will make far more sense.</p>';
      var r2=el("div","row");
      var g1=el("button","btn btn-grass","🎮 Play the games"); g1.onclick=function(){ showConcept(c.id,"games"); };
      var g2=el("button","btn btn-ghost","🪜 Climb it again"); g2.onclick=function(){ st.rung=0; save(); showConcept(c.id,"buildup"); };
      r2.appendChild(g1); r2.appendChild(g2); doneCard.appendChild(r2);
      area.appendChild(doneCard);
      play("great");
    }
  }
  function advance(){
    st.rung=Math.min(st.rung+1,B.rungs.length); save();
    markStep(c.id,"buildup");
    showConcept(c.id,"buildup");
  }
  function buildRung(r,host,i){
    if(r.ask){
      var sq=shuffleQ(r.ask.o,r.ask.a);
      host.innerHTML='<p class="qtext" style="font-size:20px">'+esc(r.ask.q)+'</p><div class="opts"></div><div class="rf"></div>';
      var opts=$(".opts",host);
      sq.o.forEach(function(t,k){
        var btn=el("button","opt",esc(t)); btn.style.fontSize="17px";
        btn.onclick=function(){
          $$(".opt",opts).forEach(function(x,j){ x.disabled=true; if(j===sq.a) x.classList.add("right"); });
          var ok=k===sq.a; if(!ok) btn.classList.add("wrong");
          play(ok?"right":"wrong");
          var f=$(".rf",host);
          f.innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?praise():nudge())+'<div class="sub">'+esc(r.ask.why)+'</div></div>';
          if(ok) spawnStar(f);
          var nx=el("button","btn btn-grass",ok?"Next rung →":"Got it — next rung →");
          nx.style.marginTop="10px"; nx.onclick=advance;
          f.appendChild(nx);
        };
        opts.appendChild(btn);
      });
    } else if(r.doit){
      host.innerHTML='<div class="callout"><b>Your turn:</b> '+esc(r.doit.task)+'</div>';
      var wh=el("div"); host.appendChild(wh);
      var cur=null;
      WIDGETS[r.doit.w](wh, r.doit.o||{}, function(v){ cur=v; });
      var row=el("div","row"), out=el("div");
      var chk=el("button","btn btn-grass","Check it");
      chk.onclick=function(){
        var ok = String(cur).toLowerCase()===String(r.doit.target).toLowerCase();
        play(ok?"right":"wrong");
        out.innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?praise()+" Exactly right.":nudge()+" Keep adjusting — you are aiming for "+esc(String(r.doit.target))+".")+'</div>';
        if(ok) spawnStar(out);
        if(ok){ var nx=el("button","btn btn-grass","Next rung →"); nx.style.marginTop="10px"; nx.onclick=advance; $(".fb",out).appendChild(nx); }
      };
      var skip=el("button","btn btn-ghost btn-sm","I've got this — skip on");
      skip.onclick=advance;
      row.appendChild(chk); row.appendChild(skip);
      host.appendChild(row); host.appendChild(out);
    }
  }
  draw();
}

  c.learn.forEach(function(p){ h+='<p>'+p+'</p>'; });

}

function stepTry(b,c){
  b.innerHTML='<h2>✋ Try it</h2>';
  var t=c.tryit;
  if(t.w){
    b.innerHTML+='<div class="callout"><b>Your task:</b> '+esc(t.task)+'</div>';
    var host=el("div"); b.appendChild(host);
    var cur=null;
    WIDGETS[t.w](host, t.o||{}, function(v){ cur=v; });
    var row=el("div","row");
    var chk=el("button","btn btn-grass","Check my answer");
    var out=el("div"); 
    chk.onclick=function(){
      if(t.target==null){ out.innerHTML='<div class="fb ok">Nicely explored! There is no single right answer here — well done for experimenting.</div>'; markStep(c.id,"try"); return; }
      var ok = String(cur).toLowerCase()===String(t.target).toLowerCase();
      out.innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?praise()+" That is exactly right.":nudge()+" Keep adjusting — you are aiming for: "+esc(String(t.target))+".")+'</div>';
      if(ok){ markStep(c.id,"try"); toast("Task complete! ✋"); spawnStar(out); }
    };

    TT.o.forEach(function(o,i){

        $$("#tryOpts .opt",b).forEach(function(x,j){ x.disabled=true; if(j===TT.a) x.classList.add("right"); });
        var ok=i===TT.a; if(!ok) btn.classList.add("wrong"); play(ok?"right":"wrong");
        $("#tryFb",b).innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?praise():nudge()+" Look at the highlighted answer.")+'</div>';
        if(ok){ markStep(c.id,"try"); spawnStar($("#tryFb",b)); }
      };
      $("#tryOpts",b).appendChild(btn);
    });
  }
}
/* Ten games per concept, and a different three suggested every morning.

   A child asked for "a new set of games to play for each concept" and for a
   recap if they want to repeat one. The ten games were always here; what was
   missing was a reason to come back tomorrow rather than work down the same
   list in the same order. KJA.journey's day number picks today's three, which
   is the same all day, different tomorrow, and walks the whole set before it
   repeats — no server, nothing random to remember. All ten stay open
   underneath, and one already played says so and plays again gladly. */
function stepGames(b,c){
  var done=gamesDone(c.id);
  var JY = window.KJA && window.KJA.journey;
  var idx = c.games.map(function(g,i){ return i; });
  var today = JY ? JY.daily.rotate(idx, 3, c.id.length + c.id.charCodeAt(0)) : idx.slice(0,3);
  b.innerHTML='<h2>🎮 Play it — ten different games</h2>'+
   '<p>Each game tests this concept in a different way, and they get harder as you go. You have played <b>'+done+' of 10</b>.</p>';

  if(today.length){
    var box=el("section","todaygames");
    box.innerHTML='<h3>⭐ Today\u2019s three</h3>'+
      '<p class="notice">Picked for today. Come back tomorrow for three more \u2014 or play any of the ten below, as often as you like.</p>';
    var row=el("div","gamerow");
    today.forEach(function(i){
      var meta=GAME_META[i], sc=cstate(c.id).games[i];
      var t=el("button","gpick"+(sc!=null?" done":""));
      t.innerHTML='<span class="gt">'+meta.n+'</span>'+
        '<span class="gd">'+esc(c.games[i].i||meta.d)+'</span>'+
        '<span class="lvl">'+(sc!=null?"Played \u2014 best "+sc+"% \u00b7 play again":meta.lvl)+'</span>';
      t.onclick=function(){ openGame(c,i); };
      row.appendChild(t);
    });
    box.appendChild(row);
    b.appendChild(box);
  }

  var all=el("h3",null,"All ten games");
  b.appendChild(all);
  var grid=el("div","gamegrid");
  c.games.forEach(function(g,i){
    var meta=GAME_META[i], sc=cstate(c.id).games[i];
    var t=el("button","gtile"+(sc!=null?" done":"")+(today.indexOf(i)>=0?" istoday":""));
    t.innerHTML='<span class="gn">GAME '+(i+1)+'</span><span class="gt">'+meta.n+'</span>'+
      '<span class="gd">'+esc(g.i||meta.d)+'</span><span class="lvl">'+meta.lvl+'</span>'+
      (sc!=null?'<span class="tick">'+(sc>=90?"🏆":sc>=70?"⭐":"✅")+'</span><span class="gd">Best: '+sc+'%</span>':'');
    t.onclick=function(){ openGame(c,i); };
    grid.appendChild(t);
  });
  b.appendChild(grid);
}
function stepThink(b,c){
  var sqt=shuffleQ(c.think.o, c.think.a), TH={q:c.think.q,o:sqt.o,a:sqt.a,why:c.think.why};
  b.innerHTML='<h2>🧠 Think about it</h2><div class="callout">Say your thinking out loud before you choose. Reasoning is about <b>how</b> you know, not just what the answer is.</div>'+
    '<p class="qtext">'+esc(TH.q)+'</p><div class="opts" id="thOpts"></div><div id="thFb"></div>';
  TH.o.forEach(function(o,i){
    var btn=el("button","opt",esc(o)); btn.style.fontSize="17px";
    btn.onclick=function(){
      $$("#thOpts .opt",b).forEach(function(x,j){ x.disabled=true; if(j===TH.a) x.classList.add("right"); });
      var ok=i===TH.a; if(!ok) btn.classList.add("wrong");
      play(ok?"right":"wrong");
      $("#thFb",b).innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?praise():nudge())+'<div class="sub">'+esc(TH.why)+'</div></div>';
      if(ok){ markStep(c.id,"think"); spawnStar($("#thFb",b)); }
    };
    $("#thOpts",b).appendChild(btn);
  });
}
function stepMaster(b,c){
  var mm=mastery(c.id), band=masteryBand(mm), done=gamesDone(c.id);
  b.innerHTML='<h2>⭐ Master it</h2>'+
   '<div class="callout">Mastery is worked out from your <b>best score in each game</b>. Accuracy and understanding matter — never speed.</div>'+
   '<div class="grid g2"><div class="card" style="text-align:center"><div style="font-size:44px">'+band.e+'</div>'+
   '<div class="dsp" style="font-size:34px">'+mm+'%</div><div class="notice">'+band.l+'</div>'+
   '<div class="bar '+band.c+'"><i style="width:'+mm+'%"></i></div></div>'+
   '<div class="card"><h3>What the levels mean</h3><ul style="margin:0;padding-left:20px">'+
   '<li>🌱 0–39% Learning</li><li>🌿 40–69% Practising</li><li>⭐ 70–89% Confident</li><li>🏆 90–100% Mastered</li></ul>'+
   '<p class="notice" style="margin-top:8px">You have played '+done+' of 10 games. Playing the ones you have not tried yet lifts your mastery fastest.</p></div></div>';

/* ================= GENERIC QUIZ RUNNER ================= */
/* A round that will not move past a question until it has been answered
   correctly, and then moves on by itself.

   Previously one tap ended the question either way: a wrong answer revealed
   the right one and offered Next, so a child could walk the whole session
   without ever working anything out. Now a wrong tap removes that option and
   leaves the question up; from the second miss one of the remaining wrong
   options is taken away each time, and when only the answer and one wrong one
   are left it shows them, so nobody is stuck in front of a wall and nobody is
   carried past something they did not understand.

   The score is first-time-right (`right`), which is what stops "keep trying"
   from also meaning "full marks for tapping everything". Getting it right
   advances on its own after a beat, with the wait drawn as a filling bar, and
   "Let me look" stops the clock for anyone who wants to sit with the answer.

   Anything celebratory raised during the round — an egg reaching its tenth
   star, most of all — is held by KJA.journey and let out when the round ends,
   so a surprise never lands on top of a question. */
function quizRunner(host, qs, done, opt){
  opt=opt||{};
  var i=0, right=0, tries=0, firstTry=true, autoT=null;
  var JY = window.KJA && window.KJA.journey;
  var d=dots(qs.length);
  var body=el("div"); host.appendChild(body); host.appendChild(d);
  var NUDGES=["Nearly — have another look.","Not that one. Try again!",
              "Good try. One of the others!","Hmm, not quite — go on, again."];
  if(JY) JY.hold.open();
  function finish(){
    clearTimeout(autoT);
    if(JY) JY.hold.release(2600);
    done(pctOf(right,qs.length));
  }
  function draw(){
    clearTimeout(autoT); autoT=null;
    if(i>=qs.length){ finish(); return; }
    tries=0; firstTry=true;
    var q0=qs[i], sq=shuffleQ(q0.o,q0.a), q={q:q0.q,o:sq.o,a:sq.a,why:q0.why,tag:q0.tag};
    body.innerHTML='<div class="eyebrow">'+esc(opt.title||"Question")+' '+(i+1)+' of '+qs.length+(q.tag?' · '+esc(q.tag):'')+'</div>'+
      '<p class="qtext">'+esc(q.q)+'</p><div class="opts" id="qrOpts"></div><div id="qrFb"></div>';
    q.o.forEach(function(t,k){
      var btn=el("button","opt",esc(t)); if(String(t).length>18) btn.style.fontSize="16px";
      btn.onclick=function(){ tap(btn,k,q); };
      $("#qrOpts",body).appendChild(btn);
    });
  }
  function tap(btn,k,q){
    var ok = k===q.a;
    if(!ok){
      tries++; firstTry=false;
      btn.disabled=true; btn.classList.add("wrong");
      play("wrong");
      var box=$("#qrFb",body);
      box.innerHTML='<div class="fb no">'+NUDGES[Math.min(tries-1,NUDGES.length-1)]+'</div>';
      announce("Not quite");
      if(tries>=2){
        var all=$$("#qrOpts .opt",body);
        var spare=all.filter(function(x,j){ return !x.disabled && j!==q.a; });
        if(spare.length>1){
          /* narrow the choice by one, so help arrives a step at a time */
          var drop=spare[Math.floor(Math.random()*spare.length)];
          drop.disabled=true; drop.classList.add("gone");
        } else {
          $$("#qrOpts .opt",body).forEach(function(x,j){ if(j===q.a) x.classList.add("showme"); });
          box.innerHTML='<div class="fb no">Here it is — tap the glowing one.'+
            (q.why?'<div class="sub">'+esc(q.why)+'</div>':'')+'</div>';
        }
      }
      return;                                   /* the question stays up */
    }
    /* right */
    $$("#qrOpts .opt",body).forEach(function(x,j){
      x.disabled=true; x.classList.remove("showme");
      if(j===q.a) x.classList.add("right");
    });
    if(firstTry) right++;
    setDot(d,i,firstTry);
    var f=fb($("#qrFb",body), true, q.why||"");
    /* the star goes into the jar that follows them round the whole adventure */
    if(JY && firstTry) JY.stars.add(1, $$("#qrOpts .opt.right",body)[0] || f);
    var last = i===qs.length-1;
    var waitMs = (q.why?2100:1400) + (last?600:0);
    var nx=el("button","btn btn-sm btn-sea waitbtn", (last?"Finish →":"Next →")+
      '<i class="tick" style="--d:'+waitMs+'ms"></i>');
    nx.style.marginTop="10px";
    nx.onclick=function(){ clearTimeout(autoT); autoT=null; i++; draw(); };
    f.appendChild(nx);
    var stay=el("button","btn btn-sm btn-ghost","⏸ Let me look");
    stay.style.marginTop="10px"; stay.style.marginLeft="8px";
    stay.onclick=function(){
      clearTimeout(autoT); autoT=null;
      nx.classList.remove("waitbtn");
      var t=nx.querySelector(".tick"); if(t) t.remove();
      stay.remove();
    };
    f.appendChild(stay);
    autoT=setTimeout(function(){ autoT=null; i++; draw(); }, waitMs);
  }
  draw();
}

/* ---------- question pools built from the curriculum ---------- */
function poolFrom(filter){
  var out=[];
  CONCEPTS.forEach(function(c){
    if(filter && !filter(c)) return;
    (c.rev||[]).forEach(function(q){ out.push({q:q.q,o:q.o,a:q.a,why:"",tag:c.t,cid:c.id}); });
    c.games.forEach(function(g){
      if(g.t==="find"||g.t==="reason"||g.t==="fix"){
        (g.r||[]).forEach(function(r){ if(r.o) out.push({q:(r.wrong?"Spot the mistake: “"+r.wrong+"” — "+r.q:r.q),o:r.o,a:r.a,why:r.why||"",tag:c.t,cid:c.id}); });
      }
      if(g.t==="master"){ (g.r||[]).forEach(function(r){ if(r.o) out.push({q:r.q,o:r.o,a:r.a,why:r.why||"",tag:c.t,cid:c.id}); }); }
    });
  });
  return out;
}
function arithmeticQs(n){
  var out=[];
  for(var i=0;i<n;i++){
    var t=Math.floor(Math.random()*6), q, a;
    if(t===0){ var x=2+Math.floor(Math.random()*40), y=2+Math.floor(Math.random()*40); q=x+" + "+y+" = ?"; a=x+y; }
    else if(t===1){ var x2=20+Math.floor(Math.random()*60), y2=1+Math.floor(Math.random()*19); q=x2+" − "+y2+" = ?"; a=x2-y2; }
    else if(t===2){ var f=[2,5,10][Math.floor(Math.random()*3)], g2=1+Math.floor(Math.random()*10); q=f+" × "+g2+" = ?"; a=f*g2; }
    else if(t===3){ var f2=[2,5,10][Math.floor(Math.random()*3)], g3=1+Math.floor(Math.random()*10); q=(f2*g3)+" ÷ "+f2+" = ?"; a=g3; }
    else if(t===4){ var h=2*(2+Math.floor(Math.random()*20)); q="Half of "+h+" = ?"; a=h/2; }
    else { var b=10+Math.floor(Math.random()*80); q="10 more than "+b+" = ?"; a=b+10; }
    var opts=[a, a+1, a-1, a+10].map(String);
    if(a-1<0) opts[2]=String(a+2);
    var uniq=[]; opts.forEach(function(o){ if(uniq.indexOf(o)<0) uniq.push(o); });
    var sh=shuffle(uniq);
    out.push({q:q,o:sh,a:sh.indexOf(String(a)),why:"",tag:"Arithmetic"});
  }
  return out;
}

  var best=0, any=false;
  item.c.forEach(function(id){
    var cc=byId(id); if(!cc) return;
    any=true;
    var m=mastery(id); if(m>best) best=m;
  });
  if(!any) return {l:"Off screen", e:"📝", pct:null};
  if(best>=90) return {l:"Mastered", e:"🏆", pct:best};
  if(best>=70) return {l:"Confident", e:"⭐", pct:best};
  if(best>=40) return {l:"Practising", e:"🌿", pct:best};
  if(best>0)   return {l:"Started", e:"🌱", pct:best};
  return {l:"Not started", e:"⬜", pct:0};
}

         '<circle cx="66" cy="25" r="2.6" fill="#16283C" stroke="none"/>';

    s += '<rect x="38" y="70" width="11" height="20" rx="5" fill="'+c2+'"/>'+
         '<rect x="70" y="70" width="11" height="20" rx="5" fill="'+c2+'"/>'+

function spaceArt(type, c1, c2){

    s+='<polygon points="60,6 78,44 78,74 42,74 42,44" fill="'+c1+'"/>'+

    s+='<ellipse cx="60" cy="56" rx="26" ry="30" fill="'+c1+'"/>'+
       '<ellipse cx="50" cy="48" rx="7" ry="10" fill="#fff"/><ellipse cx="72" cy="48" rx="7" ry="10" fill="#fff"/>'+
       '<circle cx="50" cy="50" r="3.4" fill="#16283C" stroke="none"/><circle cx="72" cy="50" r="3.4" fill="#16283C" stroke="none"/>'+
       '<path d="M46 14 q6 12 8 16 M74 14 q-6 12 -8 16" fill="none"/>'+

}
function stickerSVG(st, size){
  var art = st.pack==="space" ? spaceArt(st.type, st.c1, st.c2) : dinoArt(st.type, st.c1, st.c2);
  return '<svg viewBox="0 0 120 100" width="'+(size||110)+'" role="img" aria-label="'+esc(st.n)+' sticker">'+art+'</svg>';
}

/* ---------- the collections ---------- */
var STICKERS = [
 /* ---- DINOSAURS ---- */
 {id:"d1", pack:"dino", n:"Diplodocus",     type:"sauropod", c1:"#3D9A4E", c2:"#2C7239", r:1, f:"Its tail was longer than a bus, and it could crack it like a whip."},
 {id:"d2", pack:"dino", n:"Brachiosaurus",  type:"sauropod", c1:"#4FB3E8", c2:"#1E6FA8", r:1, f:"So tall it could have peered into a first-floor window."},
 {id:"d3", pack:"dino", n:"Brontosaurus",   type:"sauropod", c1:"#E86A9A", c2:"#C24E7C", r:2, f:"Its name means thunder lizard, because of the noise it made walking."},
 {id:"d4", pack:"dino", n:"Tyrannosaurus",  type:"theropod", c1:"#E4572E", c2:"#B93B18", r:3, f:"Its bite was stronger than any land animal alive today."},
 {id:"d5", pack:"dino", n:"Velociraptor",   type:"theropod", c1:"#FFC22E", c2:"#E09A00", r:2, f:"Turkey sized, covered in feathers, and very fast."},
 {id:"d6", pack:"dino", n:"Allosaurus",     type:"theropod", c1:"#7A4EAB", c2:"#5C3684", r:2, f:"Hunted long before T. rex existed — they never met."},
 {id:"d7", pack:"dino", n:"Spinosaurus",    type:"theropod", c1:"#1E6FA8", c2:"#14507A", r:3, f:"The only dinosaur we know that really did swim and catch fish."},
 {id:"d8", pack:"dino", n:"Stegosaurus",    type:"stego",    c1:"#3D9A4E", c2:"#FFC22E", r:1, f:"Its brain was about the size of a plum, but its plates were huge."},
 {id:"d9", pack:"dino", n:"Kentrosaurus",   type:"stego",    c1:"#C79A6B", c2:"#8A5A2B", r:2, f:"Spikes down its back AND on its shoulders. Nobody argued with it."},
 {id:"d10",pack:"dino", n:"Triceratops",    type:"trike",    c1:"#E4572E", c2:"#FFC22E", r:1, f:"Three horns and a bony frill the size of a door."},
 {id:"d11",pack:"dino", n:"Styracosaurus",  type:"trike",    c1:"#7A4EAB", c2:"#E86A9A", r:2, f:"Its frill had a crown of long spikes all the way round."},
 {id:"d12",pack:"dino", n:"Torosaurus",     type:"trike",    c1:"#2C7239", c2:"#66C177", r:3, f:"Had one of the largest skulls of any animal that ever walked."},
 {id:"d13",pack:"dino", n:"Pteranodon",     type:"ptero",    c1:"#4FB3E8", c2:"#DCEEF9", r:1, f:"Not a dinosaur at all — a flying reptile with a 6 metre wingspan."},
 {id:"d14",pack:"dino", n:"Quetzalcoatlus", type:"ptero",    c1:"#E09A00", c2:"#FFE7B8", r:3, f:"As tall as a giraffe when standing, and it could still fly."},
 {id:"d15",pack:"dino", n:"Dimorphodon",    type:"ptero",    c1:"#E86A9A", c2:"#FDEDE8", r:2, f:"Two different kinds of teeth in one mouth — that is what its name means."},
 {id:"d16",pack:"dino", n:"Ankylosaurus",   type:"anky",     c1:"#8A5A2B", c2:"#C79A6B", r:1, f:"A living tank with a club on its tail heavy enough to break bone."},
 {id:"d17",pack:"dino", n:"Euoplocephalus", type:"anky",     c1:"#3D9A4E", c2:"#2C7239", r:2, f:"Even its eyelids had armour plating."},
 {id:"d18",pack:"dino", n:"Gastonia",       type:"anky",     c1:"#7A4EAB", c2:"#FFC22E", r:3, f:"Covered in spikes so long it looked like a walking hedge."},
 /* ---- SPACE (a second pack, for a child who likes different things) ---- */
 {id:"s1", pack:"space", n:"Red Rocket",    type:"rocket", c1:"#E4572E", c2:"#FFC22E", r:1, f:"A rocket must travel 40,000 km an hour to escape Earth."},
 {id:"s2", pack:"space", n:"Blue Rocket",   type:"rocket", c1:"#1E6FA8", c2:"#4FB3E8", r:2, f:"The Moon is about 384,000 km away — three days by rocket."},
 {id:"s3", pack:"space", n:"Ringworld",     type:"planet", c1:"#E09A00", c2:"#FFE7B8", r:1, f:"Saturn's rings are made of billions of pieces of ice."},
 {id:"s4", pack:"space", n:"Ice Planet",    type:"planet", c1:"#4FB3E8", c2:"#DCEEF9", r:2, f:"Neptune has winds faster than anything on Earth."},

 {id:"s6", pack:"space", n:"Star Voyager",  type:"alien",  c1:"#7A4EAB", c2:"#E86A9A", r:3, f:"The nearest star beyond the Sun is over 4 light years away."}
];
var PACKS = [
 {id:"dino",  n:"Dinosaurs", e:"🦕", d:"18 dinosaurs to hatch"},
 {id:"space", n:"Space",     e:"🚀", d:"6 space stickers to collect"}
];
function packOf(){ return S.pack || "dino"; }
function packStickers(){ return STICKERS.filter(function(s){ return s.pack===packOf(); }); }
function haveSticker(id){ return !!(S.stickers && S.stickers[id]); }
function STARS_PER_EGG(){
  /* the first eggs are quick; later ones cost more, so the collection lasts
     the whole year instead of running out in a fortnight */
  var got = packStickers().filter(function(s){ return haveSticker(s.id); }).length;
  return 10 + Math.floor(got/3)*4;      /* 10, 10, 10, 14, 14, 14, 18 … */
}

/* ---------- star and points economy ---------- */
function addStarPoints(n){ S.starPoints = (S.starPoints||0) + n; save(); }
function pointsPopup(x, y, text, cls){
  var p = el("div","ptspop"+(cls?" "+cls:""), text);
  p.style.left = x+"px"; p.style.top = y+"px";
  document.body.appendChild(p);
  setTimeout(function(){ p.remove(); }, 1400);
}

/* ---------- the floating jar ---------- */
function jarEl(){ return $("#starJar"); }
function mountJar(){
  if(jarEl() || !ACTIVE) return;
  if(S.jarOn === false) return;
  var j = el("div","jar"); j.id="starJar"; j.setAttribute("data-drop","jar");
  j.setAttribute("aria-label","Star jar. Drag your stars in here.");
  document.body.appendChild(j);
  var pos = S.jarPos || {};
  j.style.left = (pos.x!=null ? pos.x : Math.max(8, window.innerWidth-150)) + "px";
  j.style.top  = (pos.y!=null ? pos.y : Math.max(70, window.innerHeight-230)) + "px";
  drawJar();
  /* drag the jar itself around the screen */
  var dragging=false, ox=0, oy=0, moved=false;
  j.addEventListener("pointerdown", function(ev){
    if(ev.target.closest(".jarBtn")) return;
    dragging=true; moved=false;
    var r=j.getBoundingClientRect(); ox=ev.clientX-r.left; oy=ev.clientY-r.top;
    try{ j.setPointerCapture(ev.pointerId); }catch(e){}
  });
  j.addEventListener("pointermove", function(ev){
    if(!dragging) return;
    moved=true;
    var x=Math.max(2, Math.min(window.innerWidth-120, ev.clientX-ox));
    var y=Math.max(60, Math.min(window.innerHeight-140, ev.clientY-oy));
    j.style.left=x+"px"; j.style.top=y+"px";
  });
  function endDrag(){
    if(!dragging) return; dragging=false;
    if(moved){ S.jarPos={x:parseInt(j.style.left,10), y:parseInt(j.style.top,10)}; save(); }
  }
  j.addEventListener("pointerup", endDrag);
  j.addEventListener("pointercancel", endDrag);
}
function unmountJar(){ var j=jarEl(); if(j) j.remove(); }
function drawJar(){
  var j=jarEl(); if(!j) return;
  var n = S.stars||0, need = STARS_PER_EGG();
  var fill = Math.min(1, n/need);
  var stars="";
  for(var i=0;i<Math.min(n,10);i++){
    var col = 8 + (i%4)*17, row = 74 - Math.floor(i/4)*17;
    stars += '<text x="'+col+'" y="'+row+'" font-size="17">⭐</text>';
  }
  j.innerHTML =
   '<button class="jarBtn" id="jarHide" aria-label="Hide the star jar" title="Hide the jar">×</button>'+
   '<svg viewBox="0 0 80 100" width="86" aria-hidden="true">'+
   '<rect x="16" y="4" width="48" height="10" rx="4" fill="#C79A6B" stroke="#16283C" stroke-width="4"/>'+
   '<path d="M12 18 h56 v66 a10 10 0 0 1 -10 10 h-36 a10 10 0 0 1 -10 -10 z" fill="#EAF6FD" stroke="#16283C" stroke-width="4"/>'+
   '<clipPath id="jarClip"><path d="M14 20 h52 v64 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 z"/></clipPath>'+
   '<g clip-path="url(#jarClip)">'+
   '<rect x="14" y="'+(92-64*fill)+'" width="52" height="'+(64*fill)+'" fill="#FFE7B8"/>'+
   '<g transform="translate(6,10)">'+stars+'</g></g>'+
   '<path d="M12 18 h56" stroke="#16283C" stroke-width="4"/>'+
   '</svg>'+
   '<div class="jarCount">'+n+' / '+need+' ⭐</div>';
  $("#jarHide",j).onclick=function(ev){
    ev.stopPropagation();
    S.jarOn=false; save(); unmountJar();
    toast("Jar hidden. Turn it back on in the Grown-ups page.", 3800);
  };
  j.setAttribute("aria-label","Star jar, "+n+" of "+need+" stars collected. Drag stars in here.");
}
function jarBounce(){
  var j=jarEl(); if(!j) return;
  j.classList.remove("bounce"); void j.offsetWidth; j.classList.add("bounce");
}

/* ---------- a star pops out of a correct answer ---------- */
function spawnStar(nearEl){
  if(!ACTIVE) return;
  /* never let stars cover the page: past three on screen, the oldest flies home */
  var live = $$(".flystar").filter(function(x){ return !x.dataset.done; });
  while(live.length >= 3){ var old = live.shift(); old.click(); }
  var r = nearEl && nearEl.getBoundingClientRect ? nearEl.getBoundingClientRect() : {left:window.innerWidth/2, top:window.innerHeight/2, width:0, height:0};
  var st = el("button","flystar","⭐");
  st.setAttribute("aria-label","You earned a star. Drag it into the jar, or tap it to send it in.");
  st.style.left = Math.max(10, Math.min(window.innerWidth-70, r.left + (r.width||0)/2 - 24)) + "px";
  st.style.top  = Math.max(70, r.top - 6) + "px";
  document.body.appendChild(st);
  play("star");
  function collect(bonus){
    if(st.dataset.done) return;
    st.dataset.done="1";
    var j=jarEl();
    if(j){
      var jr=j.getBoundingClientRect(), sr=st.getBoundingClientRect();
      st.style.transition="transform .45s cubic-bezier(.4,0,.2,1), opacity .45s";
      st.style.transform="translate("+(jr.left+30-sr.left)+"px,"+(jr.top+40-sr.top)+"px) scale(.4)";
      st.style.opacity="0";
    }
    setTimeout(function(){ st.remove(); }, 480);
    var pts = 10 + (bonus?5:0);
    addStarPoints(pts);
    S.stars = (S.stars||0) + 1;
    save();
    pointsPopup(window.innerWidth/2-40, Math.max(90, r.top-40), "+"+pts+" points"+(bonus?" 🎯":""));
    play("star");
    jarBounce();
    if(S.stars >= STARS_PER_EGG()){ S.stars = 0; save(); setTimeout(hatchEgg, 600); }
    drawJar();
  }
  /* drag into the jar for a bonus */
  makeDrag(st, {onDrop:function(target){ if(target && target.getAttribute("data-drop")==="jar") collect(true); }});
  /* or just tap it — same reward, one point less, so nobody is punished */
  st.addEventListener("click", function(){ collect(false); });
  /* never lose a star: it flies home by itself after a while */
  setTimeout(function(){ if(document.body.contains(st)) collect(false); }, 9000);
}

/* ---------- hatching ---------- */
function pickNewSticker(){
  var mine = packStickers().filter(function(s){ return !haveSticker(s.id); });
  if(!mine.length) return null;
  /* commoner ones first, so the rare ones stay exciting */
  var weighted=[];
  mine.forEach(function(s){ var w = s.r===1?5 : s.r===2?3 : 1; for(var i=0;i<w;i++) weighted.push(s); });
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function hatchEgg(){
  var st = pickNewSticker();
  var box = el("div","modal"); box.id="hatchModal";
  var inner = el("div","box"); inner.style.textAlign="center";
  box.appendChild(inner);
  document.body.appendChild(box);
  var isDino = packOf()==="dino";
  inner.innerHTML = '<div class="eyebrow">Your jar is full!</div>'+
    '<h2>'+(isDino?"🥚 Something is hatching…":"📦 A package has arrived…")+'</h2>'+
    '<div id="eggBox" style="font-size:86px;line-height:1.1" class="wobble">'+(isDino?"🥚":"📦")+'</div>'+
    '<p class="notice">Tap the '+(isDino?"egg":"package")+' to open it!</p>';
  play("badge");
  $("#eggBox",inner).onclick=function(){ reveal(); };
  setTimeout(function(){ if($("#eggBox",inner)) reveal(); }, 4000);
  function reveal(){
    var nm = firstName();
    if(!st){
      addStarPoints(50);
      inner.innerHTML='<h2>🏆 Collection complete!</h2>'+
        '<p>You have every sticker in this pack'+(nm?", "+esc(nm):"")+'. Have <b>50 bonus points</b> instead — and try another pack in the Grown-ups page.</p>';
    } else {
      if(!S.stickers) S.stickers={};
      S.stickers[st.id]=today();
      addStarPoints(25);
      play("levelup");
      var rar = st.r===3 ? '<span class="pill" style="background:#F0E2FB">✨ RARE</span>'
              : st.r===2 ? '<span class="pill" style="background:#DBEDF9">UNCOMMON</span>'
              : '<span class="pill" style="background:#D9EEDD">COMMON</span>';
      var got = packStickers().filter(function(x){ return haveSticker(x.id); }).length;
      inner.innerHTML='<div class="eyebrow">New sticker unlocked</div>'+
        '<h2>'+(isDino?"🦖 ":"🚀 ")+esc(st.n)+'!</h2>'+
        '<div class="pop">'+stickerSVG(st,190)+'</div>'+
        rar+'<p style="margin-top:10px"><b>Did you know?</b> '+esc(st.f)+'</p>'+
        '<p class="dsp" style="font-size:20px">+25 bonus points'+(nm?", "+esc(nm)+"!":"!")+'</p>'+
        '<p class="notice">'+got+' of '+packStickers().length+' collected.</p>';
    }
    var row=el("div","row"); row.style.justifyContent="center";
    var den=el("button","btn btn-plum","🦕 See my collection");
    den.onclick=function(){ box.remove(); go("den"); };
    var back=el("button","btn btn-grass","Keep playing →");
    back.onclick=function(){ box.remove(); };
    row.appendChild(back); row.appendChild(den);
    inner.appendChild(row);
    save();
    drawJar();
  }
}

/* ---------- the collection screen ---------- */
function showDen(){
  var m=$("#main");
  var pk = packOf()==="space" ? PACKS[1] : PACKS[0];
  var mine = packStickers();
  var got = mine.filter(function(s){ return haveSticker(s.id); });
  var nm = firstName();
  var head=el("section","panel tint-grass");
  head.innerHTML='<div class="eyebrow">Your collection</div>'+
    '<h1>'+pk.e+' '+(nm?esc(nm)+"'s ":"")+(packOf()==="dino"?"Dino Den":"Space Station")+'</h1>'+
    '<p>You have discovered <b>'+got.length+' of '+mine.length+'</b>. Fill the star jar to hatch the next one!</p>'+
    '<div class="bar b-plum"><i style="width:'+Math.round(got.length/mine.length*100)+'%"></i></div>'+
    '<p class="notice">Answer a question correctly → a star pops out → drag it into your jar. Ten stars hatches a new '+(packOf()==="dino"?"dinosaur":"sticker")+'.</p>';
  m.appendChild(head);

  var jarP=el("section","panel tint-sun");
  jarP.innerHTML='<h2>⭐ Your jar right now</h2><p class="dsp" style="font-size:26px">'+(S.stars||0)+' / '+STARS_PER_EGG()+' stars</p>'+
    '<div class="bar b-sun"><i style="width:'+Math.round((S.stars||0)/STARS_PER_EGG()*100)+'%"></i></div>'+
    '<p class="notice">Only '+(STARS_PER_EGG()-(S.stars||0))+' more to go!</p>';
  if(S.jarOn===false){
    var showBtn=el("button","btn btn-sm btn-grass","Show the floating jar again");
    showBtn.onclick=function(){ S.jarOn=true; save(); mountJar(); go("den"); };
    jarP.appendChild(showBtn);
  }
  m.appendChild(jarP);

  var grid=el("section","panel");
  grid.innerHTML='<h2>'+(packOf()==="dino"?"Every dinosaur":"Every sticker")+'</h2>';
  var g=el("div","grid"); g.style.gridTemplateColumns="repeat(auto-fill,minmax(160px,1fr))";
  mine.forEach(function(s){
    var have=haveSticker(s.id);
    var c=el("div","stickerCard"+(have?" have":""));
    c.innerHTML = have
      ? stickerSVG(s,130)+'<b class="dsp">'+esc(s.n)+'</b><span class="notice">'+esc(s.f)+'</span>'
      : '<div class="silh">'+stickerSVG(s,130)+'</div><b class="dsp">???</b><span class="notice">Not hatched yet</span>';
    g.appendChild(c);
  });
  grid.appendChild(g);
  m.appendChild(grid);

  var go2=el("section","panel");
  go2.innerHTML='<h2>Earn more stars</h2>';
  var r=el("div","row");
  var rec=recommend();
  var b1=el("button","btn btn-lg btn-grass","▶ Play "+rec.c.t); b1.onclick=function(){ go("concept", rec.c.id); };
  var b2=el("button","btn btn-lg btn-sun","🧠 Brain Boost"); b2.onclick=function(){ go("boost"); };
  r.appendChild(b1); r.appendChild(b2);
  go2.appendChild(r);
  m.appendChild(go2);
}
</script>
<script>
"use strict";
