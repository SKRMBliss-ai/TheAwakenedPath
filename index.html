    <!-- SEO & Discovery ────────────────────────────────────────────────────
         These are the defaults for the SPA shell, which is served at the ROOT
         of www.skrmblissai.in — so they describe the Soulful Intelligence
         studio home, not the app. Individual routes (the course page, the
         quiz, /aboutmindgym) override title/description/canonical at runtime
         via usePageSeo; before that runs, a crawler should be told the root is
         the studio home rather than /mindgym.

         og:image points at the logo because the previous og-preview.png did
         not exist — both /og-preview.png and /mindgym/og-preview.png returned
         the SPA's HTML, so every social share had a broken preview. -->
    <title>Soulful Intelligence — Where Soul Meets Intelligence</title>
    <meta name="description" content="A studio for a quieter mind and braver ideas. Home of Mind Gym, guided courses on emotions and presence, free wellbeing tools, and pay-what-you-feel digital services for brands and startups." />
    <meta name="keywords" content="Soulful Intelligence, Mind Gym, meditation app, emotional health, feelings and emotions course, mindfulness, presence, habit tracker, digital services, pay what you feel" />
    <meta name="author" content="Soulful Intelligence Studio" />

    <!-- AI & Social Media (OpenGraph) -->
    <meta property="og:site_name" content="Soulful Intelligence Studio" />
    <meta property="og:title" content="Soulful Intelligence — Where Soul Meets Intelligence" />
    <meta property="og:description" content="A studio for a quieter mind and braver ideas — a daily wellbeing app, guided courses, free tools, and digital services. All pay-what-you-feel." />
    <meta property="og:image" content="https://www.skrmblissai.in/og/home.png" />
    <meta property="og:url" content="https://www.skrmblissai.in/" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X -->

    <meta name="twitter:title" content="Soulful Intelligence — Where Soul Meets Intelligence" />
    <meta name="twitter:description" content="A studio for a quieter mind and braver ideas. Mind Gym, guided courses, free tools — all pay-what-you-feel." />
    <meta name="twitter:image" content="https://www.skrmblissai.in/og/home.png" />

    <!-- Search Engine Controls -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.skrmblissai.in/" />

    <!-- Critical CSS Fallback for older mobile browsers (Samsung Internet compatibility) -->
    <style>

        --border-subtle: rgba(255,255,255,0.15);
        --border-glass: rgba(255,255,255,0.10);
        --glass-border: rgba(255,255,255,0.10);
        --glass-surface: rgba(255,255,255,0.06);
        --nav-active-bg: rgba(140,123,138,0.15);
        --nav-active-border: rgba(140,123,138,0.45);
        --chip-bg: rgba(255,255,255,0.05);
        --chip-border: rgba(255,255,255,0.12);
        --chip-selected-bg: rgba(140,123,138,0.15);
        --chip-selected-border: rgba(140,123,138,0.45);
        --card-glow-base: rgba(140,123,138,0.20);
        --card-glow-pulse: rgba(140,123,138,0.38);
        --card-glow-surge: rgba(140,123,138,0.65);
        --glow-primary: rgba(140,123,138,0.25);
        --shadow-elevated: 0 8px 32px rgba(0,0,0,0.5);
        --teal-glow: #8C7B8A;
      }
      /* Light mode for the pages that render without the app's theme provider
         (the brand home, the sales pages, the policy pages). When the Mind Gym
         app mounts it sets these same variables as inline styles on <html>,
         which take precedence — so the app keeps full control of its own theme. */
      html[data-si-theme="light"] {
        --bg-color: #F4F1EA;
        --bg-primary: #F4F1EA;
        --bg-secondary: #EAE6DC;
        --bg-body: #F4F1EA;
        --text-main: #2A2420;
        --text-primary: #2A2420;
        --text-secondary: rgba(42,36,32,0.86);
        --text-muted: rgba(42,36,32,0.72);
        --border-default: rgba(140,123,138,0.34);
        --border-subtle: rgba(140,123,138,0.20);
      }
      body {
        margin: 0;
        padding: 0;
        /* --boot-* are set by the theme bootstrap above; the literals are the
           dark fallback for the case where the script did not run. */
        background-color: var(--boot-bg, #0c0910);
        color: var(--boot-fg, #ede9e3);
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      }
    </style>

    <!-- Theme bootstrap. Runs before first paint so a visitor who chose a mode
         on any page of skrmblissai.in (home, course, app, /twinsouls) lands on
         the next one already in that mode, with no flash of the wrong one.
         The key is duplicated in src/lib/siteTheme.ts and the portfolio repo. -->
    <script>
      (function () {
        var m = 'light';
        try {
          var v = localStorage.getItem('si-theme') || localStorage.getItem('awakened-theme');
          if (v === 'dark' || v === 'light') m = v;
        } catch (e) {}
        var d = document.documentElement;
        d.dataset.siTheme = m;
        if (m === 'dark') d.classList.add('dark');
        // Paint the pre-React splash in the matching colour.
        d.style.setProperty('--boot-bg', m === 'dark' ? '#0c0910' : '#F4F1EA');
        d.style.setProperty('--boot-fg', m === 'dark' ? '#ede9e3' : '#2A2420');
      })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        if (!blockClarity && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/" + i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "wcpf89n3mu");
        }
    })();
    </script>

    <div id="root"></div>
