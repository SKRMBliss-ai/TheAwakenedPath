<!-- ══════════════════════════════════════════════════════════════════════════
     BRIDGES INTO THE ADVENTURE
     The Quest's own logic is untouched. Three wires are added:
       · every sound it plays is re-voiced through the adventure's instrument
         (kit/sound.js), so a right answer here and a right answer in Study
         Island are the same sound;
       · its badges and level-ups also find a sticker for the shared book;
       · the way home, and the adventure's sound/music/read-aloud toolbar,
         are dropped into its own top bar.
     ═══════════════════════════════════════════════════════════════════════ -->
<script src="/kids-adventure/kit/sound.js"></script>
<script src="/kids-adventure/kit/juice.js"></script>
<script src="/kids-adventure/kit/journey.js"></script>
<script>
(function () {
  var SND = window.KJA && window.KJA.sound, J = window.KJA && window.KJA.juice;
  if (!SND) return;

  /* 1 · re-voice the Quest. Its play(name) is the single place it makes
        sound, so mapping those names is the whole job. */
  var MAP = {
    right:   function () { if (J) { J.hit(document.querySelector('.q-opt.ok, .btn.on, .card') || document.body); } else SND.sfx.good(); },
    wrong:   function () { if (J) J.miss(); else SND.sfx.wrong(); },
    tap:     function () { SND.sfx.tap(); SND.haptic(10); },
    star:    function () { SND.sfx.star(); },
    finish:  function () { SND.sfx.levelUp(); if (J) J.confetti(40); },
    great:   function () { SND.sfx.win(); if (J) J.confetti(70); },
    levelup: function () { SND.sfx.levelUp(); if (J) { J.confetti(50); J.stickers.earn('y2-rank-' + (window.S && S.xp ? Math.floor(S.xp / 250) : 0), 'A new explorer level in the Year 2 Quest'); } },
    badge:   function () { SND.sfx.magic(); if (J) J.stickers.earn('y2-badge-' + (window.S && S.badges ? S.badges.length : 0), 'A Year 2 Quest badge'); }
  };
  var theirs = window.play;
  window.play = function (name) {
    if (SND.isMuted()) return;
    var f = MAP[name];
    if (f) { try { f(); return; } catch (e) {} }
    if (typeof theirs === 'function') theirs(name);      /* anything unmapped still works */
  };
  /* keep the Quest's own sound flag in step with the adventure's mute */
  try { if (typeof setSound === 'function') setSound(!SND.isMuted()); } catch (e) {}

  /* 2 · the way home and the shared toolbar, in their top bar — and the nine
        nav buttons folded away behind one of them */
  function dress() {
    var bar = document.querySelector('.topbar-in');
    if (!bar || document.getElementById('kjabar')) return;
    var home = document.createElement('a');
    home.className = 'y2home';
    home.href = '/kids-adventure/study/';
    home.innerHTML = '‹ Study Island';
    bar.insertBefore(home, bar.firstChild);

    /* Fold the whole nav strip into one button. It opens on hover for a
       pointer and on tap for a finger, closes on Escape, on a click outside,
       and on any choice made inside it — so the lesson gets the screen back
       the moment a child has gone somewhere. */
    var nav = bar.querySelector('.nav');
    if (nav) {
      var places = document.createElement('div');
      places.className = 'y2places';
      places.innerHTML = '<button class="y2trig" type="button" aria-expanded="false" ' +
        'aria-label="Places to go">🧭 <span class="lbl">Places</span> <span class="chev">▾</span></button>' +
        '<div class="y2panel"></div>';
      bar.insertBefore(places, nav);
      places.querySelector('.y2panel').appendChild(nav);
      var trig = places.querySelector('.y2trig');
      var hoverable = matchMedia('(hover:hover) and (pointer:fine)').matches;
      /* Hover opens it and leaving closes it again — but a CLICK pins it open,
         because a menu that shuts the instant you click the button you just
         hovered is a menu that cannot be used with a mouse at all. Clicking a
         pinned menu closes it. On a touch screen there is no hover, so the
         click is the only thing that opens it. */
      var pinned = false, shut = null;
      function open(v) {
        if (v) places.setAttribute('data-open', '1'); else places.removeAttribute('data-open');
        trig.setAttribute('aria-expanded', String(!!v));
      }
      function close() { pinned = false; open(false); }
      trig.addEventListener('click', function (e) {
        e.stopPropagation();
        clearTimeout(shut);
        if (pinned) { close(); SND.sfx.tap(); }
        else { pinned = true; open(true); SND.sfx.page(); }
      });
      if (hoverable) {
        places.addEventListener('pointerenter', function () { clearTimeout(shut); open(true); });
        places.addEventListener('pointerleave', function () {
          if (pinned) return;
          shut = setTimeout(function () { open(false); }, 260);
        });
      }
      /* anything chosen inside closes it */
      nav.addEventListener('click', function (e) {
        if (e.target.closest('.btn') && !e.target.closest('.searchbox')) close();
      });
      document.addEventListener('click', function (e) { if (!places.contains(e.target)) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    }

    var box = document.createElement('div');
    box.id = 'kjabar';
    bar.appendChild(box);
    if (window.KJA.ui) window.KJA.ui.toolbar('#kjabar');
    /* their own speaker button would fight ours */
    var sb = document.getElementById('soundBtn');
    if (sb) sb.style.display = 'none';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', dress);
  else dress();
  setTimeout(dress, 400);

  /* 3 · the heading, folded after it has been read
        The same bold header sits above all nine steps of a concept. It stays
        long enough to read and then folds to one line, with a tap to open it
        again — the screen a child is working on should belong to the work. */
  var foldT = null;
  function foldHead() {
    clearTimeout(foldT);
    var main = document.getElementById('main');
    if (!main) return;
    var head = main.querySelector('section.panel');
    /* only on the working screens: a concept page (it has the step strip) */
    if (!head || !head.querySelector('h1') || !main.querySelector('.stepstrip')) return;
    if (head.classList.contains('y2head')) return;
    head.classList.add('y2head');
    var btn = document.createElement('button');
    btn.className = 'y2fold'; btn.type = 'button';
    function label() {
      var slim = head.classList.contains('slim');
      btn.textContent = slim ? 'More ▾' : 'Hide ▴';
      btn.setAttribute('aria-label', slim ? 'Show the whole heading' : 'Fold the heading away');
      btn.setAttribute('aria-expanded', String(!slim));
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      head.classList.toggle('slim'); label(); SND.sfx.tap();
    });
    head.appendChild(btn);
    /* a tap anywhere on the folded strip opens it too — a small target on a
       phone is not a target */
    head.addEventListener('click', function () {
      if (head.classList.contains('slim')) { head.classList.remove('slim'); label(); SND.sfx.tap(); }
    });
    label();
    foldT = setTimeout(function () {
      if (!head.classList.contains('slim')) { head.classList.add('slim'); label(); }
    }, 7000);
  }

  /* 4 · surprises wait for a gap
        Their egg hatches the instant the tenth star lands, which is very
        often the middle of a round. It is now held until the child has moved
        on — a new screen, or the end of a round — which is the only moment a
        full-screen surprise is a reward rather than an interruption. */
  var waiting = [];
  var theirHatch = window.hatchEgg;
  if (typeof theirHatch === 'function') {
    window.hatchEgg = function () {
      var J2 = window.KJA && window.KJA.journey;
      /* mid-round: queue it. Otherwise it can go now. */
      if (J2 && J2.hold.isOpen()) { J2.hold.push(run); return; }
      if (document.querySelector('#qrOpts .opt:not([disabled]), .opts .opt:not([disabled])')) { waiting.push(run); return; }
      run();
      function run() { try { theirHatch(); } catch (e) {} }
    };
  }
  /* a new screen is a safe gap */
  function flush() {
    if (!waiting.length) return;
    if (document.querySelector('.modal')) return;
    if (document.querySelector('#qrOpts .opt:not([disabled]), .opts .opt:not([disabled])')) return;
    (waiting.shift())();
  }
  var main0 = document.getElementById('main');
  if (main0 && window.MutationObserver) {
    var mo = new MutationObserver(function () {
      clearTimeout(mo.t);
      mo.t = setTimeout(function () { foldHead(); flush(); }, 260);
    });
    mo.observe(main0, { childList: true });
  }
  foldHead();

  /* 5 · the shared jar, the buddy's own voice, and the way back in */
  var J3 = window.KJA && window.KJA.journey;
  if (J3) {
    J3.visit.mark('quest', 'Year 2 Learning Quest');
    /* the Quest is where the dinosaurs live, so its roars are worth having
       ready before a child reaches the den */
    SND.preload(['dino-roar', 'dino-chirp', 'magic-twinkle']);
    MAP.badge = function () {
      SND.sfx.twinkle();
      if (J) J.stickers.earn('y2-badge-' + (window.S && S.badges ? S.badges.length : 0), 'A Year 2 Quest badge');
      J3.surprise('A new Quest badge');
    };
    MAP.levelup = function () {
      SND.sfx.levelUp();
      if (J) { J.confetti(50); J.stickers.earn('y2-rank-' + (window.S && S.xp ? Math.floor(S.xp / 250) : 0), 'A new explorer level in the Year 2 Quest'); }
      J3.surprise('A new explorer level');
    };
  }
})();
</script>
