<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Kids Learning Adventure — Song Adventure and Art Adventure">
  <defs>
    <style>
      .r{font-family:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-weight:800}
      .h{font-family:'Patrick Hand','Comic Sans MS',cursive}
    </style>
    <radialGradient id="g1" cx="10%" cy="8%" r="45%">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity=".7"/><stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="92%" cy="14%" r="45%">
      <stop offset="0" stop-color="#ffe08a" stop-opacity=".8"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="85%" cy="92%" r="50%">
      <stop offset="0" stop-color="#ffc6de" stop-opacity=".7"/><stop offset="1" stop-color="#ffc6de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" rx="26" fill="#FFF9EF"/>
  <rect width="640" height="420" rx="26" fill="url(#g1)"/>
  <rect width="640" height="420" rx="26" fill="url(#g2)"/>
  <rect width="640" height="420" rx="26" fill="url(#g3)"/>

  <text class="r" x="320" y="52" text-anchor="middle" font-size="15" letter-spacing="3" fill="#8a7a5c">SOULFUL INTELLIGENCE STUDIOS</text>
  <text class="r" x="320" y="100" text-anchor="middle" font-size="42" fill="#2A3A5C">Kids Learning Adventure</text>
  <text class="h" x="320" y="128" text-anchor="middle" font-size="20" fill="#2A3A5C" opacity=".85">Two quests, one home — music and art</text>

  <!-- Song Adventure card -->
  <g>
    <rect x="42" y="156" width="258" height="224" rx="22" fill="#ffffff"/>
    <rect x="42" y="156" width="258" height="224" rx="22" fill="none" stroke="#e6d6b8" stroke-width="3"/>
    <rect x="64" y="176" width="72" height="24" rx="12" fill="#2F7FD1"/>
    <text class="r" x="100" y="193" text-anchor="middle" font-size="13" fill="#fff" letter-spacing="2">MUSIC</text>
    <g transform="translate(64,214) scale(0.72)">
      <rect x="0" y="30" width="240" height="76" rx="10" fill="#2A3A5C"/>
      <g fill="#fff">
        <rect x="8" y="36" width="30" height="64" rx="5"/><rect x="40" y="36" width="30" height="64" rx="5"/>
        <rect x="72" y="36" width="30" height="64" rx="5"/><rect x="104" y="36" width="30" height="64" rx="5"/>
        <rect x="136" y="36" width="30" height="64" rx="5"/><rect x="168" y="36" width="30" height="64" rx="5"/>
        <rect x="200" y="36" width="32" height="64" rx="5"/>
      </g>
      <g fill="#2A3A5C">
        <rect x="28" y="36" width="18" height="38" rx="4"/><rect x="60" y="36" width="18" height="38" rx="4"/>
        <rect x="124" y="36" width="18" height="38" rx="4"/><rect x="156" y="36" width="18" height="38" rx="4"/>
        <rect x="188" y="36" width="18" height="38" rx="4"/>
      </g>
      <g fill="#2F7FD1">
        <circle cx="46" cy="16" r="11"/><rect x="55" y="-14" width="5" height="32" rx="2.5"/>
        <circle cx="132" cy="8" r="9" fill="#FFC23D"/><rect x="139" y="-16" width="4.5" height="26" rx="2" fill="#FFC23D"/>
      </g>
    </g>
    <text class="r" x="64" y="326" font-size="24" fill="#2A3A5C">Song Adventure</text>
    <text class="h" x="64" y="352" font-size="17" fill="#2A3A5C" opacity=".9">Their first piano song, in five levels</text>
  </g>

  <!-- Art Adventure card -->
  <g>
    <rect x="340" y="156" width="258" height="224" rx="22" fill="#ffffff"/>
    <rect x="340" y="156" width="258" height="224" rx="22" fill="none" stroke="#e6d6b8" stroke-width="3"/>
    <rect x="362" y="176" width="58" height="24" rx="12" fill="#43A857"/>
    <text class="r" x="391" y="193" text-anchor="middle" font-size="13" fill="#fff" letter-spacing="2">ART</text>
    <g transform="translate(362,212)">
      <rect x="0" y="0" width="164" height="104" rx="8" fill="#FFF9EF" stroke="#e6d6b8" stroke-width="3"/>
      <circle cx="46" cy="34" r="17" fill="#FFC23D"/>
      <path d="M10 94 L44 50 L72 94 Z" fill="#43A857"/>
      <path d="M62 94 L104 40 L136 94 Z" fill="#2F7FD1"/>
      <path d="M104 16c9-7 18-7 27 0" stroke="#E9528F" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g>
        <rect x="176" y="18" width="17" height="68" rx="5" fill="#E9528F" transform="rotate(11 184 52)"/>
        <rect x="198" y="28" width="15" height="58" rx="5" fill="#FFC23D" transform="rotate(-9 205 57)"/>
      </g>
    </g>
    <text class="r" x="362" y="336" font-size="24" fill="#2A3A5C">Art Adventure</text>
    <text class="h" x="362" y="360" font-size="17" fill="#2A3A5C" opacity=".9">A drawing quest a day, kept in their gallery</text>
  </g>
</svg>
