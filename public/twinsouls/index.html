    <!-- This page ships to skrmblissai.in/twinsouls and is listed in that site's
         sitemap.xml, so it is submitted for indexing and gets shared like any

         and had no canonical. Mirrored into
         AwakenedPath/public/twinsouls/index.html — keep the two in sync. -->

    <meta property="og:site_name" content="Soulful Intelligence Studio" />
    <meta property="og:type" content="website" />

    <!-- Theme bootstrap. Runs before first paint so a visitor who chose a mode
         elsewhere on skrmblissai.in (home, course, Mind Gym) lands here already
         in that mode, with no flash of the wrong one. The key is duplicated in
         src/siteTheme.ts and in the main site's index.html — keep them equal. -->
    <script>
      (function () {
        var m = 'light';
        try {
          var v = localStorage.getItem('si-theme') || localStorage.getItem('awakened-theme');
          if (v === 'dark' || v === 'light') m = v;
        } catch (e) {}
        var d = document.documentElement;
        d.dataset.siTheme = m;
        if (m === 'dark') { d.classList.add('dark'); }
        d.style.setProperty('--boot-bg', m === 'dark' ? '#15120F' : '#F4F1EA');
      })();
    </script>
    <style>
      html { background: var(--boot-bg, #F4F1EA); }
    </style>
